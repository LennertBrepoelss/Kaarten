        <p class="lead">${when} betaalt iedereen zijn deel: ${c.pct.map((v, i) => `${ORD[i]} ${v}%`).join(' · ')}.</p></section>
      <form id="gPriceForm" class="steps" autocomplete="off">
        ${calcHTML()}
        ${last ? `<div><button type="button" class="chip" data-act="setprice" data-v="${last}">Zelfde als vorige · ${euro(last)}</button></div>` : ''}
        <p class="err" id="priceErr" style="min-height:0"></p>
        <button class="btn primary xl" type="submit">${S.game === 'wiezen' ? 'Naar het spelletje' : 'Start het rondje'} <span class="arr">→</span></button>
      </form>
    </div>`;
  }

  // Wat iedereen betaalt voor een uitgespeeld rondje
  function rondjeRows(g, r) {
    const tot = PG[g].tot(r);
    const { out, place, order, tied } = wPayPct(tot, r.pct);
    return order.map((i) => `<div class="srow" style="--pc:var(--p${i})"><span class="who">${P(i)}<span class="meta">${tied[i] ? 'gedeeld ' : ''}${ORD[place[i]]} · ${ptsLabel(g, tot[i])} · ${fmtPct(out[i])}</span></span>
      <span class="owe ${out[i] ? '' : 'zero'}">${euro(r.price * out[i] / 100)}</span></div>`).join('');
  }
  // Wat iedereen deze avond al moet betalen, over alle spellen samen
  function avondPanel() {
    const A = owedAll();
    if (!A.n) return '';
    return `<section class="panel"><div class="panel-head"><h2>Te betalen vanavond</h2><span class="label" style="white-space:nowrap">${euro(A.total)}</span></div>
      <div>${S.players.map((p, i) => `<div class="srow" style="--pc:var(--p${i})"><span class="who">${esc(p)}</span><span class="owe ${A.owed[i] ? '' : 'zero'}">${euro(A.owed[i])}</span></div>`).join('')}</div></section>`;
  }
  const gameHeader = (name) => `<header class="top"><div class="brand">${name}</div><div style="display:flex;gap:12px;align-items:center">${syncChip()}<button class="btn ghost sm" data-act="toChoose">Ander spel</button></div></header>`;

  // ---------- Wiezen: stand ----------
  function wRoundText(r) {
    const b = wbid(r.k);
    const extra = b.extra && r.diff ? ` (${r.made ? '+' : '−'}${r.diff})` : '';
    return `${esc(b.n)} · ${r.sel.map(P).join(' &amp; ')} · ${r.made ? 'gehaald' : 'niet gehaald'}${extra}`;
  }
  function renderWGame() {
    const W = S.wz, c = openOf(W), last = lastOf(W), nr = W.rondjes.length, r = c || last;
    let head, main, stand = '';
    if (c) {
      const k = c.games.length, tot = wTot(c);
      const { out, place, order, tied } = wPayPct(tot, c.pct);
      head = `<p class="label">${esc(today())} · rondje ${nr} · ${euro(c.price)}</p>
        <h1>Spelletje <em>${k + 1}</em>${c.per > 1 ? ` <span class="of">van ${c.per}</span>` : ''}</h1><p class="lead">${P(W.dealer)} deelt.</p>`;
      main = `<button class="btn primary xl" data-act="wNew">Nieuw spelletje <span class="arr">→</span></button>`;
      if (k) {
        stand = `<section class="panel"><div class="panel-head"><h2>Stand van dit rondje</h2><button class="link" data-act="wNextDealer">Volgende deler</button></div>
          <div>${order.map((i) => `<div class="srow" style="--pc:var(--p${i})"><span class="who">${P(i)}${W.dealer === i ? '<small class="dl">deler</small>' : ''}
            <span class="meta">${tied[i] ? 'gedeeld ' : ''}${ORD[place[i]]} · betaalt nu ${euro(c.price * out[i] / 100)}</span></span>
            <span class="pts ${pn(tot[i])}">${sign(tot[i])}</span></div>`).join('')}</div></section>`;
      }
    } else if (last) {
      head = `<p class="label">${esc(today())} · ${nr} rondje${nr > 1 ? 's' : ''}</p><h1>Rondje <em>${nr}</em> gedaan</h1><p class="lead">${P(W.dealer)} deelt het volgende spelletje.</p>`;
      main = `<button class="btn primary xl" data-act="gNewRondje">Nieuw rondje <span class="arr">→</span></button>`;
      stand = `<section class="panel"><div class="panel-head"><h2>Rondje ${nr} · ${euro(last.price)}</h2><span class="label">te betalen</span></div><div>${rondjeRows('wiezen', last)}</div></section>`;
    } else {
      head = `<p class="label">${esc(today())}</p><h1>Een nieuwe <em>wiesavond</em></h1><p class="lead">Elk rondje begint met de vraag wat het kost. Na het rondje betaalt iedereen zijn deel, volgens zijn plaats.</p>`;
      main = `<button class="btn primary xl" data-act="gNewRondje">Nieuw rondje <span class="arr">→</span></button>`;
    }
    const games = r ? r.games : [];
    const hist = games.map((g, i) => `<div class="hrow"><span class="n">${i + 1}</span><span>${wRoundText(g)}</span><span class="sc ${pn(g.d[g.sel[0]])}">${sign(g.d[g.sel[0]])}</span></div>`).reverse().join('');
    return `<div class="wrap">
      ${gameHeader('Wiezen')}
      <section>${head}</section>
      ${main}
      ${stand}
      ${avondPanel()}
      ${games.length ? `<section class="panel"><div class="panel-head"><h2>Gespeeld</h2><button class="btn soft sm" data-act="wUndo">Laatste ongedaan</button></div><div>${hist}</div></section>` : ''}
      <p class="hint" style="text-align:center">Per rondje: ${W.pct.map((v, i) => `${ORD[i]} ${v}%`).join(' · ')} · ${W.per === 1 ? '1 spelletje' : `${W.per} spelletjes`} · <button class="link" data-act="wEditPct">aanpassen</button></p>
      <button class="link" data-act="wPts" style="align-self:center">Puntentabel bekijken of aanpassen</button>
      ${renderHistory()}
    </div>${dock()}`;
  }

  // ---------- Wiezen: een spelletje ingeven ----------
  function renderWRound() {
    const R = ui.wr, b = R.k ? wbid(R.k) : null, need = b ? (b.duo ? 2 : 1) : 0, c = openOf(S.wz);
    const ready = !!b && R.sel.length === need;
    const d = ready && R.made !== null ? wDelta(R.k, R.sel, R.made, R.diff) : null;
    const who = ready ? (need === 2 ? 'Hebben ze het gehaald?' : `Heeft ${P(R.sel[0])} het gehaald?`) : 'Gehaald?';
    const extra = b && b.extra && R.made !== null ? `<div class="pctrow"><span class="pl">${R.made ? 'Extra slagen' : 'Slagen te weinig'}<small>${R.made ? `boven de ${b.min}${b.cap ? `, telt tot ${b.cap} extra` : ''}` : `onder de ${b.min}`}</small></span>
      <div class="stepper"><button type="button" data-act="wDiff" data-v="-1" aria-label="Minder">−</button><output>${R.diff}</output><button type="button" data-act="wDiff" data-v="1" aria-label="Meer">+</button></div></div>` : '';
    return `<div class="wrap">
      <header class="top"><button class="btn ghost sm" data-act="wCancel">← Annuleer</button><span class="label">Rondje ${S.wz.rondjes.length} · spelletje ${c ? c.games.length + 1 : 1} · ${P(S.wz.dealer)} deelt</span></header>
      <section class="steps">
        <div class="step"><div class="slabel"><span class="no">1</span><span class="label">Wat wordt er gespeeld?</span></div>
          <div class="seg">${WBIDS.map((x) => `<button class="opt ${R.k === x.k ? 'on' : ''}" data-act="wBid" data-v="${x.k}"><span class="big">${x.n}</span><small>${x.need} · ${wpts(x.k)} ptn</small></button>`).join('')}</div></div>
        <div class="step ${b ? '' : 'wait'}" id="wstep2"><div class="slabel"><span class="no">2</span><span class="label">${b && b.duo ? 'Welke 2 spelen samen?' : 'Wie speelt?'}</span></div>
          <div class="seg">${S.players.map((p, i) => `<button class="opt ${R.sel.includes(i) ? 'who-on' : ''}" data-act="wPick" data-v="${i}" style="--pc:var(--p${i})"><span class="big">${esc(p)}</span></button>`).join('')}</div></div>
        <div class="step ${ready ? '' : 'wait'}" id="wstep3"><div class="slabel"><span class="no">3</span><span class="label">${who}</span></div>
          <div class="seg"><button class="opt res ${R.made === true ? 'on' : ''}" data-act="wMade" data-v="1"><span class="big">Gehaald</span></button><button class="opt res lose ${R.made === false ? 'on' : ''}" data-act="wMade" data-v="0"><span class="big">Niet gehaald</span></button></div>
          ${extra}</div>
      </section>
      ${d ? `<section class="panel"><h2>Punten</h2><div class="dgrid">${d.map((v, j) => `<div class="dcell"><span>${P(j)}</span><b class="${pn(v)}">${sign(v)}</b></div>`).join('')}</div></section>` : ''}
      <button class="btn primary xl" data-act="wSave" ${d ? '' : 'disabled'}>Bewaar spelletje <span class="arr">→</span></button>
    </div>`;
  }

  // ---------- Hartenjagen: stand ----------
  function renderHGame() {
    const H = S.hj, c = openOf(H), last = lastOf(H), nr = H.rondjes.length, r = c || last;
    let head, main, stand = '';
    if (c) {
      const n = c.hands.length, tot = hTot(c);
      const { out, place, order, tied } = wPayPct(tot, c.pct);
      head = `<p class="label">${esc(today())} · rondje ${nr} · ${euro(c.price)}</p>
        <h1>${n ? `Hand <em>${n + 1}</em>` : 'Iedereen op <em>100</em>'}</h1>
        <p class="lead">${P(H.dealer)} deelt · ${PASS[n % 4]}. Elke ♥ kost 1 punt, de schoppen vrouw 13. Wie eerst op 0 staat, verliest het rondje.</p>`;
      main = `<button class="btn primary xl" data-act="hNew">Nieuwe hand <span class="arr">→</span></button>`;
      stand = `<section class="panel"><div class="panel-head"><h2>Stand</h2><button class="link" data-act="hNextDealer">Volgende deler</button></div>
        <div>${order.map((i) => `<div class="hjrow" style="--pc:var(--p${i})">
          <div class="hjtop"><span class="who">${P(i)}${H.dealer === i ? '<small class="dl">deler</small>' : ''}</span><span class="hjnum">${tot[i]}</span></div>
          <div class="hjbar"><i style="width:${Math.max(0, Math.min(100, tot[i]))}%"></i></div>
          <span class="meta">${n ? `${tied[i] ? 'gedeeld ' : ''}${ORD[place[i]]} · betaalt nu ${euro(c.price * out[i] / 100)}` : 'nog niets gepakt'}</span></div>`).join('')}</div></section>`;
    } else if (last) {
      const tot = hTot(last);
      const out0 = [0, 1, 2, 3].filter((i) => tot[i] <= 0).map(P).join(' &amp; ');
      head = `<p class="label">${esc(today())} · ${nr} rondje${nr > 1 ? 's' : ''}</p><h1>Rondje <em>${nr}</em> gedaan</h1><p class="lead">${out0} staat op 0. In het volgende rondje begint iedereen weer op 100.</p>`;
      main = `<button class="btn primary xl" data-act="gNewRondje">Nieuw rondje <span class="arr">→</span></button>`;
      stand = `<section class="panel"><div class="panel-head"><h2>Rondje ${nr} · ${euro(last.price)}</h2><span class="label">te betalen</span></div><div>${rondjeRows('harten', last)}</div></section>`;
    } else {
      head = `<p class="label">${esc(today())}</p><h1>Iedereen op <em>100</em></h1><p class="lead">Elk rondje begint met de vraag wat het kost. Wie eerst op 0 staat, verliest het rondje. Dan betaalt iedereen zijn deel, volgens zijn plaats.</p>`;
      main = `<button class="btn primary xl" data-act="gNewRondje">Nieuw rondje <span class="arr">→</span></button>`;
    }
    const hands = r ? r.hands : [];
    const hist = hands.map((h, k) => {
      const txt = h.moon !== null && h.moon !== undefined ? `<b>${P(h.moon)}</b> pakte alles, de anderen −26`
        : h.p.map((v, i) => (v ? `${P(i)} −${v}${h.q === i ? ' (♠V)' : ''}` : '')).filter(Boolean).join(' · ') || 'niemand punten';
      return `<div class="hrow"><span class="n">${k + 1}</span><span>${txt}</span><span></span></div>`;
    }).reverse().join('');
    return `<div class="wrap">
      ${gameHeader('Hartenjagen')}
      <section>${head}</section>
      ${main}
      ${stand}
      ${avondPanel()}
      ${hands.length ? `<section class="panel"><div class="panel-head"><h2>Gespeeld</h2><button class="btn soft sm" data-act="hUndo">Laatste ongedaan</button></div><div>${hist}</div></section>` : ''}
      <p class="hint" style="text-align:center">Per rondje: ${H.pct.map((v, i) => `${ORD[i]} ${v}%`).join(' · ')} · <button class="link" data-act="wEditPct">aanpassen</button></p>
      ${renderHistory()}
    </div>${dock()}`;
  }

  // ---------- Hartenjagen: een hand ingeven ----------
  function hRoundSum() {
    const R = ui.hr;
    if (R.moon !== null) return `<div class="sumline"><span class="label">Controle</span><span class="ok">${P(R.moon)} pakte alles: de anderen −26</span></div>`;
    const hearts = R.p.reduce((a, b) => a + b, 0);
    const ok = hearts === 13 && R.q !== null;
    return `<div class="sumline"><span class="label">Controle</span><span class="${ok ? 'ok' : 'bad'}">♥ ${hearts} van 13 · ♠V ${R.q !== null ? P(R.q) : 'nog niet gekozen'}</span></div>
      ${ok ? '' : '<p class="hint">Normaal zijn er 13 harten en 1 schoppen vrouw per hand. Je kan toch bewaren, bijvoorbeeld als jullie met andere regels spelen.</p>'}`;
  }
  function hAfter(i) {
    const tot = hTot(openOf(S.hj)), pts = hjPts(ui.hr), v = tot[i] - pts[i];
    return `${tot[i]} → <b class="${v <= 0 ? 'neg' : ''}">${v < 0 ? '−' + Math.abs(v) : v}</b>`;
  }
  function renderHRound() {
    const R = ui.hr, c = openOf(S.hj), n = c ? c.hands.length : 0, moon = R.moon !== null, pts = hjPts(R);
    const rows = S.players.map((p, i) => `<div class="pctrow" style="--pc:var(--p${i})"><span class="pl">${esc(p)}<small id="hto${i}">${hAfter(i)}</small></span>
      <div class="stepper"><button type="button" data-act="hStep" data-i="${i}" data-v="-1" aria-label="1 hart minder" ${moon ? 'disabled' : ''}>−</button><input id="hp${i}" inputmode="numeric" maxlength="2" value="${moon ? pts[i] : R.p[i]}" ${moon ? 'disabled' : ''} aria-label="Harten van ${esc(p)}"><button type="button" data-act="hStep" data-i="${i}" data-v="1" aria-label="1 hart meer" ${moon ? 'disabled' : ''}>+</button><button type="button" class="qv ${R.q === i && !moon ? 'on' : ''}" data-act="hQueen" data-i="${i}" aria-label="Schoppen vrouw, 13 punten" ${moon ? 'disabled' : ''}>♠V</button></div></div>`).join('');
    return `<div class="wrap">
      <header class="top"><button class="btn ghost sm" data-act="hCancel">← Annuleer</button><span class="label">Rondje ${S.hj.rondjes.length} · hand ${n + 1} · ${P(S.hj.dealer)} deelt</span></header>
      <section><p class="label">${PASS[n % 4]}</p><h1>Wie pakte <em>wat</em>?</h1>
        <p class="lead">Tel per speler de harten. Tik op ♠V bij wie de schoppen vrouw pakte (13 punten).</p></section>
      <section class="panel" style="gap:0;padding-block:6px">${rows}</section>
      <div id="hsum" class="steps" style="gap:8px">${hRoundSum()}</div>
      <div class="step"><span class="label">Pakte iemand alles? (13 ♥ én de ♠V)</span>
        <div class="chips">${S.players.map((p, i) => `<button class="chip ${R.moon === i ? 'on' : ''}" data-act="hMoon" data-v="${i}">${esc(p)}</button>`).join('')}</div>
        <p class="hint">Dan gaat er bij de 3 anderen 26 af en bij hem niets.</p></div>
      <button class="btn primary xl" data-act="hSave" id="hSave" ${pts.some((v) => v > 0) ? '' : 'disabled'}>Bewaar hand <span class="arr">→</span></button>
    </div>`;
  }
  function updateHRound() {
    [0, 1, 2, 3].forEach((i) => { const el = document.getElementById('hto' + i); if (el) el.innerHTML = hAfter(i); });
    const s = document.getElementById('hsum'); if (s) s.innerHTML = hRoundSum();
    const b = document.getElementById('hSave'); if (b) b.disabled = !hjPts(ui.hr).some((v) => v > 0);
  }

  // ---------- Schermen ----------
  function renderHome() {
    const done = finished();
    const { owed } = owedAll();
    const nr = S.rounds.length + 1;
    const total = done.reduce((t, r) => t + r.price, 0);
    const rows = S.players.map((p, i) => `
      <div class="srow" style="--pc:var(--p${i})"><span class="who">${esc(p)}</span>
      <span class="owe ${owed[i] ? '' : 'zero'}">${euro(owed[i])}</span></div>`).join('');
    const list = done.slice().reverse().map((r) => {
      const idx = S.rounds.indexOf(r) + 1;
      const isLast = r === S.rounds[S.rounds.length - 1];
      return `<div class="rround"><span class="no">${idx}</span>
        <div class="txt"><span class="t${r.winner} tc" style="font-weight:600">${tName(r, r.winner)}</span> wonnen<br><span class="muted">${tName(r, 1 - r.winner)} betalen</span>
        ${isLast ? `<br><button class="link" data-act="reopen">Heropen dit rondje</button>` : ''}</div>
        <div class="amt">${euro(r.price)}<small>${euro(r.price / 2)} p.p.</small></div></div>`;
    }).join('');
    return `<div class="wrap">
      <header class="top"><div class="brand">Troeven</div>
        <div style="display:flex;gap:12px;align-items:center"><span class="sync ${ui.synced ? 'on' : ''}">${ui.synced ? 'Bewaard' : 'Op dit toestel'}</span><button class="btn ghost sm" data-act="toChoose">Ander spel</button></div></header>
      <section>
        <p class="label">${esc(today())}${done.length ? ` · ${done.length} rondje${done.length > 1 ? 's' : ''} · ${euro(total)}` : ''}</p>
        <h1>${done.length ? `Rondje <em>${nr}</em>` : 'Een nieuwe <em>avond</em>'}</h1>
        <p class="lead">Elk rondje trekken jullie boeren: de eerste twee met een boer spelen samen. Wie eerst zijn boom van tien streepjes kwijt is, wint. De verliezers betalen het rondje.</p>
      </section>
      <button class="btn primary xl" data-act="draw">Trek boeren <span class="arr">→</span></button>
      <section class="panel"><div class="panel-head"><h2>Stand van de avond</h2><span class="label">te betalen</span></div>
        <div>${rows}</div></section>
      ${renderStats()}
      ${done.length ? `<section class="panel"><h2>Rondjes</h2><div>${list}</div></section>` : ''}
      ${renderHistory()}
    </div>${dock()}`;
  }

  const SUIT_GLYPH = { s: '♠︎', h: '♥︎', k: '♣︎', r: '♦︎' };
  const cardFace = (c) => {
    const red = c.s === 'h' || c.s === 'r';
    const court = isNaN(+c.r);
    const g = SUIT_GLYPH[c.s];
    return `<div class="face ${red ? 'red' : ''}"><span class="ix">${c.r}<i>${g}</i></span>
      <span class="mid ${court ? 'court' : ''}">${court ? c.r : g}</span><span class="ix br">${c.r}<i>${g}</i></span></div>`;
  };

  function renderDraw() {
    const d = ui.draw;
    const seats = S.players.map((p, i) => `<div class="seat p${i}" id="seat${i}"><span class="nm">${esc(p)}${i === d.dealer ? '<small>deler</small>' : ''}</span><div class="pile" id="pile${i}"></div></div>`).join('');
    return `<div class="wrap">
      <header class="top"><button class="btn ghost sm" data-act="home">← Terug</button><span class="label">Rondje ${S.rounds.length + 1}</span></header>
      <section><p class="label">Boeren trekken</p><h1>Wie speelt <em>met wie</em>?</h1></section>
      <div class="table" id="stage">${seats}<div class="deckpile" id="deck"></div><span class="dealer-tag">${P(d.dealer)} deelt</span></div>
      <p class="dealmsg" id="dealmsg">De eerste twee met een boer spelen samen.</p>
      <p class="skip" id="skipHint">Tik op de tafel om over te slaan</p>
      <div class="draw-actions" id="drawActions" hidden>
        <div id="drawTeams"></div>
        <button class="btn primary xl" data-act="accept">Speel met deze teams <span class="arr">→</span></button>
        <button class="btn ghost block" data-act="redraw">Opnieuw delen</button>
      </div>
    </div>`;
  }

  // ---------- Statistieken: wie wint van wie ----------
  function statRounds() {
    const night = finished();
    return ui.statScope === 'all' ? [...(S.archive || []), ...night] : night;
  }
  function renderStats() {
    const rounds = statRounds();
    const all = ui.statScope === 'all';
    const tabs = `<div class="tabs" role="tablist"><button class="${all ? '' : 'on'}" data-act="statScope" data-v="night">Vanavond</button><button class="${all ? 'on' : ''}" data-act="statScope" data-v="all">Alle avonden</button></div>`;
    if (!rounds.length) {
      return `<section class="panel"><div class="panel-head"><h2>Wie wint van wie</h2>${tabs}</div><p class="empty">Nog geen rondjes uitgespeeld${all ? '' : ' vanavond'}.</p></section>`;
    }
    const n = S.players.length;
    const st = Logic.stats(rounds, n);
    const pct = (w, p) => (p ? Math.round((w / p) * 100) : 0);
    const order = S.players.map((_, i) => i).sort((a, b) => pct(st.per[b].won, st.per[b].played) - pct(st.per[a].won, st.per[a].played) || st.per[b].won - st.per[a].won);
    const per = order.map((i) => {
      const { won, played } = st.per[i];
      return `<div class="wrow" style="--pc:var(--p${i})"><span class="who">${P(i)}</span><span class="bar"><i style="width:${pct(won, played)}%"></i></span><span class="n"><b>${won}</b> van ${played}</span></div>`;
    }).join('');
    const short = (i) => esc(S.players[i].slice(0, 3));
    const head = S.players.map((_, j) => `<th scope="col" style="color:var(--p${j})">${short(j)}</th>`).join('');
    const body = S.players.map((_, i) => `<tr><th class="rowh" scope="row" style="color:var(--p${i})">${P(i)}</th>${S.players.map((_, j) => {
      if (i === j) return '<td class="self">·</td>';
      const v = st.vs[i][j];
      if (!v.won && !v.lost) return '<td class="self">–</td>';
      return `<td class="${v.won > v.lost ? 'up' : ''}"><span class="w">${v.won}</span><span class="l">–${v.lost}</span></td>`;
    }).join('')}</tr>`).join('');
    const duos = Object.entries(st.duos).map(([k, v]) => ({ ids: k.split('-').map(Number), ...v }))
      .sort((a, b) => b.won / b.played - a.won / a.played || b.played - a.played);
    const duoHtml = duos.map((d, i) => `<div class="duo ${i === 0 && d.won ? 'best' : ''}"><span class="nm">${d.ids.map(P).join(' &amp; ')}</span><span class="n"><b>${d.won}</b> van ${d.played} gewonnen</span></div>`).join('');
    return `<section class="panel"><div class="panel-head"><h2>Wie wint van wie</h2>${tabs}</div>
      <p class="sub">Gewonnen rondjes</p><div>${per}</div>
      <p class="sub">Onderling</p>
      <div class="h2h-wrap"><table class="h2h"><thead><tr><th></th>${head}</tr></thead><tbody>${body}</tbody></table></div>
      <p class="hint">Lees per rij: zoveel keer won die speler tegen de speler bovenaan, en zoveel keer verloor die.</p>
      <p class="sub">Duo's</p><div>${duoHtml}</div>
    </section>`;
  }

  const matchupTeams = (teams) => matchup({ teams });
  function matchup(r) {
    return `<div class="matchup">
      <div class="side t0"><span class="tl">${TEAM[0]}</span><span class="nm">${r.teams[0].map(P).join('<br>')}</span></div>
      <span class="vs">tegen</span>
      <div class="side t1"><span class="tl">${TEAM[1]}</span><span class="nm">${r.teams[1].map(P).join('<br>')}</span></div></div>`;
  }

  // ---------- Rekenmachine voor de prijs ----------
  const OPS = '+−×÷';
  const fmt = (c) => (c / 100).toFixed(2).replace('.', ',');
  const trimOp = (e) => e.replace(/[+−×÷,]+$/, '');
  const calcValue = () => Logic.calc(trimOp(ui.calc.expr));
  const KEY_LABEL = { 'C': 'Wissen', '⌫': 'Laatste teken weg', '÷': 'Delen', '×': 'Maal', '−': 'Min', '+': 'Plus', '=': 'Uitrekenen', ',': 'Komma' };

  function calcHTML() {
    const keys = [['C', 'fn'], ['⌫', 'fn'], ['÷', 'op'], ['×', 'op'],
      ['7'], ['8'], ['9'], ['−', 'op'],
      ['4'], ['5'], ['6'], ['+', 'op'],
      ['1'], ['2'], ['3'], ['=', 'eq'],
      ['0', 'zero'], [',']];
    return `<div class="calc"><div class="cdisp"><span class="cur">€</span><span class="expr" id="cexpr" aria-live="polite"></span></div>
      <div class="cres" id="cres"></div>
      <div class="keys">${keys.map(([k, cls]) => `<button type="button" class="key ${cls || ''}" data-act="key" data-k="${k}" aria-label="${KEY_LABEL[k] || k}">${k}</button>`).join('')}</div></div>`;
  }

  function pressKey(k) {
    let e = ui.calc.expr;
    const lastNum = (e.match(/[\d,]*$/) || [''])[0];
    const endsOp = e !== '' && OPS.includes(e.slice(-1));
    if (k === 'C') e = '';
    else if (k === '⌫') e = e.slice(0, -1);
    else if (k === '=') { const v = Logic.calc(trimOp(e)); if (v) e = fmt(v); }
    else if (OPS.includes(k)) {
      if (!e) return;
      if (endsOp) e = e.slice(0, -1) + k;
      else { if (e.endsWith(',')) e = e.slice(0, -1); e += k; }
    } else if (k === ',') {
      if (lastNum.includes(',')) return;
      e += lastNum ? ',' : '0,';
    } else {
      if (lastNum.includes(',') && lastNum.split(',')[1].length >= 2) return;
      if (lastNum === '0') e = e.slice(0, -1);
      if (e.length >= 40) return;
      e += k;
    }
    ui.calc.expr = e;
    updateCalc();
  }

  function updateCalc() {
    const ex = document.getElementById('cexpr');
    if (!ex) return;
    const e = ui.calc.expr;
    ex.classList.toggle('ph', !e);
    ex.classList.toggle('long', e.length > 8);
    ex.innerHTML = e ? esc(e).replace(/[+−×÷]/g, (m) => `<span class="op">${m}</span>`) : '0,00';
    const t = trimOp(e), v = Logic.calc(t), hasOp = /[+−×÷]/.test(t);
    const res = document.getElementById('cres');
    if (ui.calc.target === 'gprice' && gCur()) {
      const pc = gCur().pct;
      if (!e) res.innerHTML = '<span>Iedereen betaalt een deel, volgens zijn plaats.</span>';
      else if (!v) res.innerHTML = `<span>${hasOp ? 'Dat geeft geen geldig bedrag.' : ''}</span>`;
      else res.innerHTML = `<span>${hasOp ? `Totaal ${euro(v)} · ` : ''}laatste betaalt</span><b>${euro(v * pc[3] / 100)}</b>`;
    } else if (!e) res.innerHTML = '<span>De twee verliezers delen het rondje.</span>';
    else if (!v) res.innerHTML = `<span>${hasOp ? 'Dat geeft geen geldig bedrag.' : ''}</span>`;
    else if (hasOp) res.innerHTML = `<span>Totaal ${euro(v)}</span><b>${euro(v / 2)} <span class="muted" style="font:500 12px var(--f-ui)">per verliezer</span></b>`;
    else res.innerHTML = `<span>Per verliezer</span><b>${euro(v / 2)}</b>`;
    document.querySelectorAll('.chip[data-v]').forEach((c) => c.classList.toggle('on', +c.dataset.v === v));
    ['priceErr', 'priceErr2'].forEach((id) => { const el = document.getElementById(id); if (el) el.textContent = ''; });
  }

  // Ook typen met een toetsenbord (laptop)
  document.addEventListener('keydown', (ev) => {
    if (!document.getElementById('cexpr')) return;
    if (ev.target && ev.target.tagName === 'INPUT') return;
    const map = { '.': ',', ',': ',', '+': '+', '-': '−', '*': '×', 'x': '×', '/': '÷', 'Backspace': '⌫', 'Delete': 'C', 'Escape': 'C', '=': '=' };
    let k = /^\d$/.test(ev.key) ? ev.key : map[ev.key];
    if (ev.key === 'Enter') { ev.preventDefault(); const f = document.querySelector('#editPriceForm, #priceForm, #gPriceForm'); if (f) f.requestSubmit(); return; }
    if (!k) return;
    ev.preventDefault();
    pressKey(k);
    const b = document.querySelector(`.key[data-k="${k}"]`);
    if (b) { b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 120); }
  });

  function renderPrice() {
    const r = current();
    const last = S.lastPrice;
    if (ui.calc.target !== 'price') ui.calc = { expr: last ? fmt(last) : '', target: 'price' };
    return `<div class="wrap">
      <header class="top"><button class="btn ghost sm" data-act="cancelRound">← Annuleer</button><span class="label">Rondje ${S.rounds.length}</span></header>
      <section><h1>Wat kost <em>het rondje</em>?</h1></section>
      ${matchup(r)}
      <form id="priceForm" class="steps" autocomplete="off">
        ${calcHTML()}
        ${last ? `<div><button type="button" class="chip" data-act="setprice" data-v="${last}">Zelfde als vorige · ${euro(last)}</button></div>` : ''}
        <p class="err" id="priceErr" style="min-height:0"></p>
        <button class="btn primary xl" type="submit">Start het rondje <span class="arr">→</span></button>
      </form>
    </div>`;
  }

  function renderGame() {
    const r = current();
    const rep = Logic.replay(r.hands);
    const sc = rep.score;
    const pk = ui.pick;
    const flash = ui.flash; ui.flash = null;
    const board = (t) => {
      const prev = flash ? sc[t] - flash[t] : sc[t];
      const hot = sc[t] > 0 && sc[t] <= 2;
      return `<div class="board t${t} ${pk.playing === t ? 'sel' : ''} ${flash && flash[t] ? 'bump' : ''} ${hot ? 'hot' : ''}">
        <div><span class="tl">${TEAM[t]}</span>${hot ? '<span class="hotb">bijna</span>' : ''}<div class="bnames">${tName(r, t)}</div></div>
        <div class="bbody">${boom(sc[t], prev)}<div class="num ${sc[t] === 0 ? 'zero' : ''}" aria-label="${sc[t]} streepjes over">${sc[t]}</div></div>
        ${flash && flash[t] ? `<span class="delta">${sign(flash[t])}</span>` : ''}</div>`;
    };

    let res;
    if (pk.card && pk.playing !== null) {
      res = RESULTS.map(([v, label]) => `<button class="opt res ${v === 'lose' ? 'lose' : ''}" data-act="result" data-v="${v}"><span class="big">${label}</span></button>`).join('');
    } else {
      res = RESULTS.map(([v, label]) => `<button class="opt res ${v === 'lose' ? 'lose' : ''}" disabled><span class="big">${label}</span></button>`).join('');
    }

    const hist = rep.steps.map((st, i) => {
      const h = st.hand;
      return `<div class="hrow"><span class="n">${i + 1}</span><span>${h.card === 1 ? '1ste' : '2de'} kaart · <span class="t${h.playing} tc">${TEAM[h.playing]}</span> speelt · ${RESULT_LABEL[h.result].toLowerCase()}</span>
        <span class="sc"><span class="t0 tc">${st.after[0]}</span><span class="sep">/</span><span class="t1 tc">${st.after[1]}</span></span></div>`;
    }).reverse().join('');

    return `<div class="wrap">
      <header class="roundbar"><span class="label">Rondje ${S.rounds.length}</span>
        <div style="display:flex;gap:8px;align-items:center"><button class="pricechip" data-act="editPrice" aria-label="Prijs aanpassen">${euro(r.price)}</button><button class="btn ghost sm" data-act="menu" aria-label="Meer opties">Meer</button></div></header>
      <div class="boards">${board(0)}${board(1)}</div>
      <section class="steps">
        <div class="step"><div class="slabel"><span class="no">1</span><span class="label">Welke kaart?</span></div>
          <div class="seg">
            <button class="opt ${pk.card === 1 ? 'on' : ''}" data-act="card" data-v="1"><span class="big">1ste kaart</span><small>−1, of −2 als zij geen slag halen</small></button>
            <button class="opt ${pk.card === 2 ? 'on' : ''}" data-act="card" data-v="2"><span class="big">2de kaart</span><small>−2, of −3 als zij geen slag halen</small></button>
          </div></div>
        <div class="step ${pk.card ? '' : 'wait'}"><div class="slabel"><span class="no">2</span><span class="label">Wie speelt?</span></div>
          <div class="seg">
            ${[0, 1].map((t) => `<button class="opt team t${t} ${pk.playing === t ? 'on' : ''}" data-act="playing" data-v="${t}"><span class="tl">${TEAM[t]}</span><span class="big">${tName(r, t)}</span></button>`).join('')}
          </div></div>
        <div class="step ${pk.card && pk.playing !== null ? '' : 'wait'}" id="step3"><div class="slabel"><span class="no">3</span><span class="label">Resultaat</span></div><div class="stack">${res}</div></div>
      </section>
      ${rep.steps.length ? `<section class="panel"><div class="panel-head"><h2>Gespeeld</h2><button class="btn soft sm" data-act="undo">Laatste ongedaan</button></div><div>${hist}</div></section>` : ''}
    </div>${dock()}`;
  }

  function renderEnd() {
    const A = owedAll();
    const done = { length: A.n };
    const open = current() || openOf(S.wz) || openOf(S.hj);
    const { owed } = A;
    const parts = A.parts.filter((p) => p[1]);
    const payerBtns = S.players.map((p, i) => `<button class="payer ${ui.payer === i ? 'on' : ''}" data-act="payer" data-v="${i}"><span class="nm">${esc(p)}</span><small>aandeel ${euro(owed[i])}</small></button>`).join('');
    return `<div class="wrap">
      <header class="top"><button class="btn ghost sm" data-act="home">← Terug</button><span class="label">Einde avond</span></header>
      <section><p class="label">${done.length} rondje${done.length === 1 ? '' : 's'} gespeeld</p><h1>Wie heeft de <em>rekening</em> betaald?</h1>
        ${parts.length ? `<p class="lead">${parts.map((p) => `${p[0]}: ${p[1]} rondje${p[1] > 1 ? 's' : ''} · ${euro(p[2])}`).join('<br>')}</p>` : ''}</section>
      ${open ? `<div class="note">Een rondje dat nog bezig is, telt niet mee.</div>` : ''}
      ${done.length ? `<div class="payers">${payerBtns}</div>
      <div class="field"><label for="bill">Wat stond er op de rekening?</label>
        <input class="input" id="bill" inputmode="decimal" placeholder="${fmt(roundsTotal())}" value="${esc(ui.bill)}" style="font:600 22px var(--f-serif);font-variant-numeric:lining-nums">
        <p class="bill-hint" id="billHint">${billHint()}</p></div>
      <div id="settle">${renderSettle()}</div>` : `<p class="empty">Nog geen rondjes uitgespeeld, dus niemand moet iets.</p>`}
      <button class="btn ghost block" data-act="askReset">Nieuwe avond starten</button>
    </div>`;
  }

  const roundsTotal = () => owedAll().total;
  const billValue = () => Logic.parsePrice(ui.bill); // null = leeg of ongeldig
  const signedEuro = (c) => (c > 0 ? '+ ' : c < 0 ? '− ' : '') + euro(Math.abs(c));

  function billHint() {
    const rt = roundsTotal();
    if (!ui.bill.trim()) return `Leeg laten als het precies de rondjes waren: <b>${euro(rt)}</b>.`;
    const b = billValue();
    if (!b) return 'Geef een bedrag in, bijvoorbeeld 52,40.';
    const diff = b - rt, n = S.players.length;
    if (!diff) return `Precies wat de rondjes kostten.`;
    return `${euro(Math.abs(diff))} ${diff > 0 ? 'meer' : 'minder'} dan de rondjes (${euro(rt)}): iedereen betaalt <b>${euro(Math.abs(diff) / n)} ${diff > 0 ? 'meer' : 'minder'}</b>.`;
  }

  function renderSettle() {
    if (ui.payer === null) return `<p class="empty">Kies hierboven wie betaald heeft.</p>`;
    const r = settleAll(ui.payer, billValue());
    const n = S.players.length;
    const trs = r.transfers.map((t) => `<div class="tr"><div class="who"><span>${P(t.from)}</span><span class="arrow">schrijft over naar ${P(t.to)}</span></div><div class="amt">${euro(t.amount)}</div></div>`).join('');
    return `<section class="panel">
      <div class="total"><span class="label">${P(ui.payer)} betaalde</span><b>${euro(r.total)}</b></div>
      ${r.diff ? `<div class="breakdown"><span>Rondjes</span><span>${euro(r.rounds)}</span><span>Verschil met de rekening</span><span>${signedEuro(r.diff)}</span><span>Per persoon</span><span>${signedEuro(r.diff / n)}</span></div>` : ''}
      <hr class="rule">
      ${r.transfers.length ? `<div>${trs}</div>` : `<p class="empty">Niemand moet iets overschrijven.</p>`}
      <p class="muted" style="margin:0;font-size:12.5px">${(() => {
        const inc = r.transfers.reduce((t, x) => t + (x.to === ui.payer ? x.amount : -x.amount), 0);
        const own = r.total - inc;
        return own < 0
          ? `${P(ui.payer)} krijgt in totaal ${euro(inc)} binnen, ${euro(-own)} meer dan de rekening.`
          : `${P(ui.payer)} krijgt ${euro(inc)} binnen en betaalt zelf ${euro(own)} van de rekening.`;
      })()}</p>
      <button class="btn primary block" data-act="copy">Kopieer voor de groepschat</button>
      <p class="muted" id="copyMsg" style="margin:0;font-size:13px;text-align:center"></p>
    </section>`;
  }

  function settleText() {
    const r = settleAll(ui.payer, billValue());
    const lines = [`Kaartavond: afrekening (${owedAll().n} rondjes)`, `${S.players[ui.payer]} betaalde ${euro(r.total)}`];
    if (r.diff) lines.push(`Rondjes ${euro(r.rounds)}, verschil ${signedEuro(r.diff)} gedeeld door ${S.players.length}`);
    lines.push('');
    r.transfers.forEach((t) => lines.push(`${S.players[t.from]} → ${S.players[t.to]}: ${euro(t.amount)}`));
    if (!r.transfers.length) lines.push('Niemand moet iets overschrijven.');
    return lines.join('\n');
  }

  // ---------- Modals ----------
  function renderModal() {
    const m = ui.modal;
    if (!m) { $modal.innerHTML = ''; return; }
    let body = '', cls = '';
    if (m === 'players') {
      body = `<h2>Spelers</h2><p class="muted" style="margin:0;font-size:14px">Pas de namen aan. Gespeelde rondjes blijven bewaard.</p>
        <form id="playersForm" class="steps">${S.players.map((p, i) => `<div class="field"><label for="pl${i}">Speler ${i + 1}</label><input class="input" id="pl${i}" value="${esc(p)}" maxlength="18" required></div>`).join('')}
        <div class="row2"><button type="button" class="btn ghost" data-act="close">Annuleer</button><button class="btn primary" type="submit">Bewaar</button></div></form>`;
    } else if (m === 'winner') {
      const r = S.rounds[S.rounds.length - 1];
      const w = r.winner, l = 1 - w;
      cls = `win t${w}`;
      body = `<span class="crest">${TEAM[w]} · rondje ${S.rounds.length}</span>
        <canvas id="confetti"></canvas><h2><span class="tc">${tName(r, w)}</span> <em style="font-weight:500">winnen!</em></h2><div class="wl2"></div>
        <div class="pay"><span class="label">${tName(r, l)} betalen het rondje</span><b>${euro(r.price / 2)}</b><span class="muted" style="font-size:13px">per persoon, ${euro(r.price)} samen</span></div>
        <button class="btn primary xl" data-act="next">Volgend rondje: boeren trekken <span class="arr">→</span></button>
        <div class="row2" style="width:100%"><button class="btn ghost" data-act="toHome">Overzicht</button><button class="btn ghost" data-act="undoWin">Foutje, terug</button></div>`;
    } else if (m === 'editPrice') {
      body = `<h2>Prijs van dit rondje</h2><form id="editPriceForm" class="steps">${calcHTML()}
        <p class="err" id="priceErr2"></p><div class="row2"><button type="button" class="btn ghost" data-act="close">Annuleer</button><button class="btn primary" type="submit">Bewaar</button></div></form>`;
    } else if (m === 'menu') {
      body = `<h2>Rondje ${S.rounds.length}</h2>
        <button class="btn soft block" data-act="editPrice">Prijs aanpassen</button>
        <button class="btn danger block" data-act="askCancel">Rondje stoppen, telt niet mee</button>
        <button class="btn ghost block" data-act="close">Sluit</button>`;
    } else if (m === 'askCancel') {
      body = `<h2>Rondje stoppen?</h2><p class="muted" style="margin:0">De ${current().hands.length} gespeelde handen worden gewist en niemand betaalt dit rondje.</p>
        <div class="row2"><button class="btn ghost" data-act="close">Nee</button><button class="btn danger" data-act="cancelRound">Ja, stoppen</button></div>`;
    } else if (m === 'askReset') {
      body = `<h2>Nieuwe avond starten?</h2><p class="muted" style="margin:0">De rondjes, spelletjes en bedragen van deze avond worden gewist, van alle spellen. Ze komen bij Vorige avonden. De spelersnamen en jullie afspraken over percentages en punten blijven.</p>
        <div class="row2"><button class="btn ghost" data-act="close">Nee</button><button class="btn danger" data-act="reset">Ja, wissen</button></div>`;
    } else if (m === 'wpts') {
      body = `<h2>Puntentabel wiezen</h2><p class="muted" style="margin:0;font-size:13.5px">Samen spelen: elke speler krijgt de punten en elke tegenspeler verliest ze. Alleen spelen: elke tegenspeler betaalt de punten, dus je krijgt 3 keer zoveel. Bij vragen, troel en alleen telt elke extra slag +1 (bij alleen tot 3 extra). Niet gehaald: dezelfde punten in de min, plus 1 per slag te weinig.</p>
        <div>${WBIDS.map((b) => `<div class="pctrow"><span class="pl">${b.n}<small>${b.need}</small></span><div class="stepper"><button type="button" data-act="wPtStep" data-k="${b.k}" data-v="-1" aria-label="Minder">−</button><output>${wpts(b.k)}</output><button type="button" data-act="wPtStep" data-k="${b.k}" data-v="1" aria-label="Meer">+</button></div></div>`).join('')}</div>
        <div class="row2"><button class="btn ghost" data-act="wPtsReset">Standaard</button><button class="btn primary" data-act="close">Klaar</button></div>`;
    }
    $modal.innerHTML = `<div class="overlay" data-act="overlay"><div class="sheet ${cls}" role="dialog" aria-modal="true">${body}</div></div>`;
    if (m === 'winner') confetti();
    updateCalc();
  }

  function render() {
    const v = view();
    ui.view = ['draw', 'end', 'wsetup', 'wround', 'hround', 'choose', 'start'].includes(v) ? v : null;
    const screens = { home: renderHome, draw: renderDraw, price: renderPrice, game: renderGame, end: renderEnd, start: renderStart, choose: renderChoose, wsetup: renderWSetup, wgame: renderWGame, wround: renderWRound, hgame: renderHGame, hround: renderHRound, gprice: renderGPrice };
    $app.innerHTML = screens[v]();
    renderModal();
    updateCalc();
  }

  // ---------- Boeren trekken: de deler legt kaart per kaart open ----------
  const wait = (ms) => new Promise((res) => setTimeout(res, ms));
  async function runDraw() {
    const token = {}; ui.draw.token = token;
    const alive = () => ui.draw && ui.draw.token === token && ui.view === 'draw';
    const stage = document.getElementById('stage');
    if (!stage) return;
    const deck = document.getElementById('deck');
    const msg = document.getElementById('dealmsg');
    const { deal, teams } = ui.draw;
    const rel = (el) => { const a = el.getBoundingClientRect(), b = stage.getBoundingClientRect(); return { x: a.left - b.left, y: a.top - b.top }; };
    const deckPos = rel(deck);
    const jacks = [];
    let z = 6;

    const place = (step, instant) => {
      const { player, card } = step;
      const el = document.createElement('div');
      el.className = 'dcard' + (instant ? ' instant flipped' : '');
      el.innerHTML = `<div class="inner"><div class="back"></div>${cardFace(card)}</div>`;
      el.style.left = deckPos.x + 'px'; el.style.top = deckPos.y + 'px'; el.style.zIndex = z++;
      stage.appendChild(el);
      const p = rel(document.getElementById('pile' + player));
      const tilt = (Math.random() - 0.5) * 10, dx = (Math.random() - 0.5) * 6, dy = (Math.random() - 0.5) * 6;
      const go = () => { el.style.left = p.x + dx + 'px'; el.style.top = p.y + dy + 'px'; el.style.transform = `rotate(${tilt}deg)`; };
      if (instant) go(); else { void el.offsetWidth; go(); setTimeout(() => el.classList.add('flipped'), 160); }
      if (card.r === 'J') {
        jacks.push(player);
        el.classList.add('isjack');
        document.getElementById('seat' + player).classList.add('jack');
      }
      return el;
    };
    const name = (i) => `<b>${P(i)}</b>`;
    const finish = (instant) => {
      if (instant) {
        stage.querySelectorAll('.dcard').forEach((c) => c.remove());
        jacks.length = 0;
        // per speler alleen de laatste kaart tonen (de rest ligt eronder)
        const lastOf = {};
        deal.forEach((s) => { lastOf[s.player] = s; });
        Object.values(lastOf).forEach((s) => place(s, true));
      }
      deck.classList.add('empty');
      const tag = stage.querySelector('.dealer-tag'); if (tag) tag.hidden = true;
      teams.forEach((t, ti) => t.forEach((p) => document.getElementById('seat' + p).classList.add('t' + ti)));
      msg.innerHTML = `${name(teams[0][0])} en ${name(teams[0][1])} spelen samen`;
      document.getElementById('skipHint').hidden = true;
      document.getElementById('drawTeams').innerHTML = matchupTeams(teams);
      const acts = document.getElementById('drawActions'); acts.hidden = false;
      setTimeout(() => acts.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 400);
    };
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { finish(true); return; }

    await wait(500);
    msg.innerHTML = `${name(ui.draw.dealer)} deelt…`;
    for (let i = 0; i < deal.length; i++) {
      if (!alive() || ui.draw.skip) break;
      const step = deal[i];
      const last = i === deal.length - 1;
      place(step);
      if (step.card.r === 'J') {
        if (navigator.vibrate) try { navigator.vibrate(20); } catch (e) {}
        msg.innerHTML = jacks.length === 1
          ? `${name(step.player)} heeft de eerste boer. Wie krijgt de tweede?`
          : `${name(step.player)} heeft de tweede boer!`;
        await wait(last ? 1300 : 1500);
      } else {
        // na de eerste boer gaat het trager: spanning
        await wait(jacks.length ? 720 : 440);
      }
    }
    if (!alive()) return;
    finish(ui.draw.skip);
  }

  function startDraw() {
    ui.draw = { ...Logic.dealTeams(S.rounds.length % S.players.length), skip: false };
    ui.view = 'draw'; ui.modal = null;
    render();
    window.scrollTo(0, 0);
    keepAwake();
    requestAnimationFrame(() => runDraw());
  }

  // ---------- Acties ----------
  function addHand(result) {
    const r = current();
    const hand = { card: ui.pick.card, playing: ui.pick.playing, result };
    const before = Logic.replay(r.hands).score;
    r.hands.push(hand);
    const rep = Logic.replay(r.hands);
    ui.flash = [rep.score[0] - before[0], rep.score[1] - before[1]];
    ui.pick = { card: null, playing: null };
    if (rep.winner !== null) { r.winner = rep.winner; r.end = Date.now(); }
    save();
    if (rep.winner !== null) {
      // eerst de laatste streepjes zien verdwijnen, dan de winnaar
      const keep = r.winner; r.winner = null; render(); r.winner = keep;
      setTimeout(() => { ui.modal = 'winner'; render(); }, 1100);
    } else {
      const fl = ui.flash; // render() verbruikt ui.flash
      render(); window.scrollTo({ top: 0, behavior: 'smooth' });
      const ch = [0, 1].filter((t) => fl[t]).map((t) => `${TEAM[t]} ${sign(fl[t])}`).join(', ');
      const q = QUIPS[result][Math.floor(Math.random() * QUIPS[result].length)];
      showToast(`<b>${q}</b> · ${ch}`);
    }
    if (navigator.vibrate) try { navigator.vibrate(rep.winner !== null ? [30, 60, 30] : 15); } catch (e) {}
  }

  let toastTimer = null;
  function hideToast() {
    clearTimeout(toastTimer);
    const t = document.getElementById('toast');
    if (t) { t.classList.add('out'); setTimeout(() => t.remove(), 300); }
  }
  function showToast(html) {
    const old = document.getElementById('toast'); if (old) old.remove();
    clearTimeout(toastTimer);
    const t = document.createElement('div');
    t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status');
    t.innerHTML = `<span class="tx">${html}</span><button class="btn soft sm" data-act="toastUndo">Ongedaan</button>`;
    document.body.appendChild(t);
    toastTimer = setTimeout(hideToast, 6000);
  }

  const actions = {
    draw: startDraw,
    redraw: startDraw,
    next: startDraw,
    home() { ui.view = null; ui.draw = null; ui.modal = null; render(); },
    toHome() { ui.modal = null; ui.view = null; render(); },
    accept() {
      S.rounds.push({ id: Date.now(), teams: ui.draw.teams, dealer: ui.draw.dealer, price: null, hands: [], winner: null, start: Date.now() });
      ui.draw = null; ui.view = null; save(); render();
    },
    setprice(b) { ui.calc.expr = fmt(+b.dataset.v); updateCalc(); },
    key(b) { pressKey(b.dataset.k); },
    cancelRound() {
      const r = current(); if (r) S.rounds.pop(); ui.calc = { expr: '', target: null };
      ui.modal = null; ui.pick = { card: null, playing: null }; save(); render();
    },
    card(b) { ui.pick.card = +b.dataset.v; render(); },
    playing(b) { ui.pick.playing = +b.dataset.v; render(); const s = document.getElementById('step3'); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); },
    result(b) { hideToast(); addHand(b.dataset.v); },
    statScope(b) { ui.statScope = b.dataset.v; render(); },
    toastUndo() { hideToast(); if (S.game === 'wiezen') actions.wUndo(); else if (S.game === 'harten') actions.hUndo(); else actions.undo(); },
    // Hartenjagen
    hNew() { ui.hr = { p: [0, 0, 0, 0], q: null, moon: null }; ui.view = 'hround'; render(); window.scrollTo(0, 0); keepAwake(); },
    hCancel() { ui.hr = null; ui.view = null; render(); window.scrollTo(0, 0); },
    hStep(b) { const R = ui.hr, i = +b.dataset.i; if (R.moon !== null) return; R.p[i] = Math.max(0, Math.min(13, R.p[i] + +b.dataset.v)); const inp = document.getElementById('hp' + i); if (inp) inp.value = R.p[i]; updateHRound(); },
    hQueen(b) { const R = ui.hr, i = +b.dataset.i; R.q = R.q === i ? null : i; document.querySelectorAll('.qv').forEach((x) => x.classList.toggle('on', +x.dataset.i === R.q)); updateHRound(); },
    hMoon(b) { const R = ui.hr, i = +b.dataset.v; R.moon = R.moon === i ? null : i; render(); },
    hSave() {
      const R = ui.hr; if (!R) return;
      const pts = hjPts(R);
      if (!pts.some((v) => v > 0)) return;
      const c = openOf(S.hj); if (!c) return;
      c.hands.push({ p: pts, q: R.moon !== null ? null : R.q, moon: R.moon, at: Date.now() });
      S.hj.dealer = (S.hj.dealer + 1) % 4;
      const done = hDone(c); if (done) c.end = Date.now();
      ui.hr = null; ui.view = null; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
      showToast(done ? `<b>Rondje ${S.hj.rondjes.length} gedaan</b> · iemand staat op 0` : `<b>Hand ${c.hands.length}</b> bewaard`);
    },
    hUndo() { const r = lastOf(S.hj); if (!r || !r.hands.length) return; r.hands.pop(); r.end = null; S.hj.dealer = (S.hj.dealer + 3) % 4; save(); render(); },
    // Nieuw rondje voor wiezen of hartenjagen: eerst de prijs
    gNewRondje() {
      const st = pg().st();
      const r = { price: null, pct: st.pct.slice(), start: Date.now(), end: null };
      if (S.game === 'wiezen') { r.per = S.wz.per; r.games = []; } else r.hands = [];
      st.rondjes.push(r); ui.calc = { expr: '', target: null }; save(); render(); window.scrollTo(0, 0); keepAwake();
    },
    gCancel() { const st = pg().st(), c = openOf(st); if (c && c.price == null) st.rondjes.pop(); ui.calc = { expr: '', target: null }; save(); render(); },
    perSet(b) { ui.per = +b.dataset.v; render(); },
    hNextDealer() { S.hj.dealer = (S.hj.dealer + 1) % 4; save(); render(); },
    // Start van de avond en keuze van het spel
    toStart() { ui.view = 'start'; render(); window.scrollTo(0, 0); },
    hOpen(b) { const i = +b.dataset.v; ui.hOpen = ui.hOpen === i ? null : i; ui.hDel = null; render(); },
    hDel(b) { const i = +b.dataset.v; if (ui.hDel !== i) { ui.hDel = i; render(); return; } S.history.splice(i, 1); ui.hOpen = null; ui.hDel = null; save(); render(); },
    toChoose() { hideToast(); ui.view = 'choose'; ui.modal = null; render(); window.scrollTo(0, 0); },
    pickGame(b) {
      S.game = b.dataset.v;
      ui.view = PG[S.game] && !PG[S.game].st().pct ? 'wsetup' : null;
      ui.pct = null; save(); render(); window.scrollTo(0, 0);
    },
    // Wiezen: percentages
    pctPreset(b) { ui.pct = PCT_PRESETS[+b.dataset.v].v.slice(); render(); },
    pctStep(b) { const i = +b.dataset.i; ui.pct[i] = Math.max(0, Math.min(100, ui.pct[i] + +b.dataset.v)); const inp = document.getElementById('pct' + i); if (inp) inp.value = ui.pct[i]; updatePct(); },
    pctSave() { if (ui.pct.reduce((a, c) => a + c, 0) !== 100) return; pg().st().pct = ui.pct.slice(); if (S.game === 'wiezen') S.wz.per = ui.per || 1;
      const c = gCur(); if (c && c.price == null) { c.pct = ui.pct.slice(); if (S.game === 'wiezen') c.per = S.wz.per; } ui.pct = null; ui.view = null; save(); render(); window.scrollTo(0, 0); },
    wsetupCancel() { ui.pct = null; ui.view = null; render(); window.scrollTo(0, 0); },
    wEditPct() { ui.pct = null; ui.view = 'wsetup'; render(); window.scrollTo(0, 0); },
    // Wiezen: spelletjes
    wNew() { ui.wr = { k: null, sel: [], made: null, diff: 0 }; ui.view = 'wround'; render(); window.scrollTo(0, 0); keepAwake(); },
    wCancel() { ui.wr = null; ui.view = null; render(); window.scrollTo(0, 0); },
    wBid(b) {
      const R = ui.wr; R.k = b.dataset.v;
      const need = wbid(R.k).duo ? 2 : 1;
      if (R.sel.length > need) R.sel = R.sel.slice(-need);
      R.made = null; R.diff = 0; render();
      const s = document.getElementById('wstep2'); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    },
    wPick(b) {
      const R = ui.wr, i = +b.dataset.v, need = wbid(R.k).duo ? 2 : 1;
      if (R.sel.includes(i)) R.sel = R.sel.filter((x) => x !== i);
      else { R.sel.push(i); if (R.sel.length > need) R.sel.shift(); }
      render();
      if (R.sel.length === need) { const s = document.getElementById('wstep3'); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    },
    wMade(b) { const R = ui.wr, m = b.dataset.v === '1'; if (R.made !== m) R.diff = 0; R.made = m; render(); },
    wDiff(b) { const R = ui.wr, bd = wbid(R.k); const max = R.made ? 13 - bd.min : bd.min; R.diff = Math.max(0, Math.min(max, R.diff + +b.dataset.v)); render(); },
    wSave() {
      const R = ui.wr; if (!R || R.made === null) return;
      const bd = wbid(R.k);
      const c = openOf(S.wz); if (!c) return;
      c.games.push({ k: R.k, sel: R.sel.slice(), made: R.made, diff: bd.extra ? R.diff : 0, d: wDelta(R.k, R.sel, R.made, R.diff), at: Date.now() });
      S.wz.dealer = (S.wz.dealer + 1) % 4;
      const done = c.games.length >= c.per; if (done) c.end = Date.now();
      ui.wr = null; ui.view = null; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
      showToast(`<b>${esc(bd.n)}</b> · ${R.made ? 'gehaald' : 'niet gehaald'}${done ? ` · rondje ${S.wz.rondjes.length} gedaan` : ''}`);
    },
    wUndo() { const r = lastOf(S.wz); if (!r || !r.games.length) return; r.games.pop(); r.end = null; S.wz.dealer = (S.wz.dealer + 3) % 4; save(); render(); },
    wNextDealer() { S.wz.dealer = (S.wz.dealer + 1) % 4; save(); render(); },
    wPts() { ui.modal = 'wpts'; renderModal(); },
    wPtStep(b) { const k = b.dataset.k; S.wz.pts[k] = Math.max(0, wpts(k) + +b.dataset.v); if (S.wz.pts[k] === wbid(k).p) delete S.wz.pts[k]; save(); renderModal(); },
    wPtsReset() { S.wz.pts = {}; save(); renderModal(); },
    undo() { const r = current(); if (r && r.hands.length) { r.hands.pop(); ui.pick = { card: null, playing: null }; save(); render(); } },
    undoWin() { const r = S.rounds[S.rounds.length - 1]; r.hands.pop(); r.winner = null; r.end = null; ui.modal = null; save(); render(); },
    reopen() { const r = S.rounds[S.rounds.length - 1]; if (r && r.winner !== null) { r.hands.pop(); r.winner = null; r.end = null; save(); render(); } },
    editPrice() { ui.calc = { expr: fmt(current().price), target: 'edit' }; ui.modal = 'editPrice'; renderModal(); },
    menu() { ui.modal = 'menu'; renderModal(); },
    askCancel() { ui.modal = 'askCancel'; renderModal(); },
    players() { ui.modal = 'players'; renderModal(); },
    close() { ui.modal = null; renderModal(); },
    overlay(b, e) { if (e.target === b && ui.modal !== 'winner') { ui.modal = null; renderModal(); } },
    end() { ui.view = 'end'; render(); window.scrollTo(0, 0); },
    payer(b) { ui.payer = +b.dataset.v; document.querySelectorAll('.payer').forEach((x) => x.classList.toggle('on', +x.dataset.v === ui.payer)); document.getElementById('settle').innerHTML = renderSettle(); },
    async copy() {
      const msg = document.getElementById('copyMsg');
      const text = settleText();
      try { await navigator.clipboard.writeText(text); msg.textContent = 'Gekopieerd. Plak het in jullie groepschat.'; }
      catch (e) {
        msg.innerHTML = '';
        const ta = document.createElement('textarea'); ta.className = 'input'; ta.rows = 6; ta.value = text; ta.readOnly = true;
        msg.appendChild(ta); ta.focus(); ta.select();
        const p = document.createElement('p'); p.style.margin = '6px 0 0'; p.textContent = 'Kopiëren lukte niet automatisch. De tekst is geselecteerd, kopieer hem zelf.'; msg.appendChild(p);
      }
    },
    askReset() { ui.modal = 'askReset'; renderModal(); },
    reset() { const archive = [...(S.archive || []), ...finished().map((r) => ({ teams: r.teams, winner: r.winner, date: r.end || r.start }))]; const rec = nightRecord(); const history = [...(S.history || []), ...(rec ? [rec] : [])]; const wz = freshWz(S.wz), hj = freshHj(S.hj); S = fresh(S.players); S.archive = archive; S.wz = wz; S.hj = hj; S.history = history; ui.hOpen = null; ui.hDel = null; ui.modal = null; ui.view = 'start'; ui.payer = null; ui.bill = ''; ui.hr = null; ui.wr = null; save(); render(); window.scrollTo(0, 0); },
  };

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (b && ['card', 'playing', 'result', 'undo'].includes(b.dataset.act) && !current()) return; // rondje net gedaan
    if (b && actions[b.dataset.act]) { actions[b.dataset.act](b, e); return; }
    if (ui.view === 'draw' && ui.draw && e.target.closest('#stage')) ui.draw.skip = true;
  });

  document.addEventListener('keydown', (e) => {
    const m = /^sp(\d)$/.exec(e.target.id || '');
    if (m && e.key === 'Enter' && +m[1] < 3) { e.preventDefault(); document.getElementById('sp' + (+m[1] + 1)).focus(); }
  });

  document.addEventListener('input', (e) => {
    const pm = /^pct(\d)$/.exec(e.target.id || '');
    if (pm && ui.pct) {
      const v = parseInt(e.target.value.replace(/\D/g, ''), 10);
      ui.pct[+pm[1]] = isNaN(v) ? 0 : Math.min(100, v);
      updatePct();
      return;
    }
    const hm = /^hp(\d)$/.exec(e.target.id || '');
    if (hm && ui.hr) {
      const v = parseInt(e.target.value.replace(/\D/g, ''), 10);
      ui.hr.p[+hm[1]] = isNaN(v) ? 0 : Math.min(13, v);
      updateHRound();
      return;
    }
    if (e.target.id === 'bill') {
      ui.bill = e.target.value;
      document.getElementById('billHint').innerHTML = billHint();
      const s = document.getElementById('settle'); if (s) s.innerHTML = renderSettle();
    }
  });

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.id === 'priceForm') {
      const v = calcValue();
      if (!v) { document.getElementById('priceErr').textContent = 'Geef een bedrag in, bijvoorbeeld 24,50.'; return; }
      current().price = v; S.lastPrice = v; ui.calc = { expr: '', target: null }; save(); render(); keepAwake();
    } else if (f.id === 'gPriceForm') {
      const v = calcValue(), c = gCur();
      if (!v) { document.getElementById('priceErr').textContent = 'Geef een bedrag in, bijvoorbeeld 24,50.'; return; }
      if (!c) return;
      c.price = v; S.lastPrice = v; ui.calc = { expr: '', target: null };
      if (S.game === 'wiezen' && !c.games.length) { ui.wr = { k: null, sel: [], made: null, diff: 0 }; ui.view = 'wround'; }
      save(); render(); window.scrollTo(0, 0); keepAwake();
    } else if (f.id === 'editPriceForm') {
      const v = calcValue();
      if (!v) { document.getElementById('priceErr2').textContent = 'Geef een bedrag in, bijvoorbeeld 24,50.'; return; }
      current().price = v; S.lastPrice = v; ui.modal = null; save(); render();
    } else if (f.id === 'startForm') {
      const names = [0, 1, 2, 3].map((i) => document.getElementById('sp' + i).value.trim());
      const err = document.getElementById('startErr');
      const empty = names.findIndex((n) => !n);
      if (empty >= 0) { err.textContent = 'Vul alle 4 de namen in.'; document.getElementById('sp' + empty).focus(); return; }
      if (new Set(names.map((n) => n.toLowerCase())).size < 4) { err.textContent = 'Geef elke speler een andere naam.'; return; }
      S.players = names; ui.view = 'choose'; save(); render(); window.scrollTo(0, 0);
    } else if (f.id === 'playersForm') {
      const names = S.players.map((_, i) => document.getElementById('pl' + i).value.trim());
      if (names.some((n) => !n)) return;
      S.players = names; ui.modal = null; save(); render();
    }
  });

  render();
  window.__troeven = { get state() { return S; }, ui };
})();
</script>

<script>
// Installeerbare app: offline werken en vanzelf de nieuwste versie laden.
(() => {
  const APP_VERSION = '20261125-101304';
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  // Veilig om te herladen: niet midden in het ingeven van een hand, spelletje of tijdens het delen.
  const safe = () => {
    const t = window.__troeven; if (!t) return true;
    const v = t.ui.view;
    return !t.ui.modal && !['wround', 'hround', 'draw', 'wsetup'].includes(v);
  };
  let pending = false, bar = null;
  function showBar() {
    if (bar) return;
    bar = document.createElement('div');
    bar.className = 'toast'; bar.style.bottom = 'calc(16px + env(safe-area-inset-bottom, 0px))'; bar.style.zIndex = 30;
    bar.innerHTML = '<span class="tx"><b>Nieuwe versie klaar</b> · laadt zodra je klaar bent</span><button class="btn soft sm" type="button">Nu laden</button>';
    bar.querySelector('button').onclick = () => location.reload();
    document.body.appendChild(bar);
  }
  async function check() {
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      const { v } = await r.json();
      if (v && v !== APP_VERSION) pending = true;
    } catch (e) {}
    if (pending) { if (safe()) location.reload(); else showBar(); }
  }
  // Ook herladen zodra je terugkeert naar een rustig scherm.
  document.addEventListener('click', () => { if (pending && safe()) setTimeout(() => { if (safe()) location.reload(); }, 400); }, true);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
  setInterval(check, 20000);
  setTimeout(check, 1500);
})();

</script>
