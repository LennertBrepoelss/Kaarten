        a.won += nightWon(h)[i];
        a.lost += nightLost(h)[i];
      });
    });
    // Klassement: wie gemiddeld het minst betaalt per avond staat bovenaan
    const avg = (a) => (a.paidNights ? a.paid / a.paidNights : Infinity);
    const names = Object.keys(agg).sort((a, b) => avg(agg[a]) - avg(agg[b]) || agg[a].loser - agg[b].loser || agg[b].won - agg[a].won);
    const sumRows = names.map((nm, k) => { const a = agg[nm]; return `<div class="krow"><span class="kn">${k + 1}</span>
      <span class="kname">${esc(nm)}<small>${a.nights} avond${a.nights > 1 ? 'en' : ''} · ${a.won}–${a.lost}${a.loser ? ` · <b class="neg">${a.loser}× verliezer</b>` : ''}</small></span>
      <span class="kpaid">${a.paidNights ? euro(a.paid) : '–'}<small>${a.paidNights ? `gem. ${euro(a.paid / a.paidNights)}` : ''}</small></span></div>`; }).join('');

    const items = all.map((h, idx) => ({ h, idx })).reverse().map(({ h, idx }) => {
      const open = ui.hOpen === idx, paid = nightPaid(h), lo = nightLoser(h);
      const games = [h.t ? `Troeven ${h.t.n} rondje${h.t.n > 1 ? 's' : ''}` : '', h.w ? `Wiezen ${h.w.r ? `${h.w.r} rondje${h.w.r > 1 ? 's' : ''}` : `${h.w.n} spelletje${h.w.n > 1 ? 's' : ''}`}` : '', h.h ? `Hartenjagen ${h.h.r ? `${h.h.r} rondje${h.h.r > 1 ? 's' : ''}` : `${h.h.n} ${h.h.n > 1 ? 'handen' : 'hand'}`}` : '', h.p ? `Pietjesbak ${h.p.r} rondje${h.p.r > 1 ? 's' : ''}` : '', h.n ? `Nappen ${h.n.r} rondje${h.n.r > 1 ? 's' : ''}` : ''].filter(Boolean).join(' · ');
      const total = paid ? paid.reduce((a, b) => a + b, 0) : null;
      const loserTxt = lo ? `${lo.who.map((i) => esc(h.players[i])).join(' &amp; ')} · ${lo.byPaid ? euro(lo.val) : `${lo.val} verloren`}` : 'niemand';
      let body = '';
      if (open) {
        const cols = [h.t ? '<th scope="col">Troeven</th>' : '', h.w ? '<th scope="col">Wiezen</th>' : '', h.h ? '<th scope="col">Harten</th>' : '', h.p ? '<th scope="col">Pietjes</th>' : '', h.n ? '<th scope="col">Nappen</th>' : '', '<th scope="col">Betaald</th>'].join('');
        const rows = h.players.map((nm, i) => `<tr><th class="rowh" scope="row" style="color:var(--p${i})">${esc(nm)}${lo && lo.who.includes(i) ? ' <small class="dl">verliezer</small>' : ''}</th>
          ${h.t ? `<td><span class="w">${h.t.won[i]}</span><span class="l">–${h.t.lost[i]}</span></td>` : ''}
          ${h.w ? `<td><span class="w">${h.w.won[i]}</span><span class="l">–${h.w.lost[i]}</span>${h.w.pts ? `<small class="hpts ${pn(h.w.pts[i])}">${sign(h.w.pts[i])} ptn</small>` : ''}</td>` : ''}
          ${h.h ? `<td><span class="w">${h.h.won[i]}</span><span class="l">–${h.h.lost[i]}</span>${h.h.pts ? `<small class="hpts ${h.h.pts[i] <= 0 ? 'neg' : ''}">${h.h.pts[i]} over</small>` : ''}</td>` : ''}
          ${h.p ? `<td><span class="w">${h.p.won[i]}</span><span class="l">–${h.p.lost[i]}</span></td>` : ''}
          ${h.n ? `<td><span class="w">${h.n.won[i]}</span><span class="l">–${h.n.lost[i]}</span></td>` : ''}
          <td>${paid ? euro(paid[i]) : '–'}</td></tr>`).join('');
        body = `<div class="hbody"><div class="h2h-wrap"><table class="h2h htab"><thead><tr><th></th>${cols}</tr></thead><tbody>${rows}</tbody></table></div>
          <p class="hint">Gewonnen–verloren per rondje. Bij de andere spellen wint de 1ste en verliest wie het meest betaalt.${h.legacy ? ' Van deze avond zijn de bedragen niet bewaard.' : ''}${!h.paid && h.w && !h.w.paid ? ' De wiezen-rekening werd niet ingevuld.' : ''}${!h.paid && h.h && !h.h.paid ? ' De hartenjagen-rekening werd niet ingevuld.' : ''}</p>
          <button class="link" data-act="hDel" data-v="${idx}" style="align-self:flex-start;color:${ui.hDel === idx ? 'var(--danger)' : ''}">${ui.hDel === idx ? 'Tik nog eens om deze avond te verwijderen' : 'Avond verwijderen'}</button></div>`;
      }
      return `<div class="hitem ${open ? 'open' : ''}"><button class="hhead" data-act="hOpen" data-v="${idx}" aria-expanded="${open}">
          <span class="hmain"><span class="hdate">${esc(hDate(h.date))}</span><span class="hsub">${games}${total ? ` · ${euro(total)}` : ''}</span>
          <span class="hlos">Grote verliezer: <b>${loserTxt}</b></span></span><span class="chev">›</span></button>${body}</div>`;
    }).join('');

    return `<section class="panel"><div class="panel-head"><h2>Vorige avonden</h2><span class="label">${all.length} avond${all.length > 1 ? 'en' : ''}</span></div>
      <p class="sub">Klassement</p>
      <div>${sumRows}</div>
      <p class="sub">Per avond · tik voor details</p>
      <div>${items}</div></section>`;
  }

  // ---------- Geschiedenis: spel → spelers → overzicht ----------
  const HK = { troeven: 't', wiezen: 'w', harten: 'h', pietjes: 'p', nappen: 'n', lucky: 'l', darts: 'd', poker: 'k' };
  // Namen vergelijken zonder hoofdletters of spaties: "inez" en "Inez " zijn dezelfde speler.
  const nameKey = (p) => String(p).trim().toLowerCase();
  const groupKey = (players) => players.map(nameKey).sort().join('|');
  // Netste schrijfwijze: liefst met hoofdletter vooraan en niet alles in hoofdletters.
  const nameScore = (p) => (/^\p{Lu}/u.test(p) ? 2 : 0) + (p !== p.toUpperCase() ? 1 : 0);
  const nicer = (a, b) => (nameScore(b.trim()) > nameScore(a.trim()) ? b.trim() : a.trim());
  const tidy = (p) => { const t = p.trim(); return nameScore(t) ? t : t.charAt(0).toUpperCase() + t.slice(1).toLowerCase(); };
  // Wat iedereen voor dit spel betaalde die avond (oudere avonden: enkel als het het enige spel was)
  function gamePaidOf(h, k) {
    const x = h[k];
    if (x.paid) return x.paid;
    return HKEYS.filter((q) => h[q]).length === 1 && h.paid ? h.paid : null;
  }
  function renderHist() {
    const H = ui.hist, all = (S.history || []).map((h, idx) => ({ h, idx }));
    const head = (label) => `<header class="top"><button class="btn ghost sm" data-act="histBack">← Terug</button><span class="label">${label}</span></header>`;
    if (!H.game) {
      const tiles = [...GAMES, POKER_TILE].map((g) => { const n = all.filter(({ h }) => h[HK[g.k]]).length; return `<button class="tile ${g.cls} ${n ? '' : 'off'}" data-act="histGame" data-v="${g.k}" ${n ? '' : 'disabled'}><span class="tart">${GAME_ART[g.k]}</span><span class="tstat">${n ? `${n} avond${n > 1 ? 'en' : ''}` : 'nog niets'}</span><span class="tname">${g.name}</span></button>`; }).join('');
      return `<div class="wrap">${head('Geschiedenis')}<section><h1>Welk <em>spel</em>?</h1></section><div class="tiles">${tiles}</div></div>`;
    }
    const k = HK[H.game], gname = [...GAMES, POKER_TILE].find((g) => g.k === H.game).name;
    const recs = all.filter(({ h }) => h[k]);
    const groups = {};
    recs.forEach(({ h }) => { const key = groupKey(h.players); const g = (groups[key] = groups[key] || { players: h.players, n: 0, last: 0 }); g.n++; g.last = Math.max(g.last, h.date); if (h.players.reduce((t, p) => t + nameScore(p.trim()), 0) > g.players.reduce((t, p) => t + nameScore(p.trim()), 0)) g.players = h.players; });
    if (!H.group) {
      const list = Object.entries(groups).sort((a, b) => b[1].last - a[1].last).map(([key, g]) => `<button class="grp" data-act="histGroup" data-v="${esc(key)}"><span class="grp-names">${g.players.map((p) => esc(tidy(p))).join(' · ')}</span><span class="grp-n">${g.n} avond${g.n > 1 ? 'en' : ''} ›</span></button>`).join('');
      return `<div class="wrap">${head(gname)}<section><h1>Met <em>wie</em>?</h1></section><div class="grps">${list}</div></div>`;
    }
    const all1 = H.group === '*';
    const nights = all1 ? recs : recs.filter(({ h }) => groupKey(h.players) === H.group);
    // Bij poker: alleen wie die avond echt meespeelde
    const inGame = (h) => (h[k].who ? h[k].who : h.players.map((_, i) => i));
    const players = all1 ? [...new Map(nights.flatMap(({ h }) => inGame(h).map((i) => [nameKey(h.players[i]), h.players[i]]))).values()] : (groups[H.group] ? groups[H.group].players : []);
    // Klassement voor dit spel en deze spelers
    const agg = {};
    nights.forEach(({ h }) => {
      const x = h[k], paid = gamePaidOf(h, k);
      const mx = paid ? Math.max(...paid) : Math.max(...x.lost);
      h.players.forEach((nm, i) => {
        if (!inGame(h).includes(i)) return;
        const a = agg[nameKey(nm)] = agg[nameKey(nm)] || { name: nm.trim(), nights: 0, won: 0, lost: 0, paid: 0, paidN: 0, loser: 0 };
        a.name = nicer(a.name, nm);
        a.nights++; a.won += x.won[i] || 0; a.lost += x.lost[i] || 0;
        if (paid) { a.paid += paid[i]; a.paidN++; }
        if (mx > 0 && (paid ? paid[i] : x.lost[i]) === mx) a.loser++;
      });
    });
    const avg = (a) => (a.paidN ? a.paid / a.paidN : Infinity);
    const names = Object.keys(agg).sort((a, b) => avg(agg[a]) - avg(agg[b]) || agg[b].won - agg[a].won || agg[a].loser - agg[b].loser);
    if (H.game === 'poker') {
      nights.forEach(({ h }) => { const x = h[k]; if (!x.net) return; h.players.forEach((nm, i) => { const a = agg[nameKey(nm)]; if (a) a.net = (a.net || 0) + x.net[i]; }); });
      names.sort((a, b) => (agg[b].net || 0) - (agg[a].net || 0));
    }
    const krows = names.map((nm, i) => { const a = agg[nm]; return H.game === 'poker'
      ? `<div class="krow"><span class="kn">${i + 1}</span><span class="kname">${esc(tidy(a.name))}<small>${a.nights} avond${a.nights > 1 ? 'en' : ''} · ${a.won}× winst · ${a.lost}× verlies</small></span>
        <span class="kpaid ${pn(a.net || 0)}">${(a.net || 0) > 0 ? '+' : (a.net || 0) < 0 ? '−' : ''}${euro(Math.abs(a.net || 0))}<small>${a.nights ? `gem. ${euro(Math.abs((a.net || 0) / a.nights))}` : ''}</small></span></div>`
      : `<div class="krow"><span class="kn">${i + 1}</span>
      <span class="kname">${esc(tidy(a.name))}<small>${a.won}–${a.lost} rondjes${a.loser ? ` · <b class="neg">${a.loser}× verliezer</b>` : ''}</small></span>
      <span class="kpaid">${a.paidN ? euro(a.paid) : '–'}<small>${a.paidN ? `gem. ${euro(a.paid / a.paidN)}` : ''}</small></span></div>`; }).join('');
    const items = nights.slice().reverse().map(({ h, idx }) => {
      const x = h[k], paid = gamePaidOf(h, k), open = ui.hOpen === idx;
      const mx = paid ? Math.max(...paid) : Math.max(...x.lost);
      const losers = mx > 0 ? h.players.filter((_, i) => (paid ? paid[i] : x.lost[i]) === mx) : [];
      const total = paid ? paid.reduce((a, b) => a + b, 0) : null;
      const body = open ? `<div class="hbody"><div class="h2h-wrap"><table class="h2h htab"><thead><tr><th></th><th scope="col">Won–verl.</th><th scope="col">Betaald</th></tr></thead><tbody>${h.players.map((nm, i) => (inGame(h).includes(i) ? `<tr><th class="rowh" scope="row" style="color:var(--p${i})">${esc(tidy(nm))}</th><td><span class="w">${x.won[i]}</span><span class="l">–${x.lost[i]}</span></td><td>${x.net ? `<span class="${pn(x.net[i])}">${x.net[i] > 0 ? '+' : x.net[i] < 0 ? '−' : ''}${euro(Math.abs(x.net[i]))}</span>` : paid ? euro(paid[i]) : '–'}</td></tr>` : '')).join('')}</tbody></table></div>
        <button class="link" data-act="hDel" data-v="${idx}" style="align-self:flex-start;color:${ui.hDel === idx ? 'var(--danger)' : ''}">${ui.hDel === idx ? 'Tik nog eens om deze avond te verwijderen' : 'Avond verwijderen'}</button></div>` : '';
      return `<div class="hitem ${open ? 'open' : ''}"><button class="hhead" data-act="hOpen" data-v="${idx}" aria-expanded="${open}">
        <span class="hmain"><span class="hdate">${esc(hDate(h.date))}</span><span class="hsub">${H.game === 'poker' ? `${inGame(h).length} spelers · ${inGame(h).map((i) => esc(tidy(h.players[i]))).join(', ')}` : `${x.r || x.n} rondje${(x.r || x.n) > 1 ? 's' : ''}${total ? ` · ${euro(total)}` : ''}`}</span>
        ${losers.length ? `<span class="hlos">Grote verliezer: <b>${losers.map(esc).join(' &amp; ')}</b></span>` : ''}</span><span class="chev">›</span></button>${body}</div>`;
    }).join('');
    return `<div class="wrap">${head(gname)}
      <section><h1>${esc(gname)}</h1><p class="lead">${all1 ? 'Alle spelers samen' : players.map((p) => esc(tidy(p))).join(' · ')}</p></section>
      <section class="panel"><h2>Klassement</h2><div>${krows}</div></section>
      <section class="panel"><div class="panel-head"><h2>Avonden</h2><span class="label">${nights.length}</span></div><div>${items}</div></section>
    </div>`;
  }

  // ---------- Start van de avond ----------
  const nightBusy = () => !!(openAny() || owedAll().n);
  function renderStart() {
    const names = ui.names || S.players, n = names.length, locked = nightBusy();
    return `<div class="wrap">
      <header class="top"><div class="brand">Spelletjes</div>${syncChip()}</header>
      <section><p class="label">${esc(today())}</p><h1>Wie speelt er <em>mee</em>?</h1>
        <p class="lead">In volgorde rond de tafel.</p></section>
      <form id="startForm" class="steps" autocomplete="off">
        <div class="panel" style="gap:0;padding-block:6px">${names.map((nm, i) => `<label class="pfield" style="--pc:var(--p${i})"><span>${i + 1}</span><input id="sp${i}" value="${esc(nm || '')}" placeholder="Speler ${i + 1}" maxlength="18" enterkeyhint="${i < n - 1 ? 'next' : 'done'}"></label>`).join('')}</div>
        ${locked ? '<p class="hint">Het aantal spelers ligt vast tot een nieuwe avond.</p>' : `<div class="np"><button type="button" class="btn ghost sm" data-act="npSet" data-v="-1" ${n <= 2 ? 'disabled' : ''}>− speler</button><span class="label">${n} spelers</span><button type="button" class="btn ghost sm" data-act="npSet" data-v="1" ${n >= 8 ? 'disabled' : ''}>+ speler</button></div>`}
        <p class="err" id="startErr" style="min-height:0"></p>
        <button class="btn primary xl" type="submit">Verder <span class="arr">→</span></button>
        <button class="btn ghost block" type="button" data-act="histOpen">Geschiedenis</button>
      </form></div>`;
  }

  // ---------- Overzicht van de avond ----------
  function rondjesTonight() {
    const items = [];
    finished().forEach((r) => items.push({ t: r.end || r.start, game: 'Troeven', price: r.price, txt: r.price ? `${tName(r, 1 - r.winner)} betalen` : `${tName(r, r.winner)} wonnen` }));
    PG_KEYS.forEach((g) => PG[g].st().rondjes.forEach((r) => {
      if (!r.end || r.price == null) return;
      const name = PG[g].title;
      const { out } = wPayPct(rankOf(g, r), r.pct);
      const mx = Math.max(...out);
      const most = out.map((_, i) => i).filter((i) => out[i] === mx);
      items.push({ t: r.end, game: name, price: r.price, txt: r.price ? `${most.map(P).join(' &amp; ')} ${most.length > 1 ? 'betalen' : 'betaalt'} het meest` : (() => { const best = out.map((_, i) => i).filter((i) => out[i] === Math.min(...out)); return `${best.map(P).join(' &amp; ')} ${best.length > 1 ? 'wonnen' : 'won'}`; })() });
    }));
    return items.sort((a, b) => a.t - b.t);
  }
  // Wanneer begon de avond? Het eerste rondje (van eender welk spel) of de poker
  function firstStart() {
    const ts = [...S.rounds.map((r) => r.start), ...PG_KEYS.flatMap((g) => PG[g].st().rondjes.map((r) => r.start)), S.pk.on ? S.pk.start : null].filter(Boolean);
    return ts.length ? Math.min(...ts) : null;
  }
  function liveTxt() {
    const t0 = firstStart(); if (!t0) return esc(today());
    const m = Math.max(0, Math.floor((Date.now() - t0) / 60000)), h = Math.floor(m / 60);
    return `Bezig sinds ${new Date(t0).toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' })} · ${h ? `${h}u ${String(m % 60).padStart(2, '0')}` : `${m} min`}`;
  }
  function renderHub() {
    const A = owedAll(), items = rondjesTonight();
    const list = items.map((x, k) => `<div class="rround"><span class="no">${k + 1}</span><div class="txt"><b>${x.game}</b><br><span class="muted">${x.txt}</span></div><div class="amt ${x.price ? '' : 'muted'}">${x.price ? euro(x.price) : 'gratis'}</div></div>`).reverse().join('');
    return `<div class="wrap">
      <header class="top"><div class="brand">Spelletjes</div><div style="display:flex;gap:12px;align-items:center">${syncChip()}<button class="btn ghost sm" data-act="toStart">Spelers</button></div></header>
      <section><p class="label">${firstStart() ? `<span class="live" id="liveClock">${liveTxt()}</span>` : esc(today())}</p><h1>${A.n ? `Rondje <em>${A.n + 1}</em>` : 'Een nieuwe <em>avond</em>'}</h1></section>
      <button class="btn primary xl" data-act="newRondje">Nieuw rondje <span class="arr">→</span></button>
      ${S.pk.on ? `<div class="row2"><button class="btn ghost" data-act="pkOpen">♠ Poker · ${S.pk.step === 'done' ? 'klaar' : 'bezig'}</button><button class="btn ghost" data-act="histOpen">Geschiedenis</button></div>` : '<button class="btn ghost block" data-act="histOpen">Geschiedenis</button>'}
      ${avondPanel()}
      ${items.length ? `<section class="panel"><h2>Rondjes</h2><div>${list}</div></section>` : ''}
      <section class="panel"><h2>Back-up</h2>
        <div class="row2"><button class="btn soft" data-act="backupOut">Bewaren</button><button class="btn soft" data-act="backupIn">Terugzetten</button></div>
        <p class="muted" id="bkMsg" style="margin:0;font-size:13px"></p></section>
    </div>${A.n || S.pk.on ? dock() : ''}`;
  }

  // ---------- Nieuw rondje: 1. prijs ----------
  function renderNPrice() {
    const last = S.lastPrice, money = ui.flow.money !== false;
    if (ui.calc.target !== 'nprice') ui.calc = { expr: last ? fmt(last) : '', target: 'nprice' };
    const toggle = `<div class="seg money-seg"><button class="opt ${money ? 'on' : ''}" type="button" data-act="moneySet" data-v="1"><span class="big">Met geld</span></button><button class="opt ${money ? '' : 'on'}" type="button" data-act="moneySet" data-v="0"><span class="big">Zonder geld</span></button></div>`;
    return `<div class="wrap">
      <header class="top"><button class="btn ghost sm" data-act="flowBack">← Terug</button><span class="label">Rondje ${owedAll().n + 1}</span></header>
      ${toggle}
      ${money ? `<section><h1>Wat kost <em>het rondje</em>?</h1></section>
      <form id="nPriceForm" class="steps" autocomplete="off">
        ${calcHTML()}
        ${last ? `<div><button type="button" class="chip" data-act="setprice" data-v="${last}">Zelfde als vorige · ${euro(last)}</button></div>` : ''}
        <p class="err" id="priceErr" style="min-height:0"></p>
        <button class="btn primary xl" type="submit">Kies het spel <span class="arr">→</span></button>
      </form>` : `<section><h1>Rondje <em>zonder geld</em></h1><p class="lead">Ook voor poker, dat heeft een eigen kassa.</p></section>
      <button class="btn primary xl" data-act="freeRondje">Kies het spel <span class="arr">→</span></button>`}</div>`;
  }

  // ---------- Nieuw rondje: 2. spel ----------
  // Een nieuw spel = één regel in GAMES + een tekening in GAME_ART.
  const GAME_ART = {
    troeven: `<svg viewBox="0 0 96 96" aria-hidden="true"><path d="M48 14v70" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".55"/>${[0, 1, 2, 3, 4, 5].map((k) => `<rect x="${24 + (k % 2) * 4}" y="${70 - k * 10}" width="${44 - (k % 2) * 8 - k * 2}" height="4.5" rx="2.2" fill="currentColor" opacity="${k > 3 ? .35 : 1}"/>`).join('')}<g transform="translate(58 8) rotate(12)"><rect width="26" height="36" rx="4" fill="#fff"/><text x="13" y="24" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-weight="700" font-size="18" fill="#2b1d55">B</text></g></svg>`,
    wiezen: `<svg viewBox="0 0 96 96" aria-hidden="true">${[-20, 0, 20].map((a, k) => `<g transform="rotate(${a} 48 84)"><rect x="32" y="22" width="32" height="46" rx="5" fill="#fff" opacity="${.55 + k * .22}"/></g>`).join('')}<g transform="rotate(20 48 84)"><path d="M54 32c-5 6-11 9-11 15a5 5 0 0 0 9 3l-2 6h8l-2-6a5 5 0 0 0 9-3c0-6-6-9-11-15z" fill="#07324a"/></g></svg>`,
    pietjes: `<svg viewBox="0 0 96 96" aria-hidden="true">${[[14, 40, -14], [40, 18, 8], [50, 50, 18]].map(([x, y, a], k) => `<g transform="rotate(${a} ${x + 16} ${y + 16})"><rect x="${x}" y="${y}" width="32" height="32" rx="7" fill="#fff" opacity="${.75 + k * .12}"/>${[[[16, 16]], [[9, 9], [23, 23]], [[9, 9], [16, 16], [23, 23]]][k].map(([cx, cy]) => `<circle cx="${x + cx}" cy="${y + cy}" r="3.4" fill="#5a3300"/>`).join('')}</g>`).join('')}</svg>`,
    poker: `<svg viewBox="0 0 96 96" aria-hidden="true"><g transform="rotate(-14 40 50)"><rect x="18" y="20" width="40" height="56" rx="6" fill="#fff" opacity=".8"/></g><g transform="rotate(10 56 50)"><rect x="34" y="18" width="40" height="56" rx="6" fill="#fff"/><path d="M54 32c-6 7-13 10-13 17a6 6 0 0 0 11 3l-2 7h9l-2-7a6 6 0 0 0 11-3c0-7-7-10-14-17z" fill="#3a0d1e"/></g><circle cx="74" cy="74" r="14" fill="#ffd166" stroke="#fff" stroke-width="3"/><circle cx="74" cy="74" r="7" fill="none" stroke="#7a4a00" stroke-width="2" stroke-dasharray="3 3"/></svg>`,
    darts: `<svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="44" cy="52" r="32" fill="#fff"/><circle cx="44" cy="52" r="22" fill="none" stroke="#0b3b4a" stroke-width="5"/><circle cx="44" cy="52" r="11" fill="#0b3b4a"/><circle cx="44" cy="52" r="4" fill="#fff"/><path d="M47 49 84 12" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M84 12l-11 1 4 6zM84 12l-1 11-6-4z" fill="#fff"/></svg>`,
    lucky: `<svg viewBox="0 0 96 96" aria-hidden="true"><text x="40" y="76" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-weight="700" font-size="74" fill="#fff">7</text>${[[72, 22, 9], [80, 48, 6], [62, 8, 5]].map(([cx, cy, r]) => `<path d="M${cx} ${cy - r}l${r * .3} ${r * .7} ${r * .7} ${r * .3}-${r * .7} ${r * .3}-${r * .3} ${r * .7}-${r * .3}-${r * .7}-${r * .7}-${r * .3} ${r * .7}-${r * .3}z" fill="#fff" opacity=".9"/>`).join('')}</svg>`,
    nappen: `<svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="40" cy="50" r="27" fill="#fff"/><text x="40" y="60" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="28" fill="#1f4d10">20</text><circle cx="74" cy="26" r="13" fill="#fff" opacity=".9"/><path d="M74 19v14M67 26h14" stroke="#1f4d10" stroke-width="3.5" stroke-linecap="round"/><circle cx="76" cy="66" r="11" fill="#fff" opacity=".7"/><path d="M70 66h12" stroke="#1f4d10" stroke-width="3.5" stroke-linecap="round"/></svg>`,
    harten: `<svg viewBox="0 0 96 96" aria-hidden="true"><path d="M48 80 20 52a16 16 0 0 1 28-20 16 16 0 0 1 28 20z" fill="#fff"/><path d="M14 28 70 62" stroke="#5a0f33" stroke-width="3.5" stroke-linecap="round"/><path d="M70 62l-9-1 5-7z" fill="#5a0f33"/><path d="M14 28l6 1-3 5z" fill="#5a0f33"/></svg>`,
  };
  const GAMES = [
    { k: 'troeven', name: 'Troeven', cls: 'g-troef', min: 4, max: 4 },
    { k: 'wiezen', name: 'Wiezen', cls: 'g-wiez', min: 4, max: 4 },
    { k: 'harten', name: 'Hartenjagen', cls: 'g-hart', min: 4, max: 4 },
    { k: 'pietjes', name: 'Pietjesbak', cls: 'g-pietjes', min: 2, max: 8 },
    { k: 'nappen', name: 'Nappen', cls: 'g-nappen', min: 3, max: 8 },
    { k: 'lucky', name: 'Lucky 7', cls: 'g-lucky', min: 3, max: 7 },
    { k: 'darts', name: 'Darts', cls: 'g-darts', min: 2, max: 8 },
  ];
  const POKER_TILE = { k: 'poker', name: 'Poker', cls: 'g-poker' };
  function renderPick() {
    const n = S.players.length;
    const tiles = GAMES.map((g) => { const ok = n >= g.min && n <= g.max; return `<button class="tile ${g.cls} ${ok ? '' : 'off'}" data-act="flowGame" data-v="${g.k}" ${ok ? '' : 'disabled'}><span class="tart">${GAME_ART[g.k]}</span>${ok ? '' : `<span class="tstat">${g.min === g.max ? g.min : `${g.min}–${g.max}`} spelers</span>`}<span class="tname">${g.name}</span></button>`; }).join('');
    const free = ui.flow.price === 0, pkOk = free && n >= 2;
    const poker = `<button class="tile ${POKER_TILE.cls} ${pkOk ? '' : 'off'}" data-act="pokerPick"><span class="tart">${GAME_ART.poker}</span>${pkOk ? (S.pk.on ? '<span class="tstat">bezig</span>' : '') : '<span class="tstat">zonder geld</span>'}<span class="tname">Poker</span></button>`;
    const count = GAMES.length + 1;
    const soon = count % 2 ? '<div class="tile soon" aria-hidden="true"><span class="tname">Binnenkort</span></div>' : '';
    return `<div class="wrap">
      <header class="top"><button class="btn ghost sm" data-act="flowBack">← Terug</button><span class="label">Rondje ${owedAll().n + 1} · ${priceTxt(ui.flow.price)}</span></header>
      <section><h1>Welk <em>spel</em>?</h1></section>
      <div class="tiles">${tiles}${poker}${soon}</div></div>`;
  }

  // ---------- Nieuw rondje: 3. wie betaalt hoeveel (wiezen en hartenjagen) ----------
  const samePct = (a, b) => a.every((v, i) => v === b[i]);
  function renderNPct() {
    const g = ui.flow.game, p = ui.pct, wz = g === 'wiezen', free = ui.flow.price === 0;
    const sub = (i) => (i === 0 ? 'winnaar' : i === p.length - 1 ? 'verliezer' : '');
    const rows = p.map((v, i) => `<div class="pctrow"><span class="pl">${ORD[i]}${sub(i) ? `<small>${sub(i)}</small>` : ''}</span>
      <div class="stepper"><button type="button" data-act="pctStep" data-i="${i}" data-v="-5" aria-label="5 procent minder">−</button><input id="pct${i}" inputmode="numeric" maxlength="3" value="${v}" aria-label="Percentage ${ORD[i]} plaats"><span class="pc">%</span><button type="button" data-act="pctStep" data-i="${i}" data-v="5" aria-label="5 procent meer">+</button></div></div>`).join('');
    return `<div class="wrap">
      <header class="top"><button class="btn ghost sm" data-act="flowBack">← Terug</button><span class="label">${PG[g].title} · ${priceTxt(ui.flow.price)}</span></header>
      <section><h1>${free ? 'Rondje <em>zonder geld</em>' : 'Wie betaalt <em>hoeveel</em>?'}</h1></section>
      ${free ? '' : `<div class="chips">${presetsFor(p.length).map((x, i) => `<button class="chip ${samePct(x.v, p) ? 'on' : ''}" data-act="pctPreset" data-v="${i}">${x.n}</button>`).join('')}</div>
      <section class="panel" style="gap:0;padding-block:6px">${rows}</section>
      <div id="pctSum">${pctSumHTML()}</div>`}
      ${wz ? `<section class="steps" style="gap:10px"><p class="label">Spelletjes per rondje</p>
        <div class="chips">${[1, 4, 8, 12, 16].map((v) => `<button class="chip ${ui.per === v ? 'on' : ''}" data-act="perSet" data-v="${v}">${v}</button>`).join('')}</div></section>` : ''}
      ${g === 'darts' ? `<section class="steps" style="gap:10px"><p class="label">Welk spel?</p>
        <div class="chips">${DT_MODES.map(([k, nm]) => `<button class="chip ${ui.dmode === k ? 'on' : ''}" data-act="dModeSet" data-v="${k}">${nm}</button>`).join('')}</div>
        ${ui.dmode === 'cricket' ? '<p class="hint">20 t.e.m. 15 en de bull elk 3 keer raken. Extra treffers op een nummer dat de anderen nog open hebben, geven punten. Wie alles dicht heeft met de meeste punten, wint.</p>'
          : `<div class="chips"><button class="chip ${ui.dout ? '' : 'on'}" data-act="dOutSet" data-v="0">Gewoon uitgooien</button><button class="chip ${ui.dout ? 'on' : ''}" data-act="dOutSet" data-v="1">Dubbel uit</button></div>`}</section>` : ''}
      ${g === 'pietjes' ? `<section class="steps" style="gap:10px"><p class="label">Streepjes bij de start</p>
        <div class="chips">${[5, 7, 9, 12].map((v) => `<button class="chip ${ui.boom === v ? 'on' : ''}" data-act="boomSet" data-v="${v}">${v}</button>`).join('')}</div></section>` : ''}
      <button class="btn primary xl" data-act="npctStart" id="pctSave" ${free || p.reduce((a, b) => a + b, 0) === 100 ? '' : 'disabled'}>Start rondje <span class="arr">→</span></button>
    </div>`;
  }
  function pctSumHTML() {
    const p = ui.pct, sum = p.reduce((a, b) => a + b, 0);
    const msg = sum === 100 ? '<span class="ok">100%</span>' : sum < 100 ? `<span class="bad">nog ${100 - sum}%</span>` : `<span class="bad">${sum - 100}% te veel</span>`;
    const price = ui.flow && ui.flow.price;
    return `<div class="steps" style="gap:8px"><div class="sumline"><span class="label">Totaal</span>${msg}</div>
      <div class="pctbar">${p.map((v, i) => (v ? `<i style="flex:${v};--o:${i / 3}"></i>` : '')).join('')}</div>
      ${sum === 100 && price ? `<p class="hint">${p.map((v, i) => `${ORD[i]} ${euro(price * v / 100)}`).join(' · ')}</p>` : ''}</div>`;
  }
  function updatePct() {
    const s = document.getElementById('pctSum'); if (s) s.innerHTML = pctSumHTML();
    const b = document.getElementById('pctSave'); if (b) b.disabled = ui.pct.reduce((a, c) => a + c, 0) !== 100;
    document.querySelectorAll('.chip[data-act="pctPreset"]').forEach((c) => c.classList.toggle('on', samePct(presetsFor(ui.pct.length)[+c.dataset.v].v, ui.pct)));
  }

  // Wat iedereen betaalt voor een uitgespeeld rondje
  function rondjeRows(g, r) {
    const tot = PG[g].tot(r);
    const { out, place, order, tied } = wPayPct(rankOf(g, r), r.pct);
    return order.map((i) => `<div class="srow" style="--pc:var(--p${i})"><span class="who">${P(i)}<span class="meta">${tied[i] ? 'gedeeld ' : ''}${ORD[place[i]]} · ${ptsLabel(g, tot[i], r)}</span></span>
      <span class="owe ${out[i] && r.price ? '' : 'zero'}">${r.price ? `${euro(r.price * out[i] / 100)}<small>${fmtPct(out[i])}</small>` : '–'}</span></div>`).join('');
  }
  // Wat iedereen deze avond al moet betalen, over alle spellen samen
  function avondPanel() {
    const A = owedAll(), pk = pokerNet();
    if (!A.n && !pk) return '';
    if (!A.n) return '';
    return `<section class="panel"><div class="panel-head"><h2>Te betalen vanavond</h2><span class="label" style="white-space:nowrap">${euro(A.total)}</span></div>
      <div>${S.players.map((p, i) => `<div class="srow" style="--pc:var(--p${i})"><span class="who">${esc(p)}</span><span class="owe ${A.owed[i] ? '' : 'zero'}">${euro(A.owed[i])}</span></div>`).join('')}</div></section>`;
  }
  const gameHeader = (name) => `<header class="top"><div class="brand">${name}</div>${syncChip()}</header>`;
  const doneButtons = () => `<button class="btn primary xl" data-act="newRondje">Nieuw rondje <span class="arr">→</span></button><button class="btn ghost block" data-act="home">Overzicht</button>`;

  // ---------- Wiezen: stand ----------
  function wRoundText(r) {
    const b = wbid(r.k);
    const extra = b.extra && r.diff ? ` (${r.made ? '+' : '−'}${r.diff})` : '';
    return `${esc(b.n)} · ${r.sel.map(P).join(' &amp; ')} · ${r.made ? 'gehaald' : 'niet gehaald'}${extra}`;
  }
  function renderWGame() {
    const W = S.wz, c = openOf(W), last = lastOf(W), nr = owedAll().n + (c ? 1 : 0), r = c || last;
    let head, main, stand = '';
    if (c) {
      const k = c.games.length, tot = wTot(c);
      const { out, place, order, tied } = wPayPct(tot, c.pct);
      head = `<p class="label">Rondje ${nr} · ${priceTxt(c.price)} · ${P(W.dealer)} deelt</p>
        <h1>Spelletje <em>${k + 1}</em>${c.per > 1 ? ` <span class="of">van ${c.per}</span>` : ''}</h1>`;
      main = `<button class="btn primary xl" data-act="wNew">Nieuw spelletje <span class="arr">→</span></button>`;
      if (k) {
        stand = `<section class="panel"><div class="panel-head"><h2>Stand</h2><button class="link" data-act="wNextDealer">Volgende deler</button></div>
          <div>${order.map((i) => `<div class="srow" style="--pc:var(--p${i})"><span class="who">${P(i)}${W.dealer === i ? '<small class="dl">deler</small>' : ''}
            <span class="meta">${tied[i] ? 'gedeeld ' : ''}${ORD[place[i]]}${c.price ? ` · ${euro(c.price * out[i] / 100)}` : ''}</span></span>
            <span class="pts ${pn(tot[i])}">${sign(tot[i])}</span></div>`).join('')}</div></section>`;
      }
    } else {
      head = `<p class="label">Wiezen · ${priceTxt(last.price)}</p><h1>Rondje <em>gedaan</em></h1>`;
      main = doneButtons();
      stand = `<section class="panel"><div class="panel-head"><h2>${last.price ? 'Wie betaalt' : 'Uitslag'}</h2></div><div>${rondjeRows('wiezen', last)}</div></section>`;
    }
    const games = r ? r.games : [];
    const hist = games.map((g, i) => `<div class="hrow"><span class="n">${i + 1}</span><span>${wRoundText(g)}</span><span class="sc ${pn(g.d[g.sel[0]])}">${sign(g.d[g.sel[0]])}</span></div>`).reverse().join('');
    return `<div class="wrap">
      ${gameHeader('Wiezen')}
      <section>${head}</section>
      ${main}
      ${stand}
      ${games.length ? `<section class="panel"><div class="panel-head"><h2>Gespeeld</h2><button class="btn soft sm" data-act="wUndo">Laatste ongedaan</button></div><div>${hist}</div></section>` : ''}
      ${c ? avondPanel() : ''}
      <button class="link" data-act="wPts" style="align-self:center">Puntentabel</button>
    </div>${dock()}`;
  }

  // ---------- Wiezen: een spelletje ingeven ----------
  function renderWRound() {
    const R = ui.wr, b = R.k ? wbid(R.k) : null, need = b ? (b.duo ? 2 : 1) : 0, c = openOf(S.wz);
    const ready = !!b && R.sel.length === need;
    const d = ready && R.made !== null ? wDelta(R.k, R.sel, R.made, R.diff) : null;
    const who = ready ? (need === 2 ? 'Hebben ze het gehaald?' : `Heeft ${P(R.sel[0])} het gehaald?`) : 'Gehaald?';
    const extra = b && b.extra && R.made !== null ? `<div class="pctrow"><span class="pl">${R.made ? 'Extra slagen' : 'Slagen te weinig'}<small>${R.made ? `boven de ${b.min}${b.cap ? `, telt tot ${b.cap} extra` : ''}` : `onder de ${b.min}`}</small></span>
      <div class="stepper"><button type="button" data-act="wDiff" data-v="-1" aria-label="Minder">−</button><output>${R.diff}</output><button type="button" data-act="wDiff" data-v="1" aria-label="Meer">+</button></div></div>` : '';
    return `<div class="wrap">
      <header class="top"><button class="btn ghost sm" data-act="wCancel">← Terug</button><span class="label">Spelletje ${c ? c.games.length + 1 : 1} · ${P(S.wz.dealer)} deelt</span></header>
      <section class="steps">
        <div class="step"><div class="slabel"><span class="no">1</span><span class="label">Wat wordt er gespeeld?</span></div>
          <div class="seg">${WBIDS.map((x) => `<button class="opt ${R.k === x.k ? 'on' : ''}" data-act="wBid" data-v="${x.k}"><span class="big">${x.n}</span><small>${x.need} · ${wpts(x.k)} ptn</small></button>`).join('')}</div></div>
        <div class="step ${b ? '' : 'wait'}" id="wstep2"><div class="slabel"><span class="no">2</span><span class="label">${b && b.duo ? 'Welke 2 spelen samen?' : 'Wie speelt?'}</span></div>
          <div class="seg">${S.players.map((p, i) => `<button class="opt ${R.sel.includes(i) ? 'who-on' : ''}" data-act="wPick" data-v="${i}" style="--pc:var(--p${i})"><span class="big">${esc(p)}</span></button>`).join('')}</div></div>
        <div class="step ${ready ? '' : 'wait'}" id="wstep3"><div class="slabel"><span class="no">3</span><span class="label">${who}</span></div>
          <div class="seg"><button class="opt res ${R.made === true ? 'on' : ''}" data-act="wMade" data-v="1"><span class="big">Gehaald</span></button><button class="opt res lose ${R.made === false ? 'on' : ''}" data-act="wMade" data-v="0"><span class="big">Niet gehaald</span></button></div>
          ${extra}</div>
      </section>
      ${d ? `<section class="panel"><h2>Punten</h2><div class="dgrid">${d.map((v, j) => `<div class="dcell"><span>${P(j)}</span><b class="${pn(v)}">${sign(v)}</b></div>`).join('')}</div></section>` : ''}
      <button class="btn primary xl" data-act="wSave" ${d ? '' : 'disabled'}>Bewaar spelletje <span class="arr">→</span></button>
    </div>`;
  }

  // ---------- Hartenjagen: stand ----------
  function renderHGame() {
    const H = S.hj, c = openOf(H), last = lastOf(H), nr = owedAll().n + (c ? 1 : 0), r = c || last;
    let head, main, stand = '';
    if (c) {
      const n = c.hands.length, tot = hTot(c);
      const { out, place, order, tied } = wPayPct(tot, c.pct);
      head = `<p class="label">Rondje ${nr} · ${priceTxt(c.price)}</p>
        <h1>${n ? `Hand <em>${n + 1}</em>` : 'Iedereen op <em>100</em>'}</h1>
        <p class="lead">${P(H.dealer)} deelt · ${PASS[n % 4]}</p>`;
      main = `<button class="btn primary xl" data-act="hNew">Nieuwe hand <span class="arr">→</span></button>`;
      stand = `<section class="panel"><div class="panel-head"><h2>Stand</h2><button class="link" data-act="hNextDealer">Volgende deler</button></div>
        <div>${order.map((i) => `<div class="hjrow" style="--pc:var(--p${i})">
          <div class="hjtop"><span class="who">${P(i)}${H.dealer === i ? '<small class="dl">deler</small>' : ''}</span><span class="hjnum">${tot[i]}</span></div>
          <div class="hjbar"><i style="width:${Math.max(0, Math.min(100, tot[i]))}%"></i></div>
          ${n ? `<span class="meta">${tied[i] ? 'gedeeld ' : ''}${ORD[place[i]]}${c.price ? ` · ${euro(c.price * out[i] / 100)}` : ''}</span>` : ''}</div>`).join('')}</div></section>`;
    } else {
      head = `<p class="label">Hartenjagen · ${priceTxt(last.price)}</p><h1>Rondje <em>gedaan</em></h1>`;
      main = doneButtons();
      stand = `<section class="panel"><div class="panel-head"><h2>${last.price ? 'Wie betaalt' : 'Uitslag'}</h2></div><div>${rondjeRows('harten', last)}</div></section>`;
    }
    const hands = r ? r.hands : [];
    const hist = hands.map((h, k) => {
      const txt = h.moon !== null && h.moon !== undefined ? `<b>${P(h.moon)}</b> pakte alles, de anderen −26`
        : h.p.map((v, i) => (v ? `${P(i)} −${v}${h.q === i ? ' (♠V)' : ''}` : '')).filter(Boolean).join(' · ') || 'niemand punten';
      return `<div class="hrow"><span class="n">${k + 1}</span><span>${txt}</span><span></span></div>`;
    }).reverse().join('');
    return `<div class="wrap">
      ${gameHeader('Hartenjagen')}
      <section>${head}</section>
      ${main}
      ${stand}
      ${hands.length ? `<section class="panel"><div class="panel-head"><h2>Gespeeld</h2><button class="btn soft sm" data-act="hUndo">Laatste ongedaan</button></div><div>${hist}</div></section>` : ''}
      ${c ? avondPanel() : ''}
    </div>${dock()}`;
  }

  // ---------- Pietjesbak: stand ----------
  const pjType = (t) => PJ_TYPES.find((x) => x[0] === t);
  const stripes = (v, boom) => `<span class="pjs" aria-label="${v} streepjes">${Array.from({ length: Math.max(boom, v) }, (_, k) => `<i class="${k < v ? '' : 'off'}"></i>`).join('')}</span>`;
  function renderPGame() {
    const J = S.pj, c = openOf(J), last = lastOf(J), nr = owedAll().n + (c ? 1 : 0), r = c || last;
    let head, main, stand = '';
    if (c) {
      const n = c.beurten.length, tot = pTot(c);
      const { out, place, order, tied } = wPayPct(tot.map((v) => -v), c.pct);
      head = `<p class="label">Rondje ${nr} · ${priceTxt(c.price)}</p><h1>${n ? `Beurt <em>${n + 1}</em>` : `Iedereen op <em>${c.boom}</em>`}</h1>`;
      main = `<button class="btn primary xl" data-act="pNew">Nieuwe beurt <span class="arr">→</span></button>`;
      stand = `<section class="panel"><div class="panel-head"><h2>Stand</h2></div>
        <div>${order.map((i) => `<div class="hjrow" style="--pc:var(--p${i})">
          <div class="hjtop"><span class="who">${P(i)}</span><span class="hjnum">${tot[i]}</span></div>
          ${stripes(tot[i], c.boom)}
          ${n ? `<span class="meta">${tied[i] ? 'gedeeld ' : ''}${ORD[place[i]]}${c.price ? ` · ${euro(c.price * out[i] / 100)}` : ''}</span>` : ''}</div>`).join('')}</div></section>`;
    } else {
      head = `<p class="label">Pietjesbak · ${priceTxt(last.price)}</p><h1>Rondje <em>gedaan</em></h1>`;
      main = doneButtons();
      stand = `<section class="panel"><div class="panel-head"><h2>${last.price ? 'Wie betaalt' : 'Uitslag'}</h2></div><div>${rondjeRows('pietjes', last)}</div></section>`;
    }
    const bs = r ? r.beurten : [];
    const hist = bs.map((b, k) => `<div class="hrow"><span class="n">${k + 1}</span><span><b>${P(b.w)}</b> · ${pjType(b.t)[1].toLowerCase()} ${pjType(b.t)[2]}${b.plus.length ? ` · +1 ${b.plus.map(P).join(', ')}` : ''}</span><span></span></div>`).reverse().join('');
    return `<div class="wrap">
      ${gameHeader('Pietjesbak')}
      <section>${head}</section>
      ${main}
      ${stand}
      ${bs.length ? `<section class="panel"><div class="panel-head"><h2>Gespeeld</h2><button class="btn soft sm" data-act="pUndo">Laatste ongedaan</button></div><div>${hist}</div></section>` : ''}
      ${c ? avondPanel() : ''}
    </div>${dock()}`;
  }

  // ---------- Poker: buy-in → buy-out → verrekening ----------
  const cents = (t) => { const x = String(t || '').trim().replace(/€/g, '').replace(/\s/g, '').replace(',', '.'); if (!/^\d+(\.\d{0,2})?$/.test(x)) return null; return Math.round(parseFloat(x) * 100); };
  function renderPoker() {
    const K = S.pk, head = (label) => `<header class="top"><button class="btn ghost sm" data-act="pkBack">← ${K.on && K.step !== 'setup' ? 'Overzicht' : 'Terug'}</button><span class="label">${label}</span></header>`;
    if (!K.on) {
      const sel = ui.pkSel || S.players.map((_, i) => i);
      return `<div class="wrap">${head('Poker')}
        <section><h1>Wie <em>pokert</em> er mee?</h1></section>
        <div class="chips">${S.players.map((p, i) => `<button class="chip ${sel.includes(i) ? 'on' : ''}" data-act="pkSel" data-v="${i}">${esc(p)}</button>`).join('')}</div>
        <div class="field"><label for="pkUnit">Buy-in per keer</label><div class="money"><span>€</span><input id="pkUnit" inputmode="decimal" value="${fmt(K.unit)}"></div></div>
        <p class="err" id="pkErr" style="min-height:0"></p>
        <button class="btn primary xl" data-act="pkStart" ${sel.length >= 2 ? '' : 'disabled'}>${sel.length >= 2 ? `Start poker · ${sel.length} spelers` : 'Kies minstens 2 spelers'} <span class="arr">→</span></button>
      </div>`;
    }
    const tin = K.who.reduce((t, i) => t + K.buyin[i], 0);
    if (K.step === 'buyin') {
      const rows = K.who.map((i) => `<div class="pkrow" style="--pc:var(--p${i})"><span class="who">${P(i)}<span class="meta">${Math.round(K.buyin[i] / K.unit)}× buy-in</span></span><span class="pkamt">${euro(K.buyin[i])}</span>
        <div class="pkctl"><button class="min" data-act="pkBuy" data-i="${i}" data-v="-1" ${K.buyin[i] <= K.unit ? 'disabled' : ''} aria-label="Buy-in minder voor ${P(i)}">−</button><button class="plus" data-act="pkBuy" data-i="${i}" data-v="1">+ buy-in</button></div></div>`).join('');
      return `<div class="wrap">${head('Poker · buy-ins')}
        <section><h1>Buy-<em>ins</em></h1><p class="lead">${euro(K.unit)} per keer</p></section>
        <section class="panel" style="gap:0;padding-block:6px">${rows}</section>
        ${ui.pkAdd ? pkAddHTML() : `<button class="btn ghost block" data-act="pkAddOpen" ${S.players.length >= 8 && K.who.length >= S.players.length ? 'disabled' : ''}>+ Speler erbij</button>`}
        <div class="totbar"><div><span class="label">Spelers</span><b>${K.who.length}</b></div><div style="text-align:right"><span class="label">In de pot</span><b>${euro(tin)}</b></div></div>
        <button class="btn primary xl" data-act="pkStep" data-v="buyout">Einde poker · buy-out <span class="arr">→</span></button>
        <button class="btn ghost block" data-act="pkCancel">${ui.pkSure ? 'Tik nog eens: poker wissen' : 'Poker wissen'}</button>
      </div>`;
    }
    if (K.step === 'buyout') {
      const tout = K.who.reduce((t, i) => t + (K.buyout[i] || 0), 0), all = K.who.every((i) => K.buyout[i] !== null && K.buyout[i] !== undefined);
      const rows = K.who.map((i) => `<div class="pkrow" style="--pc:var(--p${i})"><span class="who">${P(i)}<span class="meta">in ${euro(K.buyin[i])}</span></span>
        <div class="pkin"><span>€</span><input id="pko${i}" inputmode="decimal" placeholder="0,00" value="${K.buyout[i] === null || K.buyout[i] === undefined ? '' : fmt(K.buyout[i])}" aria-label="Buy-out van ${P(i)}"></div></div>`).join('');
      return `<div class="wrap">${head('Poker · buy-out')}
        <section><h1>Buy-<em>out</em></h1><p class="lead">Met hoeveel stopt iedereen?</p></section>
        <section class="panel" style="gap:0;padding-block:6px">${rows}</section>
        <div class="totbar" id="pkTot">${pkTotHTML()}</div>
        <button class="btn primary xl" data-act="pkStep" data-v="done" id="pkCalc" ${all ? '' : 'disabled'}>Bereken <span class="arr">→</span></button>
        <button class="btn ghost block" data-act="pkStep" data-v="buyin">← Buy-ins</button>
      </div>`;
    }
    // klaar: resultaat en wie wie betaalt (enkel poker)
    const net = pokerNet();
    const tout = K.who.reduce((t, i) => t + (K.buyout[i] || 0), 0), D = tout - tin;
    const rows = K.who.slice().sort((a, b) => net[b] - net[a]).map((i) => `<div class="srow" style="--pc:var(--p${i})"><span class="who">${P(i)}<span class="meta">in ${euro(K.buyin[i])} · uit ${euro(K.buyout[i] || 0)}</span></span><span class="pts ${pn(net[i])}">${net[i] > 0 ? '+' : net[i] < 0 ? '−' : ''}${euro(Math.abs(net[i])).replace('€ ', '€')}</span></div>`).join('');
    return `<div class="wrap">${head('Poker · resultaat')}
      <section><h1>Poker <em>klaar</em></h1></section>
      ${D ? `<div class="note">De pot klopt niet: ${euro(Math.abs(D))} ${D > 0 ? 'te veel' : 'te weinig'}. Dat verschil is gelijk over iedereen verdeeld.</div>` : ''}
      <section class="panel"><h2>Winst en verlies</h2><div>${rows}</div></section>
      <button class="btn primary xl" data-act="end">Afrekenen <span class="arr">→</span></button>

    return `<div class="sumline"><span class="label">Controle</span><span class="${ok ? 'ok' : 'bad'}">♥ ${hearts}/13 · ♠V ${R.q !== null ? P(R.q) : '?'}</span></div>`;

  // ---------- Statistieken: wie wint van wie ----------
  function statRounds() {
    const night = finished();
    return ui.statScope === 'all' ? [...(S.archive || []), ...night] : night;
  }
  function renderStats() {
    const rounds = statRounds();
    const all = ui.statScope === 'all';
    const tabs = `<div class="tabs" role="tablist"><button class="${all ? '' : 'on'}" data-act="statScope" data-v="night">Vanavond</button><button class="${all ? 'on' : ''}" data-act="statScope" data-v="all">Alle avonden</button></div>`;
    if (!rounds.length) {
      return `<section class="panel"><div class="panel-head"><h2>Wie wint van wie</h2>${tabs}</div><p class="empty">Nog geen rondjes uitgespeeld${all ? '' : ' vanavond'}.</p></section>`;
    }
    const n = S.players.length;
    const st = Logic.stats(rounds, n);
    const pct = (w, p) => (p ? Math.round((w / p) * 100) : 0);
    const order = S.players.map((_, i) => i).sort((a, b) => pct(st.per[b].won, st.per[b].played) - pct(st.per[a].won, st.per[a].played) || st.per[b].won - st.per[a].won);
    const per = order.map((i) => {
      const { won, played } = st.per[i];
      return `<div class="wrow" style="--pc:var(--p${i})"><span class="who">${P(i)}</span><span class="bar"><i style="width:${pct(won, played)}%"></i></span><span class="n"><b>${won}</b> van ${played}</span></div>`;
    }).join('');
    const short = (i) => esc(S.players[i].slice(0, 3));
    const head = S.players.map((_, j) => `<th scope="col" style="color:var(--p${j})">${short(j)}</th>`).join('');
    const body = S.players.map((_, i) => `<tr><th class="rowh" scope="row" style="color:var(--p${i})">${P(i)}</th>${S.players.map((_, j) => {
      if (i === j) return '<td class="self">·</td>';
      const v = st.vs[i][j];
      if (!v.won && !v.lost) return '<td class="self">–</td>';
      return `<td class="${v.won > v.lost ? 'up' : ''}"><span class="w">${v.won}</span><span class="l">–${v.lost}</span></td>`;
    }).join('')}</tr>`).join('');
    const duos = Object.entries(st.duos).map(([k, v]) => ({ ids: k.split('-').map(Number), ...v }))
      .sort((a, b) => b.won / b.played - a.won / a.played || b.played - a.played);
    const duoHtml = duos.map((d, i) => `<div class="duo ${i === 0 && d.won ? 'best' : ''}"><span class="nm">${d.ids.map(P).join(' &amp; ')}</span><span class="n"><b>${d.won}</b> van ${d.played} gewonnen</span></div>`).join('');
    return `<section class="panel"><div class="panel-head"><h2>Wie wint van wie</h2>${tabs}</div>
      <p class="sub">Gewonnen rondjes</p><div>${per}</div>
      <p class="sub">Onderling</p>
      <div class="h2h-wrap"><table class="h2h"><thead><tr><th></th>${head}</tr></thead><tbody>${body}</tbody></table></div>
      <p class="hint">Lees per rij: zoveel keer won die speler tegen de speler bovenaan, en zoveel keer verloor die.</p>
      <p class="sub">Duo's</p><div>${duoHtml}</div>
    </section>`;
  }

  const matchupTeams = (teams) => matchup({ teams });
  function matchup(r) {
    return `<div class="matchup">
      <div class="side t0"><span class="tl">${TEAM[0]}</span><span class="nm">${r.teams[0].map(P).join('<br>')}</span></div>
      <span class="vs">tegen</span>
      <div class="side t1"><span class="tl">${TEAM[1]}</span><span class="nm">${r.teams[1].map(P).join('<br>')}</span></div></div>`;
  }

  // ---------- Rekenmachine voor de prijs ----------
  const OPS = '+−×÷';
  const fmt = (c) => (c / 100).toFixed(2).replace('.', ',');
  const trimOp = (e) => e.replace(/[+−×÷,]+$/, '');
  const calcValue = () => Logic.calc(trimOp(ui.calc.expr));
  const KEY_LABEL = { 'C': 'Wissen', '⌫': 'Laatste teken weg', '÷': 'Delen', '×': 'Maal', '−': 'Min', '+': 'Plus', '=': 'Uitrekenen', ',': 'Komma' };

  function calcHTML() {
    const keys = [['C', 'fn'], ['⌫', 'fn'], ['÷', 'op'], ['×', 'op'],
      ['7'], ['8'], ['9'], ['−', 'op'],
      ['4'], ['5'], ['6'], ['+', 'op'],
      ['1'], ['2'], ['3'], ['=', 'eq'],
      ['0', 'zero'], [',']];
    return `<div class="calc"><div class="cdisp"><span class="cur">€</span><span class="expr" id="cexpr" aria-live="polite"></span></div>
      <div class="cres" id="cres"></div>
      <div class="keys">${keys.map(([k, cls]) => `<button type="button" class="key ${cls || ''}" data-act="key" data-k="${k}" aria-label="${KEY_LABEL[k] || k}">${k}</button>`).join('')}</div></div>`;
  }

  function pressKey(k) {
    let e = ui.calc.expr;
    const lastNum = (e.match(/[\d,]*$/) || [''])[0];
    const endsOp = e !== '' && OPS.includes(e.slice(-1));
    if (k === 'C') e = '';
    else if (k === '⌫') e = e.slice(0, -1);
    else if (k === '=') { const v = Logic.calc(trimOp(e)); if (v) e = fmt(v); }
    else if (OPS.includes(k)) {
      if (!e) return;
      if (endsOp) e = e.slice(0, -1) + k;
      else { if (e.endsWith(',')) e = e.slice(0, -1); e += k; }
    } else if (k === ',') {
      if (lastNum.includes(',')) return;
      e += lastNum ? ',' : '0,';
    } else {
      if (lastNum.includes(',') && lastNum.split(',')[1].length >= 2) return;
      if (lastNum === '0') e = e.slice(0, -1);
      if (e.length >= 40) return;
      e += k;
    }
    ui.calc.expr = e;
    updateCalc();
  }

  function updateCalc() {
    const ex = document.getElementById('cexpr');
    if (!ex) return;
    const e = ui.calc.expr;
    ex.classList.toggle('ph', !e);
    ex.classList.toggle('long', e.length > 8);
    ex.innerHTML = e ? esc(e).replace(/[+−×÷]/g, (m) => `<span class="op">${m}</span>`) : '0,00';
    const t = trimOp(e), v = Logic.calc(t), hasOp = /[+−×÷]/.test(t);
    const res = document.getElementById('cres');
    if (ui.calc.target === 'nprice') {
      res.innerHTML = !v ? `<span>${e && hasOp ? 'Dat geeft geen geldig bedrag.' : ''}</span>` : hasOp ? `<span>Totaal</span><b>${euro(v)}</b>` : '';
    } else if (!e) res.innerHTML = '<span>De twee verliezers delen het rondje.</span>';
    else if (!v) res.innerHTML = `<span>${hasOp ? 'Dat geeft geen geldig bedrag.' : ''}</span>`;
    else if (hasOp) res.innerHTML = `<span>Totaal ${euro(v)}</span><b>${euro(v / 2)} <span class="muted" style="font:500 12px var(--f-ui)">per verliezer</span></b>`;
    else res.innerHTML = `<span>Per verliezer</span><b>${euro(v / 2)}</b>`;
    document.querySelectorAll('.chip[data-v]').forEach((c) => c.classList.toggle('on', +c.dataset.v === v));
    ['priceErr', 'priceErr2'].forEach((id) => { const el = document.getElementById(id); if (el) el.textContent = ''; });
  }

  // Ook typen met een toetsenbord (laptop)
  document.addEventListener('keydown', (ev) => {
    if (!document.getElementById('cexpr')) return;
    if (ev.target && ev.target.tagName === 'INPUT') return;
    const map = { '.': ',', ',': ',', '+': '+', '-': '−', '*': '×', 'x': '×', '/': '÷', 'Backspace': '⌫', 'Delete': 'C', 'Escape': 'C', '=': '=' };
    let k = /^\d$/.test(ev.key) ? ev.key : map[ev.key];
    if (ev.key === 'Enter') { ev.preventDefault(); const f = document.querySelector('#editPriceForm, #priceForm, #nPriceForm'); if (f) f.requestSubmit(); return; }
    if (!k) return;
    ev.preventDefault();
    pressKey(k);
    const b = document.querySelector(`.key[data-k="${k}"]`);
    if (b) { b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 120); }
  });

  function renderPrice() {
    const r = current();
    const last = S.lastPrice;
    if (ui.calc.target !== 'price') ui.calc = { expr: last ? fmt(last) : '', target: 'price' };
    return `<div class="wrap">
      <header class="top"><button class="btn ghost sm" data-act="cancelRound">← Annuleer</button><span class="label">Rondje ${S.rounds.length}</span></header>
      <section><h1>Wat kost <em>het rondje</em>?</h1></section>
      ${matchup(r)}
      <form id="priceForm" class="steps" autocomplete="off">
        ${calcHTML()}
        ${last ? `<div><button type="button" class="chip" data-act="setprice" data-v="${last}">Zelfde als vorige · ${euro(last)}</button></div>` : ''}
        <p class="err" id="priceErr" style="min-height:0"></p>
        <button class="btn primary xl" type="submit">Start het rondje <span class="arr">→</span></button>
      </form>
    </div>`;
  }

  function renderGame() {
    const r = current();
    const rep = Logic.replay(r.hands);
    const sc = rep.score;
    const pk = ui.pick;
    const flash = ui.flash; ui.flash = null;
    const board = (t) => {
      const prev = flash ? sc[t] - flash[t] : sc[t];
      const hot = sc[t] > 0 && sc[t] <= 2;
      return `<div class="board t${t} ${pk.playing === t ? 'sel' : ''} ${flash && flash[t] ? 'bump' : ''} ${hot ? 'hot' : ''}">
        <div><span class="tl">${TEAM[t]}</span>${hot ? '<span class="hotb">bijna</span>' : ''}<div class="bnames">${tName(r, t)}</div></div>
        <div class="bbody">${boom(sc[t], prev)}<div class="num ${sc[t] === 0 ? 'zero' : ''}" aria-label="${sc[t]} streepjes over">${sc[t]}</div></div>
        ${flash && flash[t] ? `<span class="delta">${sign(flash[t])}</span>` : ''}</div>`;
    };

    let res;
    if (pk.card && pk.playing !== null) {
      res = RESULTS.map(([v, label]) => `<button class="opt res ${v === 'lose' ? 'lose' : ''}" data-act="result" data-v="${v}"><span class="big">${label}</span></button>`).join('');
    } else {
      res = RESULTS.map(([v, label]) => `<button class="opt res ${v === 'lose' ? 'lose' : ''}" disabled><span class="big">${label}</span></button>`).join('');
    }

    const hist = rep.steps.map((st, i) => {
      const h = st.hand;
      return `<div class="hrow"><span class="n">${i + 1}</span><span>${h.card === 1 ? '1ste' : '2de'} kaart · <span class="t${h.playing} tc">${TEAM[h.playing]}</span> speelt · ${RESULT_LABEL[h.result].toLowerCase()}</span>
        <span class="sc"><span class="t0 tc">${st.after[0]}</span><span class="sep">/</span><span class="t1 tc">${st.after[1]}</span></span></div>`;
    }).reverse().join('');

    return `<div class="wrap">
      <header class="roundbar"><span class="label">Rondje ${S.rounds.length}</span>
        <div style="display:flex;gap:8px;align-items:center"><button class="pricechip" data-act="editPrice" aria-label="Prijs aanpassen">${priceTxt(r.price)}</button><button class="btn ghost sm" data-act="menu" aria-label="Meer opties">Meer</button></div></header>
      <div class="boards">${board(0)}${board(1)}</div>
      <section class="steps">
        <div class="step"><div class="slabel"><span class="no">1</span><span class="label">Welke kaart?</span></div>
          <div class="seg">
            <button class="opt ${pk.card === 1 ? 'on' : ''}" data-act="card" data-v="1"><span class="big">1ste kaart</span><small>−1, of −2 als zij geen slag halen</small></button>
            <button class="opt ${pk.card === 2 ? 'on' : ''}" data-act="card" data-v="2"><span class="big">2de kaart</span><small>−2, of −3 als zij geen slag halen</small></button>
          </div></div>
        <div class="step ${pk.card ? '' : 'wait'}"><div class="slabel"><span class="no">2</span><span class="label">Wie speelt?</span></div>
          <div class="seg">
            ${[0, 1].map((t) => `<button class="opt team t${t} ${pk.playing === t ? 'on' : ''}" data-act="playing" data-v="${t}"><span class="tl">${TEAM[t]}</span><span class="big">${tName(r, t)}</span></button>`).join('')}
          </div></div>
        <div class="step ${pk.card && pk.playing !== null ? '' : 'wait'}" id="step3"><div class="slabel"><span class="no">3</span><span class="label">Resultaat</span></div><div class="stack">${res}</div></div>
      </section>
      ${rep.steps.length ? `<section class="panel"><div class="panel-head"><h2>Gespeeld</h2><button class="btn soft sm" data-act="undo">Laatste ongedaan</button></div><div>${hist}</div></section>` : ''}
    </div>${dock()}`;
  }

  function renderEnd() {
    const A = owedAll();
    const done = { length: A.n };
    const open = openAny();
    const { owed } = A;
    const parts = A.parts.filter((p) => p[1]);
    const pk = pokerNet();
    if (pk) parts.push(['Poker', 0, 0]);
    const pkOpen = S.pk.on && S.pk.step !== 'done';
    const payerBtns = S.players.map((p, i) => `<button class="payer ${ui.payer === i ? 'on' : ''}" data-act="payer" data-v="${i}"><span class="nm">${esc(p)}</span><small>aandeel ${euro(owed[i])}</small></button>`).join('');
    return `<div class="wrap">
      <header class="top"><button class="btn ghost sm" data-act="home">← Terug</button><span class="label">Einde avond</span></header>
      <section>${!done.length && pk ? '<h1>Poker <em>afrekenen</em></h1>' : `<p class="label">${done.length} rondje${done.length === 1 ? '' : 's'} gespeeld</p><h1>Wie heeft de <em>rekening</em> betaald?</h1>`}
        ${parts.length && done.length ? `<p class="lead">${parts.map((p) => (p[0] === 'Poker' ? 'Poker: zit mee in de afrekening' : `${p[0]}: ${p[1]} rondje${p[1] > 1 ? 's' : ''} · ${euro(p[2])}`)).join('<br>')}</p>` : ''}</section>
      ${open ? `<div class="note">Een rondje dat nog bezig is, telt niet mee.</div>` : ''}
      ${pkOpen ? `<div class="note">De poker is nog niet afgerekend en telt niet mee. Vul eerst de buy-outs in.</div>` : ''}
      ${!done.length && pk ? `<div id="settle">${renderSettle()}</div>` : ''}
      ${done.length ? `<div class="payers">${payerBtns}</div>
      <div class="field"><label for="bill">Wat stond er op de rekening?</label>
        <input class="input" id="bill" inputmode="decimal" placeholder="${fmt(roundsTotal())}" value="${esc(ui.bill)}" style="font:600 22px var(--f-serif);font-variant-numeric:lining-nums">
        <p class="bill-hint" id="billHint">${billHint()}</p></div>
      <div id="settle">${renderSettle()}</div>` : pk ? '' : `<p class="empty">Nog geen rondjes uitgespeeld, dus niemand moet iets.</p>`}
      <button class="btn soft block" data-act="saveNight">${S.savedAt ? `Opnieuw bewaren <span class="muted">· bewaard om ${hhmm(S.savedAt)}</span>` : 'Bewaren in geschiedenis'}</button>
      <button class="btn ghost block" data-act="askReset">Nieuwe avond starten</button>
    </div>`;
  }

  const roundsTotal = () => owedAll().total;
  const billValue = () => Logic.parsePrice(ui.bill); // null = leeg of ongeldig
  const signedEuro = (c) => (c > 0 ? '+ ' : c < 0 ? '− ' : '') + euro(Math.abs(c));

  function billHint() {
    const rt = roundsTotal();
    if (!ui.bill.trim()) return `Leeg laten als het precies de rondjes waren: <b>${euro(rt)}</b>.`;
    const b = billValue();
    if (!b) return 'Geef een bedrag in, bijvoorbeeld 52,40.';
    const diff = b - rt, n = S.players.length;
    if (!diff) return `Precies wat de rondjes kostten.`;
    return `${euro(Math.abs(diff))} ${diff > 0 ? 'meer' : 'minder'} dan de rondjes (${euro(rt)}): iedereen betaalt <b>${euro(Math.abs(diff) / n)} ${diff > 0 ? 'meer' : 'minder'}</b>.`;
  }

  function renderSettle() {
    const onlyPoker = !owedAll().n && pokerNet();
    if (ui.payer === null && !onlyPoker) return `<p class="empty">Kies hierboven wie betaald heeft.</p>`;
    if (onlyPoker && ui.payer === null) ui.payer = 0;
    const r = settleAll(ui.payer, onlyPoker ? 0 : billValue());
    const n = S.players.length;
    const trs = r.transfers.map((t) => `<div class="tr"><div class="who"><span>${P(t.from)}</span><span class="arrow">schrijft over naar ${P(t.to)}</span></div><div class="amt">${euro(t.amount)}</div></div>`).join('');
    return `<section class="panel">
      ${onlyPoker ? '<h2>Wie betaalt wie</h2>' : `<div class="total"><span class="label">${P(ui.payer)} betaalde</span><b>${euro(r.total)}</b></div>`}
      ${r.poker && !onlyPoker ? `<div class="breakdown"><span>Pokerwinst en -verlies</span><span>zit mee in de bedragen</span></div>` : ''}
      ${r.diff ? `<div class="breakdown"><span>Rondjes</span><span>${euro(r.rounds)}</span><span>Verschil met de rekening</span><span>${signedEuro(r.diff)}</span><span>Per persoon</span><span>${signedEuro(r.diff / n)}</span></div>` : ''}
      <hr class="rule">
      ${r.transfers.length ? `<div>${trs}</div>` : `<p class="empty">Niemand moet iets overschrijven.</p>`}
      <p class="muted" style="margin:0;font-size:12.5px">${onlyPoker ? 'Zo weinig mogelijk overschrijvingen.' : r.poker ? 'Zo weinig mogelijk overschrijvingen voor de rondjes en de poker samen.' : (() => {
        const inc = r.transfers.reduce((t, x) => t + (x.to === ui.payer ? x.amount : -x.amount), 0);
        const own = r.total - inc;
        return own < 0
          ? `${P(ui.payer)} krijgt in totaal ${euro(inc)} binnen, ${euro(-own)} meer dan de rekening.`
          : `${P(ui.payer)} krijgt ${euro(inc)} binnen en betaalt zelf ${euro(own)} van de rekening.`;
      })()}</p>
      <div class="row2"><button class="btn primary" data-act="share">Delen</button><button class="btn ghost" data-act="copy">Kopiëren</button></div>
      <p class="muted" id="copyMsg" style="margin:0;font-size:13px;text-align:center"></p>
    </section>`;
  }

  // Afrekening als afbeelding (voor Snapchat, WhatsApp, ...)
  async function settleImage() {
    const r = settleAll(ui.payer, billValue());
    const W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const x = cv.getContext('2d');
    try { await document.fonts.ready; } catch (e) {}
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0b1230'); g.addColorStop(1, '#060914'); x.fillStyle = g; x.fillRect(0, 0, W, H);
    [['rgba(94,240,192,.45)', 260, 160], ['rgba(182,140,255,.40)', 820, 220], ['rgba(79,216,255,.30)', 540, 420]].forEach(([c, cx, cy]) => {
      const rg = x.createRadialGradient(cx, cy, 0, cx, cy, 520); rg.addColorStop(0, c); rg.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = rg; x.fillRect(0, 0, W, H);
    });
    const serif = '"Cormorant Garamond", Georgia, serif', sans = 'Manrope, system-ui, sans-serif';
    x.fillStyle = '#eaf2ff'; x.font = `italic 600 92px ${serif}`; x.fillText('Spelletjes', 80, 190);
    x.fillStyle = '#8a95b8'; x.font = `600 30px ${sans}`; x.fillText(today().toUpperCase(), 84, 250);
    x.fillStyle = '#eaf2ff'; x.font = `600 46px ${serif}`; x.fillText(r.total ? `${S.players[ui.payer]} betaalde ${euro(r.total)}${r.poker ? ' · met poker' : ''}` : 'Poker: wie betaalt wie', 80, 360);
    let y = 470;
    const rows = r.transfers.length ? r.transfers : [];
    rows.slice(0, 7).forEach((t) => {
      x.fillStyle = 'rgba(255,255,255,.06)'; x.beginPath(); if (x.roundRect) x.roundRect(60, y - 70, W - 120, 110, 26); else x.rect(60, y - 70, W - 120, 110); x.fill();
      x.fillStyle = '#eaf2ff'; x.font = `600 50px ${serif}`; x.fillText(S.players[t.from], 100, y);
      const wFrom = x.measureText(S.players[t.from]).width;
      x.fillStyle = '#5ef0c0'; x.font = `italic 500 34px ${serif}`; x.fillText(`  → ${S.players[t.to]}`, 100 + wFrom, y);
      x.fillStyle = '#eaf2ff'; x.font = `700 44px ${sans}`; const a = euro(t.amount); x.fillText(a, W - 100 - x.measureText(a).width, y);
      y += 135;
    });
    if (!rows.length) { x.fillStyle = '#8a95b8'; x.font = `500 40px ${sans}`; x.fillText('Niemand moet iets overschrijven.', 80, y); }
    x.fillStyle = '#8a95b8'; x.font = `500 28px ${sans}`; x.fillText(`${owedAll().n} rondjes · ${euro(r.rounds)}`, 80, H - 80);
    return new Promise((res) => cv.toBlob(res, 'image/png'));
  }

  function settleText() {
    const r = settleAll(ui.payer, billValue());
    const lines = [`Spelletjes: afrekening (${owedAll().n} rondjes${r.poker ? ' + poker' : ''})`, r.total ? `${S.players[ui.payer]} betaalde ${euro(r.total)}` : 'Poker'];
    if (r.diff) lines.push(`Rondjes ${euro(r.rounds)}, verschil ${signedEuro(r.diff)} gedeeld door ${S.players.length}`);
    lines.push('');
    r.transfers.forEach((t) => lines.push(`${S.players[t.from]} → ${S.players[t.to]}: ${euro(t.amount)}`));
    if (!r.transfers.length) lines.push('Niemand moet iets overschrijven.');
    return lines.join('\n');
  }

  // ---------- Modals ----------
  function renderModal() {

        <button class="btn primary xl" data-act="newRondje">Nieuw rondje <span class="arr">→</span></button>

        <p class="err" id="priceErr2"></p><div class="row2"><button type="button" class="btn ghost" data-act="close">Annuleer</button><button class="btn primary" type="submit">Bewaar</button></div></form>`;
    } else if (m === 'menu') {
      body = `<h2>Rondje ${S.rounds.length}</h2>

    } else if (m === 'askCancel') {

        <div class="row2"><button class="btn ghost" data-act="close">Nee</button><button class="btn danger" data-act="cancelRound">Ja, stoppen</button></div>`;

  function render() {
    const v = view();
    ui.view = ['draw', 'end', 'wround', 'hround', 'pround', 'start', 'nprice', 'npick', 'npct', 'hist', 'poker'].includes(v) ? v : null;
    const screens = { hub: renderHub, draw: renderDraw, price: renderPrice, game: renderGame, end: renderEnd, start: renderStart, nprice: renderNPrice, npick: renderPick, npct: renderNPct, wgame: renderWGame, wround: renderWRound, hgame: renderHGame, hround: renderHRound, pgame: renderPGame, pround: renderPRound, ngame: renderNGame, lgame: renderLGame, hist: renderHist, dgame: renderDGame, poker: renderPoker };
    const same = v === lastScreen, before = same ? numSnap() : null;
    $app.innerHTML = screens[v]();
    $app.classList.toggle('fresh', !same);
    if (!same) { clearTimeout(freshT); freshT = setTimeout(() => $app.classList.remove('fresh'), 900); }
    lastScreen = v;
    renderModal();
    updateCalc();
    if (before) numLive(before);
    if (partyDue) { partyDue = false; setTimeout(party, 120); }
  }
  let lastScreen = null, freshT = 0, partyDue = false;
  const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Alle losse getallen op het scherm, met hun plaats in de pagina als sleutel
  const NUM_RE = /^[−\-+]?\s*(€\s*)?\d[\d.,]*$/;
  const numVal = (t) => { const neg = /^[−-]/.test(t); const v = parseFloat(t.replace(/[^\d,.]/g, '').replace(/\./g, '').replace(',', '.')); return isNaN(v) ? null : (neg ? -v : v); };
  function numEls() {
    const out = [];
    $app.querySelectorAll('.wrap *').forEach((el) => {
      if (el.children.length || el.closest('button.key, .calc, input, .keys, h1, h2, header, .label, section > p')) return;
      const t = el.textContent.trim();
      if (t.length && t.length < 14 && NUM_RE.test(t)) out.push(el);
    });
    return out;
  }
  const numKey = (el) => { let k = '', e = el; while (e && e !== $app) { k = [...e.parentNode.children].indexOf(e) + '/' + k; e = e.parentNode; } return k; };
  function numSnap() { const m = new Map(); numEls().forEach((el) => m.set(numKey(el), el.textContent.trim())); return m; }
  function numLive(before) {
    if (calm()) return;
    let shown = 0;
    numEls().forEach((el) => {
      const k = numKey(el), old = before.get(k), now = el.textContent.trim();
      if (old === undefined || old === now) return;
      el.classList.add('tick');
      const a = numVal(old), b = numVal(now);
      if (a === null || b === null || shown >= 3) return;
      const d = Math.round((b - a) * 100) / 100; if (!d) return;
      shown++;
      const r = el.getBoundingClientRect(), f = document.createElement('div');
      f.className = 'floatd ' + (d > 0 ? 'up' : 'down');
      f.textContent = (d > 0 ? '+' : '−') + (now.includes('€') ? euro(Math.abs(d)) : String(Math.abs(d)).replace('.', ','));
      f.style.left = r.left + r.width / 2 + 'px'; f.style.top = r.top - 6 + 'px';
      document.body.appendChild(f); setTimeout(() => f.remove(), 1200);
    });
  }
  // Feestregen over het hele scherm
  function party() {
    if (calm() || document.getElementById('party')) return;
    const cv = document.createElement('canvas'); cv.id = 'party'; document.body.appendChild(cv);
    const W = innerWidth, H = innerHeight, dpr = devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr;
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    const css = getComputedStyle(document.documentElement);
    const cols = ['--t1', '--t2', '--gold', '--p0', '--p3', '--p5', '--p6'].map((x) => css.getPropertyValue(x).trim());
    const bits = Array.from({ length: 140 }, (_, i) => { const left = i % 2 === 0; return {
      x: left ? -10 : W + 10, y: H * (0.55 + Math.random() * 0.3), vx: (left ? 1 : -1) * (4 + Math.random() * 7), vy: -9 - Math.random() * 8,
      r: Math.random() * 6.3, vr: (Math.random() - 0.5) * 0.35, w: 5 + Math.random() * 6, h: 3 + Math.random() * 3, c: cols[(Math.random() * cols.length) | 0], o: Math.random() < 0.3 }; });
    const t0 = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, W, H);
      bits.forEach((b) => {
        b.vy += 0.22; b.vx *= 0.985; b.x += b.vx; b.y += b.vy; b.r += b.vr;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c;
        if (b.o) { ctx.beginPath(); ctx.arc(0, 0, b.h, 0, 7); ctx.fill(); } else ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.restore();
      });
      if (t - t0 < 3200) requestAnimationFrame(frame); else cv.remove();
    })(t0);
    if (navigator.vibrate) try { navigator.vibrate([18, 40, 18]); } catch (e) {}
  }
  // Rimpel waar je tikt
  document.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.btn, .key, .chip, .opt, .tile, .payer');
    if (!el || el.disabled || calm()) return;

    s.className = 'ripple'; s.style.left = e.clientX - r.left + 'px'; s.style.top = e.clientY - r.top + 'px';

  // Live klok op het overzicht

  // ---------- Boeren trekken: de deler legt kaart per kaart open ----------
  const wait = (ms) => new Promise((res) => setTimeout(res, ms));
  async function runDraw() {
    const token = {}; ui.draw.token = token;
    const alive = () => ui.draw && ui.draw.token === token && ui.view === 'draw';
    const stage = document.getElementById('stage');
    if (!stage) return;
    const deck = document.getElementById('deck');
    const msg = document.getElementById('dealmsg');
    const { deal, teams } = ui.draw;
    const rel = (el) => { const a = el.getBoundingClientRect(), b = stage.getBoundingClientRect(); return { x: a.left - b.left, y: a.top - b.top }; };
    const deckPos = rel(deck);
    const jacks = [];
    let z = 6;

    const place = (step, instant) => {
      const { player, card } = step;
      const el = document.createElement('div');
      el.className = 'dcard' + (instant ? ' instant flipped' : '');
      el.innerHTML = `<div class="inner"><div class="back"></div>${cardFace(card)}</div>`;
      el.style.left = deckPos.x + 'px'; el.style.top = deckPos.y + 'px'; el.style.zIndex = z++;
      stage.appendChild(el);
      const p = rel(document.getElementById('pile' + player));
      const tilt = (Math.random() - 0.5) * 10, dx = (Math.random() - 0.5) * 6, dy = (Math.random() - 0.5) * 6;
      const go = () => { el.style.left = p.x + dx + 'px'; el.style.top = p.y + dy + 'px'; el.style.transform = `rotate(${tilt}deg)`; };
      if (instant) go(); else { void el.offsetWidth; go(); setTimeout(() => el.classList.add('flipped'), 160); }
      if (card.r === 'J') {
        jacks.push(player);
        el.classList.add('isjack');
        document.getElementById('seat' + player).classList.add('jack');
      }
      return el;
    };
    const name = (i) => `<b>${P(i)}</b>`;
    const finish = (instant) => {
      if (instant) {
        stage.querySelectorAll('.dcard').forEach((c) => c.remove());
        jacks.length = 0;
        // per speler alleen de laatste kaart tonen (de rest ligt eronder)
        const lastOf = {};
        deal.forEach((s) => { lastOf[s.player] = s; });
        Object.values(lastOf).forEach((s) => place(s, true));
      }
      deck.classList.add('empty');
      const tag = stage.querySelector('.dealer-tag'); if (tag) tag.hidden = true;
      teams.forEach((t, ti) => t.forEach((p) => document.getElementById('seat' + p).classList.add('t' + ti)));
      msg.innerHTML = `${name(teams[0][0])} en ${name(teams[0][1])} spelen samen`;
      document.getElementById('skipHint').hidden = true;
      document.getElementById('drawTeams').innerHTML = matchupTeams(teams);
      const acts = document.getElementById('drawActions'); acts.hidden = false;
      setTimeout(() => acts.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 400);
    };
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { finish(true); return; }

    await wait(500);
    msg.innerHTML = `${name(ui.draw.dealer)} deelt…`;
    for (let i = 0; i < deal.length; i++) {
      if (!alive() || ui.draw.skip) break;
      const step = deal[i];
      const last = i === deal.length - 1;
      place(step);
      if (step.card.r === 'J') {
        if (navigator.vibrate) try { navigator.vibrate(20); } catch (e) {}
        msg.innerHTML = jacks.length === 1
          ? `${name(step.player)} heeft de eerste boer. Wie krijgt de tweede?`
          : `${name(step.player)} heeft de tweede boer!`;
        await wait(last ? 1300 : 1500);
      } else {
        // na de eerste boer gaat het trager: spanning
        await wait(jacks.length ? 720 : 440);
      }
    }
    if (!alive()) return;
    finish(ui.draw.skip);
  }

  };
  let pending = false, bar = null;
  function showBar() {
    if (bar) return;
    bar = document.createElement('div');
    bar.className = 'toast'; bar.style.bottom = 'calc(16px + env(safe-area-inset-bottom, 0px))'; bar.style.zIndex = 30;
    bar.innerHTML = '<span class="tx"><b>Nieuwe versie klaar</b> · laadt zodra je klaar bent</span><button class="btn soft sm" type="button">Nu laden</button>';
    bar.querySelector('button').onclick = () => location.reload();
    document.body.appendChild(bar);
  }
  async function check() {
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      const { v } = await r.json();
      if (v && v !== APP_VERSION) pending = true;
    } catch (e) {}
    if (pending) { if (safe()) location.reload(); else showBar(); }
  }
  // Ook herladen zodra je terugkeert naar een rustig scherm.
  document.addEventListener('click', () => { if (pending && safe()) setTimeout(() => { if (safe()) location.reload(); }, 400); }, true);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
  setInterval(check, 20000);
  setTimeout(check, 1500);
})();

</script>
</body></html>
