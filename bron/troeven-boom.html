<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Spelletjes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#060914">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: één kolom (max 460px), aurora: poolnacht-blauw met noorderlicht in mint, cyaan en violet. Serif voor cijfers en namen, Manrope voor bediening. Vaste dock onderaan. */
:root {
  --bg: #060914;
  --surface: rgba(17, 24, 52, 0.78);
  --surface-2: #19224a;
  --hair: rgba(190, 215, 255, 0.11);
  --hair-2: rgba(190, 215, 255, 0.22);
  --ivory: #eaf2ff;
  --dim: #8a95b8;
  --gold: #5ef0c0;
  --gold-soft: rgba(94, 240, 192, 0.12);
  --ink: #031510;
  --t1: #b68cff;
  --t1-bg: rgba(182, 140, 255, 0.13);
  --t2: #4fd8ff;
  --t2-bg: rgba(79, 216, 255, 0.11);
  --danger: #ff6b8a;
  --p0: #ffd166;
  --p1: #b68cff;
  --p2: #5ef0c0;
  --p3: #ff86c0;
  --p4: #7fe0ff;
  --p5: #ffa46b;
  --p6: #c6f36b;
  --p7: #f28bff;
  --f-serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-ui: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.22, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 70% at 50% 110%, #0d1433 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--ivory);
  font: 15px/1.5 var(--f-ui);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: lining-nums;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

/* Noorderlicht: drie trage gordijnen achter alles, plus een paar sterren */
.aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; left: -30%; width: 160%; height: 60%; border-radius: 50%; mix-blend-mode: screen; opacity: .55; will-change: transform; }
.aurora i:nth-child(1) { top: -22%; background: radial-gradient(50% 40% at 50% 60%, rgba(94,240,192,.55), transparent 70%); animation: veil1 22s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { top: -10%; background: radial-gradient(40% 35% at 35% 55%, rgba(79,216,255,.45), transparent 70%); animation: veil2 28s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { top: 2%; background: radial-gradient(38% 30% at 70% 45%, rgba(182,140,255,.42), transparent 70%); animation: veil3 34s ease-in-out infinite alternate; }
.aurora::after { content: ""; position: absolute; inset: 0; opacity: .5; animation: twinkle 5s ease-in-out infinite alternate;
  background-image: radial-gradient(1px 1px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 78% 9%, #fff, transparent), radial-gradient(1.5px 1.5px at 64% 31%, #cfe6ff, transparent), radial-gradient(1px 1px at 33% 42%, #fff, transparent), radial-gradient(1px 1px at 88% 55%, #cfe6ff, transparent), radial-gradient(1px 1px at 22% 71%, #fff, transparent), radial-gradient(1.5px 1.5px at 51% 86%, #fff, transparent); }
@keyframes twinkle { from { opacity: .3; } to { opacity: .8; } }
.aurora b { position: absolute; top: 12%; left: 70%; width: 120px; height: 1.5px; border-radius: 2px; background: linear-gradient(90deg, rgba(255,255,255,.9), transparent); transform: rotate(-24deg); opacity: 0; animation: shoot 11s linear infinite 3s; }
.aurora b:nth-of-type(2) { top: 34%; left: 40%; animation-duration: 17s; animation-delay: 9s; }
@keyframes shoot { 0% { opacity: 0; transform: rotate(-24deg) translateX(0); } 1% { opacity: 1; } 6% { opacity: 0; transform: rotate(-24deg) translateX(-260px); } 100% { opacity: 0; transform: rotate(-24deg) translateX(-260px); } }
@keyframes veil1 { from { transform: translate(-6%, 0) skewX(-8deg) scaleY(.9); } to { transform: translate(8%, 4%) skewX(10deg) scaleY(1.15); } }
@keyframes veil2 { from { transform: translate(10%, 2%) skewX(12deg); } to { transform: translate(-8%, -3%) skewX(-6deg) scaleY(1.2); } }
@keyframes veil3 { from { transform: translate(-4%, 6%) skewX(-12deg) scaleY(1.1); } to { transform: translate(6%, -2%) skewX(8deg) scaleY(.85); } }
.panel, .board, .opt, .gcard, .matchup, .payer, .key, .sheet { backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 3px; }

.wrap {
  max-width: 460px; margin: 0 auto;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(100px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
.fresh .wrap > * { animation: rise .55s var(--ease) both; }
.fresh .wrap > *:nth-child(2) { animation-delay: .04s; } .fresh .wrap > *:nth-child(3) { animation-delay: .08s; }
.fresh .wrap > *:nth-child(4) { animation-delay: .12s; } .fresh .wrap > *:nth-child(5) { animation-delay: .16s; }
.fresh .wrap > *:nth-child(n+6) { animation-delay: .2s; }
.fresh .tiles > * { animation: pop .5s var(--ease) both; }
.fresh .tiles > *:nth-child(2) { animation-delay: .05s; } .fresh .tiles > *:nth-child(3) { animation-delay: .1s; } .fresh .tiles > *:nth-child(4) { animation-delay: .15s; }
.fresh .tiles > *:nth-child(5) { animation-delay: .2s; } .fresh .tiles > *:nth-child(6) { animation-delay: .25s; } .fresh .tiles > *:nth-child(n+7) { animation-delay: .3s; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.92); } }

/* Levende cijfers: een score die verandert, springt even op en laat zien hoeveel erbij of eraf ging */
.tick { animation: tick .5s var(--ease); display: inline-block; }
@keyframes tick { 0% { transform: scale(1); } 35% { transform: scale(1.28); color: var(--tk, var(--gold)); text-shadow: 0 0 18px var(--tk, var(--gold)); } 100% { transform: scale(1); } }
.floatd { position: fixed; z-index: 60; pointer-events: none; font: 700 15px/1 var(--f-ui); padding: 4px 8px; border-radius: 999px; background: rgba(6,9,20,.75); border: 1px solid currentColor; transform: translate(-50%, 0); animation: floatd 1.1s var(--ease) forwards; }
.floatd.up { color: var(--gold); } .floatd.down { color: var(--danger); }
@keyframes floatd { 0% { opacity: 0; transform: translate(-50%, 4px) scale(.8); } 20% { opacity: 1; transform: translate(-50%, -8px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -38px); } }

/* Druk-effect: een lichte golf waar je tikt */
.btn, .key, .chip, .opt, .tile, .payer { position: relative; overflow: hidden; }
.ripple { position: absolute; border-radius: 50%; pointer-events: none; width: 12px; height: 12px; margin: -6px 0 0 -6px; background: rgba(255,255,255,.45); animation: ripple .6s ease-out forwards; }
@keyframes ripple { to { transform: scale(28); opacity: 0; } }

/* Spelkeuze: tegels ademen zacht en glanzen bij het aanraken */
.tiles .tile:not(.off):not(.soon) .tart { animation: bob 4.5s ease-in-out infinite; }
.tiles .tile:nth-child(2n) .tart { animation-delay: -1.5s; } .tiles .tile:nth-child(3n) .tart { animation-delay: -3s; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(-2deg); } }
.tile { transition: transform .18s var(--ease), box-shadow .25s ease; }
.tile:not(.off):active { transform: scale(.95) rotate(-1deg); }

/* Feestregen over het hele scherm als een spel gedaan is */
#party { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; }

/* Live klok van de avond */
.live { display: inline-flex; align-items: center; gap: 7px; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 0 var(--gold); animation: livedot 1.8s ease-out infinite; }
@keyframes livedot { 0% { box-shadow: 0 0 0 0 rgba(94,240,192,.6); } 100% { box-shadow: 0 0 0 9px rgba(94,240,192,0); } }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.brand { font: italic 600 26px/1 var(--f-serif); letter-spacing: 0.01em; }
.brand small { font: 600 10px/1 var(--f-ui); font-style: normal; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); margin-left: 8px; vertical-align: 4px; }
.label { margin: 0; font: 600 10.5px/1.3 var(--f-ui); letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }
h1 { margin: 6px 0 0; font: 600 40px/1.02 var(--f-serif); letter-spacing: -0.01em; text-wrap: balance; }
h1 .of { font: 500 22px var(--f-serif); color: var(--dim); -webkit-text-fill-color: currentColor; }
h1 em { font-style: italic; font-weight: 500; color: var(--gold); background: linear-gradient(90deg, var(--t1), var(--gold) 50%, var(--t2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; padding-right: .08em; }
h2 { margin: 0; font: 600 22px/1.15 var(--f-serif); }
.lead { margin: 10px 0 0; color: var(--dim); max-width: 40ch; font-size: 14.5px; }
.muted { color: var(--dim); }
.rule { height: 1px; background: linear-gradient(90deg, transparent, var(--hair-2), transparent); border: 0; margin: 0; }

/* Knoppen */
.btn {
  border: 0; border-radius: 12px; min-height: 52px; padding: 12px 20px;
  font: 600 15px/1.1 var(--f-ui); letter-spacing: 0.02em;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform .15s var(--ease), background .2s ease, border-color .2s ease, opacity .2s ease;
}
.btn:active { transform: scale(0.98); }
.btn.primary.xl { position: relative; overflow: hidden; }
.btn.primary.xl::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%); transform: translateX(-120%); animation: shine 3.6s ease-in-out infinite; pointer-events: none; }
@keyframes shine { 0%, 55% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
.btn.primary { background: linear-gradient(115deg, #6ff5c6, #4fd8ff 55%, #a98bff); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 30px -12px rgba(94,240,192,.55); }
.btn.ghost { background: transparent; color: var(--ivory); border: 1px solid var(--hair-2); }
.btn.soft { background: var(--surface-2); color: var(--ivory); border: 1px solid var(--hair); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid rgba(255,107,138,.45); }
.btn.xl { min-height: 58px; font-size: 16px; width: 100%; }
.btn.block { width: 100%; }
.btn.sm { white-space: nowrap; min-height: 36px; padding: 8px 14px; font-size: 13px; border-radius: 10px; }
.btn .arr { font-family: var(--f-serif); font-size: 20px; line-height: 0; transform: translateY(-1px); }
.link { background: none; border: 0; padding: 4px 0; color: var(--dim); text-decoration: underline; text-decoration-color: var(--hair-2); text-underline-offset: 4px; font-size: 13px; }

.panel { background: var(--surface); border: 1px solid var(--hair); box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 18px 40px -28px rgba(0,0,0,.8); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }

/* Stand per speler */
.srow { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--hair); }
.srow:last-child { border-bottom: 0; padding-bottom: 2px; }
.srow .who::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--pc); margin-right: 10px; vertical-align: 3px; box-shadow: 0 0 10px var(--pc); }
.srow .who { font: 600 21px/1.1 var(--f-serif); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .wl { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; letter-spacing: .04em; }
.srow .owe { font: 600 15px var(--f-ui); font-variant-numeric: tabular-nums; min-width: 74px; text-align: right; }
.srow .owe.zero { color: var(--dim); font-weight: 400; }

.rround { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.rround:last-child { border-bottom: 0; padding-bottom: 0; }
.rround .no { font: italic 600 22px/1 var(--f-serif); color: var(--gold); }
.rround .txt { min-width: 0; font-size: 13.5px; line-height: 1.45; }
.rround .amt { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; font-size: 14px; }
.rround .amt small { display: block; font-weight: 400; color: var(--dim); font-size: 12px; }

/* Dock */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-top: 18px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 60%, rgba(6,9,20,0));
}
.dock .inner { max-width: 460px; margin: 0 auto; }
.dock .btn { background: rgba(13,18,40,.9); backdrop-filter: blur(8px); }

/* Team kleuren */
.t0 { --tc: var(--t1); --tb: var(--t1-bg); }
.t1 { --tc: var(--t2); --tb: var(--t2-bg); }
.tc { color: var(--tc); }
.tl { font: 600 10.5px/1 var(--f-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--tc); }

/* Borden met de boom */
.boards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.board {
  position: relative; border-radius: 18px; padding: 16px 14px 16px; background: var(--surface);
  border: 1px solid var(--hair); display: flex; flex-direction: column; gap: 14px; min-width: 0; overflow: hidden;
  transition: border-color .3s ease, background .3s ease;
}
.board::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--tc); box-shadow: 0 0 18px var(--tc); }
.board { background: linear-gradient(180deg, var(--tb), var(--surface) 75%); }
.board.hot { animation: hot 1.4s ease-in-out infinite; }
@keyframes hot { 0%, 100% { box-shadow: 0 0 0 0 transparent; border-color: var(--hair); } 50% { box-shadow: 0 0 28px -4px var(--tc); border-color: var(--tc); } }
.hotb { display: inline-block; margin-left: 8px; padding: 3px 8px; border-radius: 999px; background: var(--tc); color: #10140f; font: 800 9px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; vertical-align: 1px; }
.board.sel { border-color: color-mix(in srgb, var(--tc) 55%, transparent); background: linear-gradient(180deg, var(--tb), var(--surface) 70%); }
.board .bnames { font: 600 18px/1.15 var(--f-serif); margin-top: 6px; min-height: 2.3em; overflow-wrap: anywhere; }
.board .bbody { display: grid; grid-template-columns: auto 1fr; align-items: end; gap: 10px; }
.board .num { font: 500 76px/0.8 var(--f-serif); font-variant-numeric: lining-nums tabular-nums; text-align: right; color: var(--ivory); text-shadow: 0 0 28px color-mix(in srgb, var(--tc) 45%, transparent); }
.board .num.zero { color: var(--tc); }
.board.bump .num { animation: settle .7s var(--ease); }
@keyframes settle { 0% { opacity: .2; transform: translateY(-10px); filter: blur(3px); } 100% { opacity: 1; transform: none; filter: none; } }
.board .delta { position: absolute; right: 14px; top: 12px; font: italic 700 30px/1 var(--f-serif); text-shadow: 0 0 16px var(--tc); color: var(--tc); animation: fadeup 1.8s var(--ease) forwards; pointer-events: none; }
@keyframes fadeup { 0% { opacity: 0; transform: translateY(6px); } 15%, 65% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-6px); } }

/* De boom: 10 horizontale streepjes op een stam, van onder naar boven. */
.boom { position: relative; display: flex; flex-direction: column-reverse; align-items: center; gap: 6px; padding: 2px 0 0; width: 54px; }
.boom::before { content: ""; position: absolute; left: 50%; top: -6px; bottom: -6px; width: 1px; background: var(--hair-2); transform: translateX(-.5px); }
.boom i { position: relative; display: block; width: 54px; height: 3px; border-radius: 2px; background: var(--tc); box-shadow: 0 0 8px color-mix(in srgb, var(--tc) 55%, transparent); transform-origin: center; transition: opacity .4s ease, transform .4s var(--ease); }
.boom i.off { opacity: .1; transform: scaleX(.35); }
.boom i.x { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.boom i.off { box-shadow: none; background: var(--ivory); }
.boom i.leave { animation: leave .7s var(--ease) both; animation-delay: calc(var(--k) * 90ms); }
.boom i.arrive { animation: arrive .6s var(--ease) both; animation-delay: calc(var(--k) * 90ms); }
@keyframes leave { 0% { opacity: 1; transform: none; background: var(--tc); } 100% { opacity: .1; transform: scaleX(.35); } }
@keyframes arrive { 0% { opacity: 0; transform: scaleX(0); } 100% { opacity: 1; transform: none; } }

/* Invoer van een hand */
.steps { display: flex; flex-direction: column; gap: 18px; }
.step { display: flex; flex-direction: column; gap: 10px; transition: opacity .25s ease; }
.step.wait { opacity: .3; pointer-events: none; }
.slabel { display: flex; align-items: center; gap: 10px; }
.slabel .no { font: italic 600 18px/1 var(--f-serif); color: var(--gold); width: 14px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stack { display: grid; gap: 8px; }
.opt {
  border: 1px solid var(--hair); background: var(--surface); border-radius: 14px; padding: 13px 14px; min-height: 62px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; text-align: left;
  transition: background .2s ease, border-color .2s ease, transform .12s ease;
}
.opt:active { transform: scale(.985); }
.opt .big { font: 600 20px/1.1 var(--f-serif); }
.opt small { color: var(--dim); font-size: 12px; line-height: 1.35; }
.opt.on { border-color: var(--gold); background: var(--gold-soft); }
.opt.team.on { border-color: color-mix(in srgb, var(--tc) 70%, transparent); background: var(--tb); }
.opt.res { --rc: var(--gold); align-items: stretch; justify-content: center; gap: 6px; padding: 14px 18px; min-height: 64px; position: relative; overflow: hidden; }
.opt.res::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--rc); opacity: .85; }
.opt.res.lose { --rc: var(--danger); }
.opt.res .kick { font: 700 10px/1.2 var(--f-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--rc); }
.opt.res .big { font-size: 23px; }
.opt.res .big .tc { font-style: italic; }
.effs { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 4px; }
.eff2 { display: inline-flex; align-items: baseline; gap: 7px; white-space: nowrap; }
.eff2 .tl { font-size: 9.5px; }
.eff2 .sc { font: 600 19px/1 var(--f-serif); font-variant-numeric: lining-nums tabular-nums; color: var(--dim); }
.eff2 .sc b { color: var(--tc); font-weight: 600; }
.eff2 .sc .ar { color: var(--dim); margin: 0 3px; font-family: var(--f-ui); font-size: 13px; }

/* Melding na elke hand, met ongedaan maken */
.toast {
  position: fixed; z-index: 15; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  width: min(430px, calc(100% - 32px)); display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: #182048; border: 1px solid var(--hair-2); border-radius: 14px; padding: 10px 10px 10px 16px;
  box-shadow: 0 16px 40px -12px rgba(0,0,0,.7); animation: toastin .35s var(--ease);
}
.toast.out { animation: toastout .3s ease forwards; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 12px); } }
@keyframes toastout { to { opacity: 0; transform: translate(-50%, 12px); } }
.toast .tx { font-size: 13.5px; line-height: 1.35; min-width: 0; }
.toast .tx b { font-weight: 600; }
.bill-hint { font-size: 13px; color: var(--dim); margin: 0; }
.bill-hint b { color: var(--ivory); font-weight: 600; }
.breakdown { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 13.5px; color: var(--dim); }
.breakdown span:nth-child(even) { text-align: right; color: var(--ivory); font-variant-numeric: tabular-nums; }

.hrow { display: grid; grid-template-columns: 20px 1fr auto; gap: 12px; align-items: baseline; font-size: 13px; padding: 10px 0; border-bottom: 1px solid var(--hair); }
.hrow:last-child { border-bottom: 0; padding-bottom: 0; }
.hrow .n { color: var(--dim); font: italic 600 16px var(--f-serif); }
.hrow .sc { font: 600 18px var(--f-serif); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hrow .sc .sep { color: var(--dim); margin: 0 4px; }

.roundbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pricechip { background: transparent; border: 1px solid var(--hair-2); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }

/* Prijs */
.money { display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--hair-2); padding: 6px 2px 10px; transition: border-color .2s ease; }
.money:focus-within { border-color: var(--gold); }
.money span { font: 500 40px var(--f-serif); color: var(--dim); }
.money input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font: 600 64px/1 var(--f-serif); font-variant-numeric: lining-nums tabular-nums; }
.money input::placeholder { color: rgba(233,241,255,.16); }
.chip { border: 1px solid var(--hair-2); background: transparent; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 13px; }
.chip.on { border-color: var(--gold); color: var(--gold); }
.err { color: var(--danger); font-size: 13px; margin: 0; min-height: 1.2em; }
.matchup { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 16px; border: 1px solid var(--hair); border-radius: 18px; background: var(--surface); }
.matchup .side { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.matchup .nm { font: 600 20px/1.15 var(--f-serif); overflow-wrap: anywhere; }
.matchup .vs { font: italic 500 18px var(--f-serif); color: var(--dim); }

/* Boeren trekken aan tafel. Spelers met de klok mee: 0 onder, 1 links, 2 boven, 3 rechts. */
.table {
  position: relative; height: 410px; border-radius: 26px; overflow: hidden; user-select: none; -webkit-user-select: none;
  --cw: 54px; --ch: 76px;
  background: radial-gradient(ellipse 70% 60% at 50% 50%, #1a2350 0%, #0d1330 75%), var(--surface);
  border: 1px solid var(--hair); box-shadow: inset 0 0 60px rgba(0,0,0,.35);
}
.table::before { content: ""; position: absolute; inset: 10px; border-radius: 20px; border: 1px solid rgba(94,240,192,.12); pointer-events: none; }
.seat { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 1; }
.seat.p0 { bottom: 16px; left: 50%; transform: translateX(-50%); flex-direction: column-reverse; }
.seat.p2 { top: 16px; left: 50%; transform: translateX(-50%); }
.seat.p1 { left: 16px; top: 50%; transform: translateY(-50%); }
.seat.p3 { right: 16px; top: 50%; transform: translateY(-50%); }
.seat .nm { font: 600 18px/1 var(--f-serif); color: var(--dim); transition: color .4s ease; white-space: nowrap; display: flex; align-items: baseline; gap: 6px; }
.seat .nm small { font: 600 8.5px/1 var(--f-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.seat .pile { width: var(--cw); height: var(--ch); border-radius: 7px; border: 1px dashed var(--hair); transition: border-color .4s ease, box-shadow .4s ease; }
.seat.jack .nm { color: var(--gold); }
.seat.jack .pile { border-color: transparent; }
.seat.t0 .nm { color: var(--t1); } .seat.t1 .nm { color: var(--t2); }
.deckpile { position: absolute; left: 50%; top: 50%; width: var(--cw); height: var(--ch); transform: translate(-50%, -50%); border-radius: 7px; transition: opacity .5s ease; }
.deckpile.empty { opacity: 0; }
.deckpile, .dcard .back {
  background:
    radial-gradient(circle at 50% 50%, rgba(94,240,192,.22), transparent 55%),
    repeating-linear-gradient(45deg, rgba(94,240,192,.17) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(-45deg, rgba(94,240,192,.17) 0 1px, transparent 1px 6px),
    #0f1630;
  box-shadow: inset 0 0 0 1px rgba(94,240,192,.55), inset 0 0 0 4px #0f1630, inset 0 0 0 5px rgba(94,240,192,.35), 0 8px 18px -6px rgba(0,0,0,.6);
}
.deckpile { box-shadow: inset 0 0 0 1px rgba(94,240,192,.55), inset 0 0 0 4px #0f1630, inset 0 0 0 5px rgba(94,240,192,.35), 2px 2px 0 -1px #0a1024, 4px 4px 0 -2px #0f1630, 0 10px 20px -6px rgba(0,0,0,.6); }
.dealer-tag { position: absolute; left: 50%; top: calc(50% + 50px); transform: translateX(-50%); font: italic 500 14px var(--f-serif); color: var(--dim); white-space: nowrap; }
.dcard { position: absolute; width: var(--cw); height: var(--ch); perspective: 600px; z-index: 5;
  transition: left .42s var(--ease), top .42s var(--ease), transform .42s var(--ease); }
.dcard.instant { transition: none; }
.dcard .inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.25,1); }
.dcard.flipped .inner { transform: rotateY(180deg); }
.dcard .back, .dcard .face { position: absolute; inset: 0; border-radius: 7px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.dcard .face {
  transform: rotateY(180deg); background: linear-gradient(160deg, #f8f2e4, #ebe1ca); color: #1d1f1c;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08), 0 8px 18px -6px rgba(0,0,0,.6);
  display: grid; place-items: center; font-family: var(--f-serif);
}
.dcard .face.red { color: #a2302a; }
.dcard .ix { position: absolute; top: 5px; left: 6px; display: flex; flex-direction: column; align-items: center; font: 600 14px/0.95 var(--f-serif); font-variant-numeric: lining-nums; }
.dcard .ix.br { top: auto; left: auto; bottom: 5px; right: 6px; transform: rotate(180deg); }
.dcard .ix i { font-style: normal; font-size: 11px; }
.dcard .mid { font: 500 28px/1 var(--f-serif); }
.dcard .mid.court { font: italic 600 32px/1 var(--f-serif); }
.dcard.isjack { z-index: 40; }
.dcard.isjack::after { content: ""; position: absolute; inset: -6px; border-radius: 12px; border: 2px solid var(--gold); animation: burst .9s ease-out .35s both; pointer-events: none; }
.dcard.isjack::before { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; animation: sparks .9s ease-out .35s both; pointer-events: none;
  box-shadow: 0 -60px 0 var(--gold), 42px -42px 0 var(--t1), 60px 0 0 var(--gold), 42px 42px 0 var(--t2), 0 60px 0 var(--gold), -42px 42px 0 var(--t1), -60px 0 0 var(--gold), -42px -42px 0 var(--t2); }
@keyframes burst { from { opacity: 1; transform: scale(.85); } to { opacity: 0; transform: scale(1.7); } }
@keyframes sparks { from { opacity: 1; transform: scale(.2); } 70% { opacity: 1; } to { opacity: 0; transform: scale(1.15); } }
.dcard.isjack .face { box-shadow: 0 0 0 2px var(--gold), 0 0 28px rgba(94,240,192,.55), 0 10px 22px -6px rgba(0,0,0,.6); }
.dcard.isjack .mid { color: inherit; }
.dealmsg { margin: 0; min-height: 2.6em; text-align: center; font: italic 500 21px/1.25 var(--f-serif); color: var(--ivory); text-wrap: balance; }
.dealmsg b { font-weight: 600; color: var(--gold); }
.draw-actions { display: grid; gap: 12px; animation: enter .5s var(--ease); }
.skip { text-align: center; margin: 0; color: var(--dim); font-size: 12px; letter-spacing: .04em; }

/* Statistieken */
.panel-head:has(.tabs) { flex-wrap: wrap; row-gap: 10px; }
.tabs { display: inline-flex; border: 1px solid var(--hair-2); border-radius: 999px; padding: 3px; gap: 2px; }
.tabs button { white-space: nowrap; border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font: 600 12px var(--f-ui); color: var(--dim); }
.tabs button.on { background: var(--gold-soft); color: var(--gold); }
.sub { font: 600 10.5px/1.3 var(--f-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); margin: 6px 0 0; }
.wrow { display: grid; grid-template-columns: 76px 1fr 64px; gap: 12px; align-items: center; padding: 6px 0; }
.wrow .who { font: 600 18px/1.1 var(--f-serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrow .bar { height: 6px; border-radius: 3px; background: var(--hair); overflow: hidden; }
.wrow .bar i { display: block; height: 100%; background: var(--pc); border-radius: 3px; box-shadow: 0 0 10px color-mix(in srgb, var(--pc) 60%, transparent); }
.wrow .who { color: var(--pc); }
.wrow .n { text-align: right; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
.wrow .n b { color: var(--ivory); font-weight: 600; }
.h2h-wrap { overflow-x: auto; }
.h2h { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.h2h th { font: 600 10px var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding: 6px 4px; text-align: center; }
.h2h th.rowh { text-align: left; font: 600 16px var(--f-serif); letter-spacing: 0; text-transform: none; color: var(--ivory); white-space: nowrap; }
.h2h td { text-align: center; padding: 8px 4px; border-top: 1px solid var(--hair); font-size: 14px; }
.h2h td.self { color: var(--hair-2); }
.h2h td .w { color: var(--ivory); font-weight: 600; } .h2h td .l { color: var(--dim); }
.h2h td.up .w { color: var(--gold); }
.duo { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--hair); }
.duo:first-of-type { border-top: 0; }
.duo .nm { font: 600 17px var(--f-serif); }
.duo .n { font-size: 13px; color: var(--dim); }
.duo .n b { color: var(--ivory); }
.duo.best .nm { color: var(--gold); }
.hint { font-size: 12px; color: var(--dim); margin: 0; }

/* Rekenmachine */
.calc { display: flex; flex-direction: column; gap: 12px; }
.cdisp { display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--gold); padding: 4px 2px 10px; min-height: 76px; }
.cdisp .cur { font: 500 36px var(--f-serif); color: var(--dim); }
.cdisp .expr { flex: 1; min-width: 0; text-align: right; font: 600 52px/1.1 var(--f-serif); font-variant-numeric: lining-nums tabular-nums; overflow-wrap: anywhere; }
.cdisp .expr.long { font-size: 34px; }
.cdisp .expr.ph { color: rgba(233,241,255,.18); }
.cdisp .expr .op { color: var(--gold); margin: 0 .12em; font-weight: 500; }
.cres { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; min-height: 22px; font-size: 13.5px; color: var(--dim); }
.cres b { color: var(--ivory); font: 600 20px var(--f-serif); font-variant-numeric: lining-nums; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.key {
  min-height: 54px; border-radius: 14px; border: 1px solid var(--hair); background: var(--surface);
  font: 500 26px/1 var(--f-serif); font-variant-numeric: lining-nums; display: grid; place-items: center;
  transition: background .12s ease, transform .1s ease, border-color .12s ease; touch-action: manipulation;
}
.key:active, .key.hit { background: var(--surface-2); transform: scale(.96); border-color: var(--hair-2); }
.key.op { color: var(--gold); background: transparent; border-color: rgba(94,240,192,.3); font: 400 24px/1 var(--f-ui); }
.key.fn { font: 600 13px var(--f-ui); letter-spacing: .1em; color: var(--dim); background: transparent; }
.key.eq { font: 400 26px/1 var(--f-ui); grid-row: span 2; background: var(--gold-soft); border-color: rgba(94,240,192,.5); color: var(--gold); }
.key.zero { grid-column: span 2; }

/* Modals */
.overlay { position: fixed; inset: 0; z-index: 58; background: rgba(3, 5, 14, .76); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: grid; align-items: end; justify-items: center; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  width: 100%; max-width: 460px; max-height: 92vh; overflow: auto; background: var(--surface); border: 1px solid var(--hair); border-bottom: 0;
  border-radius: 24px 24px 0 0; padding: 26px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 16px; animation: up .4s var(--ease);
}
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; color: var(--dim); }
.input { background: var(--bg); border: 1px solid var(--hair-2); border-radius: 12px; padding: 12px 14px; min-height: 48px; width: 100%; }
.input:focus { border-color: var(--gold); outline: none; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.win { text-align: center; align-items: center; position: relative; overflow: hidden; padding-top: 34px; }
.win::before { content: ""; position: absolute; left: 50%; top: -120px; width: 360px; height: 260px; transform: translateX(-50%); background: radial-gradient(closest-side, color-mix(in srgb, var(--tc) 30%, transparent), transparent); animation: glow 2.4s ease-in-out infinite alternate; pointer-events: none; }
@keyframes glow { from { opacity: .55; } to { opacity: 1; } }
.win .crest { font: italic 600 15px var(--f-serif); color: var(--tc); letter-spacing: .02em; }
.win h2 { font: 600 40px/1.05 var(--f-serif); text-wrap: balance; position: relative; }
.win h2 .tc { text-shadow: 0 0 30px color-mix(in srgb, var(--tc) 50%, transparent); }
#confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.win > *:not(#confetti) { position: relative; }
.win .wl2 { width: 0; height: 1px; background: var(--tc); animation: draw 1s var(--ease) .2s forwards; }
@keyframes draw { to { width: 120px; } }
.win .pay { border: 1px solid var(--hair); border-radius: 16px; padding: 16px; width: 100%; display: flex; flex-direction: column; gap: 4px; }
.win .pay b { font: 600 34px/1 var(--f-serif); font-variant-numeric: lining-nums; }

/* Einde avond */
.payers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.payer { border: 1px solid var(--hair); background: var(--surface); border-radius: 14px; min-height: 62px; padding: 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 3px; transition: border-color .2s ease, background .2s ease; }
.payer .nm { font: 600 21px/1.1 var(--f-serif); }
.payer small { font-size: 12px; color: var(--dim); }
.payer.on { border-color: var(--gold); background: var(--gold-soft); }
.tr { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--hair); }
.tr:last-of-type { border-bottom: 0; }
.tr .who { font: 600 21px/1.15 var(--f-serif); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tr .arrow { color: var(--gold); font: italic 500 16px/1.2 var(--f-serif); }
.tr .amt { font: 600 17px var(--f-ui); font-variant-numeric: tabular-nums; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.total b { font: 600 34px var(--f-serif); font-variant-numeric: lining-nums tabular-nums; }
.note { border: 1px solid rgba(94,240,192,.35); border-radius: 12px; padding: 11px 14px; font-size: 13.5px; color: var(--ivory); background: var(--gold-soft); }
.sync { white-space: nowrap; font-size: 11px; color: var(--dim); display: inline-flex; align-items: center; gap: 6px; letter-spacing: .04em; }
.sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
.sync.on::before { background: #5ef0c0; }
.empty { color: var(--dim); font-size: 14px; margin: 0; }
.btn:disabled { opacity: .35; pointer-events: none; }
.top .btn { flex-shrink: 0; white-space: nowrap; }

/* Start van de avond: spelers en keuze van het spel */
.pfield { display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 10px; border-bottom: 1px solid var(--hair); transition: border-color .2s ease; }
.pfield:last-child { border-bottom: 0; }
.pfield:focus-within { border-color: var(--gold); }
.pfield span { display: inline-flex; align-items: center; gap: 6px; font: italic 600 18px/1 var(--f-serif); color: var(--dim); font-variant-numeric: lining-nums; }
.pfield span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 8px var(--pc); }
.pfield input { min-width: 0; width: 100%; border: 0; background: transparent; outline: none; font: 600 24px/1.2 var(--f-serif); padding: 12px 0; }
.pfield input::placeholder { color: rgba(233,241,255,.2); }
.gcards { display: grid; gap: 12px; }
.gcard { text-align: left; border: 1px solid var(--hair); border-radius: 20px; padding: 20px 18px; display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; transition: border-color .2s ease, transform .12s ease; }
.gcard:active { transform: scale(.99); }
.gcard:hover { border-color: var(--hair-2); }
.gcard.troef { --tc: var(--t1); background: linear-gradient(135deg, var(--t1-bg), var(--surface) 62%); }
.gcard.wiez { --tc: var(--t2); background: linear-gradient(135deg, var(--t2-bg), var(--surface) 62%); }
.gcard .gname { font: italic 600 34px/1 var(--f-serif); color: var(--tc); }
.gcard .garr { font: 500 28px/1 var(--f-serif); color: var(--tc); }
.gcard .gdesc { grid-column: 1 / -1; color: var(--dim); font-size: 13.5px; line-height: 1.45; }
.gcard .gstat { grid-column: 1 / -1; font: 600 10.5px/1.3 var(--f-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.names { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }

/* Wiezen: percentages, stand en invoer */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pctrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.pctrow:last-child { border-bottom: 0; }
.pctrow .pl { font: 600 20px/1.15 var(--f-serif); min-width: 0; }
.pctrow .pl small { display: block; font: 400 12px/1.35 var(--f-ui); color: var(--dim); margin-top: 3px; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--hair-2); background: transparent; font: 500 22px/1 var(--f-ui); color: var(--gold); touch-action: manipulation; }
.stepper button:active { background: var(--surface-2); }
.stepper input { width: 52px; text-align: right; border: 0; border-bottom: 1px solid var(--hair-2); background: transparent; outline: none; font: 600 28px/1 var(--f-serif); font-variant-numeric: lining-nums tabular-nums; padding: 4px 2px; }
.stepper input:focus { border-color: var(--gold); }
.stepper .pc { font: 500 18px var(--f-serif); color: var(--dim); margin-right: 2px; }
.stepper output { min-width: 34px; text-align: center; font: 600 24px var(--f-serif); font-variant-numeric: lining-nums tabular-nums; }
.sumline { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 600; }
.sumline .ok { color: var(--p2); } .sumline .bad { color: var(--danger); }
.pctbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--hair); }
.pctbar i { background: var(--gold); opacity: calc(.35 + var(--o) * .65); }
.pos { color: var(--p2); } .neg { color: var(--danger); }
.srow .meta { display: block; font: 500 12px/1.3 var(--f-ui); color: var(--dim); margin-top: 4px; letter-spacing: .02em; }
.srow small.dl, .hjrow small.dl { font: 700 9px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-left: 8px; vertical-align: 4px; }
.srow .pts { font: 600 28px/1 var(--f-serif); font-variant-numeric: lining-nums tabular-nums; text-align: right; }
.srow .owe small { display: block; font-weight: 400; color: var(--dim); font-size: 12px; margin-top: 2px; }
.opt.res.on { border-color: var(--gold); background: var(--gold-soft); }
.opt.res.lose.on { border-color: var(--danger); background: rgba(255,107,107,.1); }
.opt.who-on { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 12%, transparent); }
.dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.dcell { display: flex; justify-content: space-between; gap: 8px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 15px; min-width: 0; }
.dcell span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dcell b { font: 600 19px/1 var(--f-serif); font-variant-numeric: lining-nums tabular-nums; }

/* Hartenjagen */
.gcard.hart { --tc: var(--p3); background: linear-gradient(135deg, rgba(255,134,192,.13), var(--surface) 62%); }
.hjrow { display: flex; flex-direction: column; gap: 7px; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.hjrow:last-child { border-bottom: 0; }
.hjtop { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.hjrow .who { font: 600 21px/1.1 var(--f-serif); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hjrow .who::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--pc); margin-right: 10px; vertical-align: 3px; box-shadow: 0 0 10px var(--pc); }
.hjnum { font: 600 34px/1 var(--f-serif); font-variant-numeric: lining-nums tabular-nums; }
.hjbar { height: 6px; border-radius: 3px; background: var(--hair); overflow: hidden; }

<script>
// Spelregels en afrekening voor Troeven op café. Pure functies, getest in test/logic.test.mjs.
const Logic = (() => {
  const START = 10;
  // De drie mogelijke teamindelingen met 4 spelers (indexen in players).
  const PAIRINGS = [
    [[0, 1], [2, 3]],
    [[0, 2], [1, 3]],
    [[0, 3], [1, 2]],
  ];

  function pairingIndex(teams) {
    if (!teams) return -1;
    const a = [...teams[0]].sort().join();
    const b = [...teams[1]].sort().join();
    return PAIRINGS.findIndex(([x, y]) => {
      const xs = x.join(), ys = y.join();
      return (xs === a && ys === b) || (xs === b && ys === a);
    });
  }

  // Lot teams. Nooit dezelfde indeling als het vorige rondje (er zijn er maar 3).
  function drawTeams(prevTeams, rnd = Math.random) {
    const prev = pairingIndex(prevTeams);
    const options = PAIRINGS.map((_, i) => i).filter((i) => i !== prev);
    const pick = PAIRINGS[options[Math.floor(rnd() * options.length)]];
    let teams = pick.map((t) => (rnd() < 0.5 ? [t[0], t[1]] : [t[1], t[0]]));
    if (rnd() < 0.5) teams = [teams[1], teams[0]];
    return teams;
  }

  // Boeren trekken. Spel van 24 kaarten (9, 10, J, Q, K, A in 4 kleuren); J is de boer.
  // De deler geeft om beurten één open kaart, te beginnen links van de deler (volgende index).
  // Wie een boer krijgt, ligt eruit en krijgt geen kaarten meer. De eerste twee met een boer
  // vormen Team I, de andere twee Team II.
  const RANKS = ['9', '10', 'J', 'Q', 'K', 'A'];
  const SUITS = ['s', 'h', 'k', 'r']; // schoppen, harten, klaveren, ruiten
  function dealTeams(dealer, rnd = Math.random) {
    const deck = [];
    for (const s of SUITS) for (const r of RANKS) deck.push({ r, s });
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    const deal = [], jacks = [];
    let seat = (dealer + 1) % 4;
    for (const card of deck) {
      while (jacks.includes(seat)) seat = (seat + 1) % 4;
      deal.push({ player: seat, card });
      if (card.r === 'J') { jacks.push(seat); if (jacks.length === 2) break; }
      seat = (seat + 1) % 4;
    }
    const rest = [0, 1, 2, 3].filter((p) => !jacks.includes(p));
    return { dealer, deal, teams: [jacks, rest] };
  }

  // Statistieken over uitgespeelde rondjes (n spelers).
  // per[i] = {won, played}; vs[i][j] = {won, lost} van i tegen tegenstander j; duos["i-j"] = {won, played}
  function stats(rounds, n = 4) {
    const per = Array.from({ length: n }, () => ({ won: 0, played: 0 }));
    const vs = Array.from({ length: n }, () => Array.from({ length: n }, () => ({ won: 0, lost: 0 })));
    const duos = {};
    for (const r of rounds) {
      if (r.winner === null || r.winner === undefined) continue;
      r.teams.forEach((team, t) => {
        const won = t === r.winner;
        const key = [...team].sort((a, b) => a - b).join('-');
        duos[key] = duos[key] || { won: 0, played: 0 };
        duos[key].played++; if (won) duos[key].won++;
        for (const i of team) {
          per[i].played++; if (won) per[i].won++;
          for (const j of r.teams[1 - t]) { if (won) vs[i][j].won++; else vs[i][j].lost++; }
        }
      });
    }
    return { per, vs, duos };
  }

  // hand = { card: 1|2, playing: 0|1, result: 'win' | 'clean' | 'lose' }
  // win:   spelend team -1 (1ste kaart) of -2 (2de kaart)
  // clean: gewonnen en de anderen haalden geen slag: -2 of -3
  // lose:  het andere team -1 of -2, het spelende team krijgt er 1 streepje bij
  function rawDelta(hand) {
    const d = [0, 0];
    const p = hand.playing, o = 1 - p;
    if (hand.result === 'win') d[p] = -hand.card;
    else if (hand.result === 'clean') d[p] = -(hand.card + 1);
    else if (hand.result === 'lose') { d[o] = -hand.card; d[p] = +1; }
    else throw new Error('Onbekend resultaat: ' + hand.result);
    return d;
  }

  // Speel alle handen af. Nooit onder 0; wie eerst op 0 staat wint.
  function replay(hands) {
    let score = [START, START];
    const steps = [];
    let winner = null;
    for (const hand of hands) {
      if (winner !== null) break;
      const before = score;
      const d = rawDelta(hand);
      score = [Math.max(0, before[0] + d[0]), Math.max(0, before[1] + d[1])];
      steps.push({ hand, before, after: score, delta: [score[0] - before[0], score[1] - before[1]] });
      if (score[0] === 0) winner = 0;
      else if (score[1] === 0) winner = 1;
    }
    return { score, steps, winner };
  }

  function round2(c) { return Math.round(c); }

  // Wat ieder verschuldigd is uit de gespeelde rondjes (in cent, kan halve cent zijn).
  function shares(state) {
    const s = state.players.map(() => 0);
    const lost = state.players.map(() => 0);
    const won = state.players.map(() => 0);
    for (const r of state.rounds) {
      if (r.winner === null || r.winner === undefined) continue;
      const losers = r.teams[1 - r.winner];
      for (const i of losers) { s[i] += r.price / 2; lost[i]++; }
      for (const i of r.teams[r.winner]) won[i]++;
    }
    return { owed: s, lost, won };
  }

  // Einde avond: payer betaalde de hele rekening (bill, in cent).
  // Zonder bill geldt het totaal van de rondjes. Het verschil tussen de echte rekening en
  // de rondjes (te veel of te weinig) wordt gelijk over alle spelers verdeeld.
  // Valt iemands aandeel negatief uit, dan krijgt die geld terug van de betaler.
  function settle(state, payer, bill = null) {
    const n = state.players.length;
    const { owed } = shares(state);
    const played = state.rounds.filter((r) => r.winner !== null && r.winner !== undefined);
    const rounds = played.reduce((t, r) => t + r.price, 0);
    const total = bill === null || bill === undefined ? rounds : bill;
    const diff = total - rounds;
    const per = owed.map((c) => c + diff / n);
    const transfers = [];
    per.forEach((c, i) => {
      if (i === payer) return;
      const amount = round2(c);
      if (amount > 0) transfers.push({ from: i, to: payer, amount });
      else if (amount < 0) transfers.push({ from: payer, to: i, amount: -amount });
    });
    return { total, rounds, diff, per, transfers };
  }

  function euro(cents) {
    const v = (Math.round(cents) / 100).toFixed(2).replace('.', ',');
    return '€ ' + v;
  }

  // "12,50" / "12.5" / "12" -> 1250 cent. null bij ongeldig.
  function parsePrice(text) {
    if (text === null || text === undefined) return null;
    const t = String(text).trim().replace(/€/g, '').replace(/\s/g, '').replace(',', '.');
    if (!/^\d+(\.\d{0,2})?$/.test(t)) return null;
    const c = Math.round(parseFloat(t) * 100);
    return c > 0 ? c : null;
  }


  // Rekenmachine: "4×2,80+3,20" -> 1440 cent. Volgorde: × en ÷ eerst. null bij ongeldig, 0 of negatief.
  function calc(expr) {
    const str = String(expr || '').replace(/\s/g, '');
    if (!str) return null;
    const toks = str.match(/\d+(?:,\d*)?|[+\-−×÷*/]/g);
    if (!toks || toks.join('') !== str) return null;
    const nums = [], ops = [];
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i], isNum = /^\d/.test(t);
      if (i % 2 === 0) { if (!isNum) return null; nums.push(parseFloat(t.replace(',', '.'))); }
      else { if (isNum) return null; ops.push({ '−': '-', '*': '×', '/': '÷' }[t] || t); }
    }
    if (nums.length !== ops.length + 1) return null;
    const n = [nums[0]], o = [];
    for (let i = 0; i < ops.length; i++) {
      const b = nums[i + 1], op = ops[i];
      if (op === '×') n[n.length - 1] *= b;
      else if (op === '÷') { if (b === 0) return null; n[n.length - 1] /= b; }
      else { o.push(op); n.push(b); }
    }
    let r = n[0];
    o.forEach((op, i) => { r = op === '+' ? r + n[i + 1] : r - n[i + 1]; });
    const c = Math.round(r * 100 + 1e-9);
    return c > 0 ? c : null;
  }

  return { dealTeams, stats, RANKS, SUITS, calc, START, PAIRINGS, pairingIndex, drawTeams, rawDelta, replay, shares, settle, euro, parsePrice };
})();
if (typeof module !== 'undefined') module.exports = Logic;

</script>
<script>

  function freshDt(prev) { return { pct: prev && prev.pct ? prev.pct : null, mode: prev && prev.mode ? prev.mode : '501', dout: prev ? !!prev.dout : false, rondjes: [] }; }
  const dCur = (r) => (r.s0 + r.turns.length) % (r.n || S.players.length);

  const dDone = (r) => (r.mode === 'cricket' ? crState(r).winner >= 0 : xRem(r).some((v) => v === 0));

  // Spellen die afrekenen met percentages per plaats

  // Wat elke speler betaalt voor de uitgespeelde rondjes van één spel (in cent)

  // ---------- Poker (kassa) ----------

  // (buy-out). Winst of verlies = buy-out − buy-in. Klopt de pot niet, dan wordt het verschil gelijk over de spelers verdeeld.
  // past = pokers die vanavond al gedaan zijn (met hun winst/verlies); ze tellen mee in de afrekening
  function freshPk(prev) { return { unit: prev && prev.unit ? prev.unit : 1000, mode: prev && prev.mode ? prev.mode : 'cash', lvlMin: prev && prev.lvlMin ? prev.lvlMin : 5, on: false, step: 'setup', who: [], buyin: [], buyout: [], past: prev && Array.isArray(prev.past) ? prev.past : [] }; }
  function splitEqually(total, n) {
    if (n <= 0) return [];
    const sg = total < 0 ? -1 : 1, base = Math.floor(Math.abs(total) / n) * sg, arr = Array(n).fill(base);
    let rem = total - base * n, k = 0;

    return arr;
  }
  // ---------- Pokertoernooi ----------
  // Iedereen start met 3.000 fiches. Om de zoveel minuten gaan de blinds omhoog. Wie eruit ligt kan terug inkopen.
  // De pot wordt verdeeld volgens de bedragen per plaats; eigen inkopen gaan er automatisch af.
  const BL = [[25, 50], [50, 100], [150, 300], [250, 500], [500, 1000]];
  const STACK = 3000;
  const nf = (n) => Math.round(n).toLocaleString('nl-BE');
  function tState(K) {
    const L = (K.lvlMin || 5) * 60000, el = Math.max(0, (K.t.pausedAt || Date.now()) - K.t.start - K.t.off);

  }
  function tSetEl(K, target) { K.t.off = (K.t.pausedAt || Date.now()) - K.t.start - target; K.lastLvl = tState(K).lv; }
  const mmss = (ms) => { const x = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(x / 60)}:${String(x % 60).padStart(2, '0')}`; };
  const tAlive = (K) => K.who.filter((i) => !K.out.includes(i));
  const tPot = (K) => K.who.reduce((t, i) => t + (K.buyin[i] || 0), 0);
  const tReb = (K, i) => Math.max(0, Math.round((K.buyin[i] || 0) / K.unit) - 1);
  function tPrizes(K) {
    // De gekozen bedragen blijven; extra geld (terug inkopen, speler erbij) gaat half naar de 1ste en half naar de 2de. De 3de blijft gelijk.
    const pot = tPot(K), base = K.pay.reduce((x, y) => x + y, 0), extra = pot - base, half = Math.floor(extra / 2);
    const pr = [(K.pay[0] || 0) + extra - half, (K.pay[1] || 0) + half, K.pay[2] || 0];
    pr[0] += pot - pr.reduce((a, b) => a + b, 0);
    return pr;
  }
  // Volgorde van de eindstand: wie overblijft is 1ste, wie het laatst uitviel 2de, ...
  const tOrder = (K) => [...tAlive(K), ...K.out.slice().reverse()];
  function chipSVG(fill, edge, ink) {

  function blindAlarm(lv) {

  // Winst/verlies per speler van de avond (in cent), null als de poker nog niet afgerekend is
  // Winst/verlies van alle pokers van vanavond samen (in cent), null als er nog geen gedaan is
  function pokerNet() {
    const K = S.pk; if (!K) return null;
    const cur = K.on && K.step === 'done' ? pkSessionNet(K) : null, past = K.past || [];
    if (!cur && !past.length) return null;
    const net = S.players.map(() => 0);

    return net;
  }
  // Winst/verlies van één poker
  function pkSessionNet(K) {
    if (K.mode === 'tour') {
      const net = S.players.map(() => 0), pr = tPrizes(K);
      tOrder(K).forEach((i, k) => { net[i] = (pr[k] || 0) - (K.buyin[i] || 0); });
      return net;
    }
    const idx = K.who;
    const tin = idx.reduce((t, i) => t + (K.buyin[i] || 0), 0), tout = idx.reduce((t, i) => t + (K.buyout[i] || 0), 0);
    const sh = splitEqually(tout - tin, idx.length);
    const net = S.players.map(() => 0);
    idx.forEach((i, k) => { net[i] = (K.buyout[i] || 0) - (K.buyin[i] || 0) - sh[k]; });
    return net;
  }
  // Zo weinig mogelijk overschrijvingen: grootste schuld met grootste tegoed
  function minTransfers(bal) {
    const cr = bal.map((c, i) => ({ i, c })).filter((x) => x.c > 0).sort((a, b) => b.c - a.c);
    const de = bal.map((c, i) => ({ i, c: -c })).filter((x) => x.c > 0).sort((a, b) => b.c - a.c);
    const tx = []; let a = 0, b = 0;
    while (a < de.length && b < cr.length) {
      const amt = Math.min(de[a].c, cr[b].c);
      if (amt > 0) tx.push({ from: de[a].i, to: cr[b].i, amount: amt });
      de[a].c -= amt; cr[b].c -= amt;
      if (de[a].c <= 0) a++;
      if (cr[b].c <= 0) b++;

    return tx;
  }

  // Einde avond: payer betaalde de rekening. Verschil met de rondjes wordt gelijk verdeeld.
  // Pokerwinst en -verlies komen erbij, en dan rekenen we alles in één keer af.
  function settleAll(payer, bill) {
    const A = owedAll();
    const total = bill === null || bill === undefined ? A.total : bill;
    const diff = total - A.total;
    const per = A.owed.map((c) => c + diff / S.players.length);
    const poker = pokerNet();
    let transfers = [];
    if (!poker) {
      per.forEach((c, i) => {
        if (i === payer) return;
        const amount = Math.round(c);
        if (amount > 0) transfers.push({ from: i, to: payer, amount });
        else if (amount < 0) transfers.push({ from: payer, to: i, amount: -amount });
      });
    } else {
      const bal = per.map((c, i) => Math.round(-c + (i === payer ? total : 0) + poker[i]));
      const off = bal.reduce((a, b) => a + b, 0);
      if (off) bal[payer === null || payer === undefined ? 0 : payer] -= off;
      transfers = minTransfers(bal);
    }
    return { total, rounds: A.total, diff, per, transfers, poker };

      group = [];
    };
    arc.forEach((r) => { if (group.length && r.date - group[group.length - 1].date > 8 * 3600e3) flush(); group.push(r); });
    flush();
    return out;
  }

  function fresh(players) { return { v: 1, players: players || [...DEFAULT_PLAYERS], rounds: [], lastPrice: null, updatedAt: 0, game: null, ready: false, wz: freshWz(), hj: freshHj(), pj: freshPj(), np: freshNp(), lk: freshLk(), dt: freshDt(), pk: freshPk() }; }

  // De boom: n streepjes over, prev = stand vóór de laatste hand (voor de animatie).
  function boom(n, prev) {

    for (let i = 0; i < total; i++) {

      if (i < n && i >= prev) cls += ' arrive';

  // Zet de stand van deze avond in de geschiedenis. Een avond heeft één vaste plaats: opnieuw bewaren vervangt de vorige versie.

  function nightRecord() {

        const rows = h.players.map((nm, i) => `<tr><th class="rowh" scope="row" style="color:var(--p${i})">${esc(nm)}${lo && lo.who.includes(i) ? ' <small class="dl">verliezer</small>' : ''}</th>
          ${h.t ? `<td><span class="w">${h.t.won[i]}</span><span class="l">–${h.t.lost[i]}</span></td>` : ''}
          ${h.w ? `<td><span class="w">${h.w.won[i]}</span><span class="l">–${h.w.lost[i]}</span>${h.w.pts ? `<small class="hpts ${pn(h.w.pts[i])}">${sign(h.w.pts[i])} ptn</small>` : ''}</td>` : ''}
          ${h.h ? `<td><span class="w">${h.h.won[i]}</span><span class="l">–${h.h.lost[i]}</span>${h.h.pts ? `<small class="hpts ${h.h.pts[i] <= 0 ? 'neg' : ''}">${h.h.pts[i]} over</small>` : ''}</td>` : ''}
          ${h.p ? `<td><span class="w">${h.p.won[i]}</span><span class="l">–${h.p.lost[i]}</span></td>` : ''}
          ${h.n ? `<td><span class="w">${h.n.won[i]}</span><span class="l">–${h.n.lost[i]}</span></td>` : ''}
          <td>${paid ? euro(paid[i]) : '–'}</td></tr>`).join('');
        body = `<div class="hbody"><div class="h2h-wrap"><table class="h2h htab"><thead><tr><th></th>${cols}</tr></thead><tbody>${rows}</tbody></table></div>
          <p class="hint">Gewonnen–verloren per rondje. Bij de andere spellen wint de 1ste en verliest wie het meest betaalt.${h.legacy ? ' Van deze avond zijn de bedragen niet bewaard.' : ''}${!h.paid && h.w && !h.w.paid ? ' De wiezen-rekening werd niet ingevuld.' : ''}${!h.paid && h.h && !h.h.paid ? ' De hartenjagen-rekening werd niet ingevuld.' : ''}</p>
          <button class="link" data-act="hDel" data-v="${idx}" style="align-self:flex-start;color:${ui.hDel === idx ? 'var(--danger)' : ''}">${ui.hDel === idx ? 'Tik nog eens om deze avond te verwijderen' : 'Avond verwijderen'}</button></div>`;
      }
      return `<div class="hitem ${open ? 'open' : ''}"><button class="hhead" data-act="hOpen" data-v="${idx}" aria-expanded="${open}">
          <span class="hmain"><span class="hdate">${esc(hDate(h.date))}</span><span class="hsub">${games}${total ? ` · ${euro(total)}` : ''}</span>
          <span class="hlos">Grote verliezer: <b>${loserTxt}</b></span></span><span class="chev">›</span></button>${body}</div>`;
    }).join('');

    return `<section class="panel"><div class="panel-head"><h2>Vorige avonden</h2><span class="label">${all.length} avond${all.length > 1 ? 'en' : ''}</span></div>
      <p class="sub">Klassement</p>
      <div>${sumRows}</div>
      <p class="sub">Per avond · tik voor details</p>
      <div>${items}</div></section>`;
  }

  // ---------- Geschiedenis: spel → spelers → overzicht ----------
  const HK = { troeven: 't', wiezen: 'w', harten: 'h', pietjes: 'p', nappen: 'n', lucky: 'l', darts: 'd', poker: 'k' };
  // Namen vergelijken zonder hoofdletters of spaties: "inez" en "Inez " zijn dezelfde speler.
  const nameKey = (p) => String(p).trim().toLowerCase();
  const groupKey = (players) => players.map(nameKey).sort().join('|');
  // Netste schrijfwijze: liefst met hoofdletter vooraan en niet alles in hoofdletters.
  const nameScore = (p) => (/^\p{Lu}/u.test(p) ? 2 : 0) + (p !== p.toUpperCase() ? 1 : 0);
  const nicer = (a, b) => (nameScore(b.trim()) > nameScore(a.trim()) ? b.trim() : a.trim());
  const tidy = (p) => { const t = p.trim(); return nameScore(t) ? t : t.charAt(0).toUpperCase() + t.slice(1).toLowerCase(); };
  // Wat iedereen voor dit spel betaalde die avond (oudere avonden: enkel als het het enige spel was)
  function gamePaidOf(h, k) {
    const x = h[k];
    if (x.paid) return x.paid;
    return HKEYS.filter((q) => h[q]).length === 1 && h.paid ? h.paid : null;
  }
  function renderHist() {
    const H = ui.hist, all = (S.history || []).map((h, idx) => ({ h, idx }));
    const head = (label) => `<header class="top"><button class="btn ghost sm" data-act="histBack">← Terug</button><span class="label">${label}</span></header>`;
    if (!H.game) {
      const tiles = [...GAMES, POKER_TILE].map((g) => { const n = all.filter(({ h }) => h[HK[g.k]]).length; return `<button class="tile ${g.cls} ${n ? '' : 'off'}" data-act="histGame" data-v="${g.k}" ${n ? '' : 'disabled'}><span class="tart">${GAME_ART[g.k]}</span><span class="tstat">${n ? `${n} avond${n > 1 ? 'en' : ''}` : 'nog niets'}</span><span class="tname">${g.name}</span></button>`; }).join('');
      return `<div class="wrap">${head('Geschiedenis')}<section><h1>Welk <em>spel</em>?</h1></section><div class="tiles">${tiles}</div></div>`;
    }
    const k = HK[H.game], gname = [...GAMES, POKER_TILE].find((g) => g.k === H.game).name;
    const recs = all.filter(({ h }) => h[k]);
    const groups = {};
    recs.forEach(({ h }) => { const gp = gPlayers(h, k), key = groupKey(gp); const g = (groups[key] = groups[key] || { players: gp, n: 0, last: 0 }); g.n++; g.last = Math.max(g.last, h.date); if (gp.reduce((t, p) => t + nameScore(p.trim()), 0) > g.players.reduce((t, p) => t + nameScore(p.trim()), 0)) g.players = gp; });
    if (!H.group) {
      const list = Object.entries(groups).sort((a, b) => b[1].last - a[1].last).map(([key, g]) => `<button class="grp" data-act="histGroup" data-v="${esc(key)}"><span class="grp-names">${g.players.map((p) => esc(tidy(p))).join(' · ')}</span><span class="grp-n">${g.n} avond${g.n > 1 ? 'en' : ''} ›</span></button>`).join('');
      return `<div class="wrap">${head(gname)}<section><h1>Met <em>wie</em>?</h1></section><div class="grps">${list}</div></div>`;
    }
    const all1 = H.group === '*';
    const nights = all1 ? recs : recs.filter(({ h }) => groupKey(gPlayers(h, k)) === H.group);
    // Bij poker: alleen wie die avond echt meespeelde
    const inGame = (h) => (h[k].who ? h[k].who : h.players.map((_, i) => i));
    const players = all1 ? [...new Map(nights.flatMap(({ h }) => inGame(h).map((i) => [nameKey(h.players[i]), h.players[i]]))).values()] : (groups[H.group] ? groups[H.group].players : []);
    // Klassement voor dit spel en deze spelers
    const agg = {};
    nights.forEach(({ h }) => {
      const x = h[k], paid = gamePaidOf(h, k);
      const mx = paid ? Math.max(...paid) : Math.max(...x.lost);
      h.players.forEach((nm, i) => {
        if (!inGame(h).includes(i)) return;
        const a = agg[nameKey(nm)] = agg[nameKey(nm)] || { name: nm.trim(), nights: 0, won: 0, lost: 0, paid: 0, paidN: 0, loser: 0 };
        a.name = nicer(a.name, nm);
        a.nights++; a.won += x.won[i] || 0; a.lost += x.lost[i] || 0;
        if (paid) { a.paid += paid[i]; a.paidN++; }
        if (mx > 0 && (paid ? paid[i] : x.lost[i]) === mx) a.loser++;
      });
    });
    const avg = (a) => (a.paidN ? a.paid / a.paidN : Infinity);
    const names = Object.keys(agg).sort((a, b) => avg(agg[a]) - avg(agg[b]) || agg[b].won - agg[a].won || agg[a].loser - agg[b].loser);
    if (H.game === 'poker') {
      nights.forEach(({ h }) => { const x = h[k]; if (!x.net) return; h.players.forEach((nm, i) => { const a = agg[nameKey(nm)]; if (a) a.net = (a.net || 0) + x.net[i]; }); });
      names.sort((a, b) => (agg[b].net || 0) - (agg[a].net || 0));
    }
    const krows = names.map((nm, i) => { const a = agg[nm]; return H.game === 'poker'
      ? `<div class="krow"><span class="kn">${i + 1}</span><span class="kname">${esc(tidy(a.name))}<small>${a.nights} avond${a.nights > 1 ? 'en' : ''} · ${a.won}× winst · ${a.lost}× verlies</small></span>
        <span class="kpaid ${pn(a.net || 0)}">${(a.net || 0) > 0 ? '+' : (a.net || 0) < 0 ? '−' : ''}${euro(Math.abs(a.net || 0))}<small>${a.nights ? `gem. ${euro(Math.abs((a.net || 0) / a.nights))}` : ''}</small></span></div>`
      : `<div class="krow"><span class="kn">${i + 1}</span>
      <span class="kname">${esc(tidy(a.name))}<small>${a.won}–${a.lost} rondjes${a.loser ? ` · <b class="neg">${a.loser}× verliezer</b>` : ''}</small></span>
      <span class="kpaid">${a.paidN ? euro(a.paid) : '–'}<small>${a.paidN ? `gem. ${euro(a.paid / a.paidN)}` : ''}</small></span></div>`; }).join('');
    const items = nights.slice().reverse().map(({ h, idx }) => {
      const x = h[k], paid = gamePaidOf(h, k), open = ui.hOpen === idx;
      const mx = paid ? Math.max(...paid) : Math.max(...x.lost);
      const losers = mx > 0 ? h.players.filter((_, i) => (paid ? paid[i] : x.lost[i]) === mx) : [];
      const total = paid ? paid.reduce((a, b) => a + b, 0) : null;
      const body = open ? `<div class="hbody"><div class="h2h-wrap"><table class="h2h htab"><thead><tr><th></th><th scope="col">Won–verl.</th><th scope="col">Betaald</th></tr></thead><tbody>${h.players.map((nm, i) => (inGame(h).includes(i) ? `<tr><th class="rowh" scope="row" style="color:var(--p${i})">${esc(tidy(nm))}</th><td><span class="w">${x.won[i]}</span><span class="l">–${x.lost[i]}</span></td><td>${x.net ? `<span class="${pn(x.net[i])}">${x.net[i] > 0 ? '+' : x.net[i] < 0 ? '−' : ''}${euro(Math.abs(x.net[i]))}</span>` : paid ? euro(paid[i]) : '–'}</td></tr>` : '')).join('')}</tbody></table></div>
        <button class="link" data-act="hDel" data-v="${idx}" style="align-self:flex-start;color:${ui.hDel === idx ? 'var(--danger)' : ''}">${ui.hDel === idx ? 'Tik nog eens om deze avond te verwijderen' : 'Avond verwijderen'}</button></div>` : '';
      return `<div class="hitem ${open ? 'open' : ''}"><button class="hhead" data-act="hOpen" data-v="${idx}" aria-expanded="${open}">
        <span class="hmain"><span class="hdate">${esc(hDate(h.date))}</span><span class="hsub">${H.game === 'poker' ? `${inGame(h).length} spelers · ${inGame(h).map((i) => esc(tidy(h.players[i]))).join(', ')}` : `${x.r || x.n} rondje${(x.r || x.n) > 1 ? 's' : ''}${total ? ` · ${euro(total)}` : ''}`}</span>
        ${losers.length ? `<span class="hlos">Grote verliezer: <b>${losers.map(esc).join(' &amp; ')}</b></span>` : ''}</span><span class="chev">›</span></button>${body}</div>`;
    }).join('');
    return `<div class="wrap">${head(gname)}
      <section><h1>${esc(gname)}</h1><p class="lead">${all1 ? 'Alle spelers samen' : players.map((p) => esc(tidy(p))).join(' · ')}</p></section>
      <section class="panel"><h2>Klassement</h2><div>${krows}</div></section>
      <section class="panel"><div class="panel-head"><h2>Avonden</h2><span class="label">${nights.length}</span></div><div>${items}</div></section>
    </div>`;
  }

  // ---------- Start van de avond ----------
  const nightBusy = () => !!(openAny() || owedAll().n || S.pk.on);
  function renderStart() {
    const names = ui.names || S.players, n = names.length, locked = nightBusy();
    return `<div class="wrap">
      <header class="top"><div class="hl"><button class="btn ghost sm kbtn" data-act="goKelder" aria-label="Terug naar het Kelder-scherm">← Kelder</button><div class="brand">Spelletjes</div></div>${syncChip()}</header>
      <section><p class="label">${esc(today())}</p><h1>Wie speelt er <em>mee</em>?</h1>
        <p class="lead">In volgorde rond de tafel.</p></section>
      <form id="startForm" class="steps" autocomplete="off">
        <div class="panel" style="gap:0;padding-block:6px">${names.map((nm, i) => `<label class="pfield" style="--pc:var(--p${i})"><span>${i + 1}</span><input id="sp${i}" value="${esc(nm || '')}" placeholder="Speler ${i + 1}" maxlength="18" enterkeyhint="${i < n - 1 ? 'next' : 'done'}"></label>`).join('')}</div>
        ${locked ? '<p class="hint">Het aantal spelers ligt vast tot een nieuwe avond.</p>' : `<div class="np"><button type="button" class="btn ghost sm" data-act="npSet" data-v="-1" ${n <= 2 ? 'disabled' : ''}>− speler</button><span class="label">${n} spelers</span><button type="button" class="btn ghost sm" data-act="npSet" data-v="1" ${n >= 8 ? 'disabled' : ''}>+ speler</button></div>`}
        <p class="err" id="startErr" style="min-height:0"></p>
        <button class="btn primary xl" type="submit">Verder <span class="arr">→</span></button>
        <button class="btn ghost block" type="button" data-act="histOpen">Geschiedenis</button>
      </form></div>`;
  }

  // ---------- Overzicht van de avond ----------
  function rondjesTonight() {
    const items = [];
    finished().forEach((r) => items.push({ t: r.end || r.start, game: 'Troeven', price: r.price, txt: r.price ? `${tName(r, 1 - r.winner)} betalen` : `${tName(r, r.winner)} wonnen` }));
    PG_KEYS.forEach((g) => PG[g].st().rondjes.forEach((r) => {
      if (!r.end || r.price == null) return;
      const name = PG[g].title;
      const { out } = wPayPct(rankOf(g, r), r.pct);
      const mx = Math.max(...out);
      const most = out.map((_, i) => i).filter((i) => out[i] === mx);
      items.push({ t: r.end, game: name, price: r.price, txt: r.price ? `${most.map(P).join(' &amp; ')} ${most.length > 1 ? 'betalen' : 'betaalt'} het meest` : (() => { const best = out.map((_, i) => i).filter((i) => out[i] === Math.min(...out)); return `${best.map(P).join(' &amp; ')} ${best.length > 1 ? 'wonnen' : 'won'}`; })() });
    }));
    return items.sort((a, b) => a.t - b.t);
  }
  // Wanneer begon de avond? Het eerste rondje (van eender welk spel) of de poker
  function firstStart() {
    const ts = [...S.rounds.map((r) => r.start), ...PG_KEYS.flatMap((g) => PG[g].st().rondjes.map((r) => r.start)), S.pk.on ? S.pk.start : null].filter(Boolean);
    return ts.length ? Math.min(...ts) : null;
  }
  function liveTxt() {
    const t0 = firstStart(); if (!t0) return esc(today());
    const m = Math.max(0, Math.floor((Date.now() - t0) / 60000)), h = Math.floor(m / 60);
    return `Bezig sinds ${new Date(t0).toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' })} · ${h ? `${h}u ${String(m % 60).padStart(2, '0')}` : `${m} min`}`;
  }
  function renderHub() {
    const A = owedAll(), items = rondjesTonight();
    const list = items.map((x, k) => `<div class="rround"><span class="no">${k + 1}</span><div class="txt"><b>${x.game}</b><br><span class="muted">${x.txt}</span></div><div class="amt ${x.price ? '' : 'muted'}">${x.price ? euro(x.price) : 'gratis'}</div></div>`).reverse().join('');
    return `<div class="wrap hub">
      <header class="top"><div class="hl"><button class="btn ghost sm kbtn" data-act="goKelder" aria-label="Terug naar het Kelder-scherm">← Kelder</button><div class="brand">Spelletjes</div></div><div style="display:flex;gap:12px;align-items:center">${syncChip()}<button class="btn ghost sm" data-act="toStart">Spelers</button></div></header>
      <section><p class="label">${firstStart() ? `<span class="live" id="liveClock">${liveTxt()}</span>` : esc(today())}</p><h1>Welk <em>spel</em>?</h1>${A.n ? `<p class="lead">${A.n} rondje${A.n > 1 ? 's' : ''} gespeeld</p>` : ''}</section>
      ${tickerHTML()}
      ${gameTiles()}
      ${avondPanel()}
      ${items.length ? `<section class="panel"><h2>Rondjes</h2><div>${list}</div></section>` : ''}
      <button class="btn ghost block" data-act="histOpen">Geschiedenis</button>
      <section class="panel"><h2>Back-up</h2>
        <div class="row2"><button class="btn soft" data-act="backupOut">Bewaren</button><button class="btn soft" data-act="backupIn">Terugzetten</button></div>
        <p class="muted" id="bkMsg" style="margin:0;font-size:13px"></p></section>
    </div>${A.n || S.pk.on || (S.pk.past || []).length ? dock() : ''}`;
  }

  // ---------- Nieuw rondje: 1. prijs ----------
  function renderNPrice() {
    const last = S.lastPrice, g = GAMES.find((x) => x.k === ui.flow.game) || GAMES[0];
    if (ui.calc.target !== 'nprice') ui.calc = { expr: last ? fmt(last) : '', target: 'nprice' };
    return `<div class="wrap">
      <header class="top"><button class="btn ghost sm" data-act="flowBack">← Terug</button><span class="label">${g.name} · rondje ${owedAll().n + 1}</span></header>
      <section><h1>Wat kost <em>het rondje</em>?</h1><p class="lead">${g.k === 'troeven' ? 'De 2 verliezers betalen elk de helft.' : 'Daarna kies je wie hoeveel betaalt.'}</p></section>
      <form id="nPriceForm" class="steps" autocomplete="off">
        ${calcHTML()}
        ${last ? `<div><button type="button" class="chip" data-act="setprice" data-v="${last}">Zelfde als vorige · ${euro(last)}</button></div>` : ''}
        <p class="err" id="priceErr" style="min-height:0"></p>
        <button class="btn primary xl" type="submit">${g.k === 'troeven' ? 'Start' : 'Verder'} <span class="arr">→</span></button>
        <button class="btn ghost block" type="button" data-act="freeRondje">Zonder geld spelen</button>
      </form></div>`;
  }

  // ---------- Beginscherm ----------
  const greet = (h) => (h < 6 ? 'Goede nacht' : h < 12 ? 'Goedemorgen' : h < 18 ? 'Goedemiddag' : 'Goedenavond');
  const spTime = (d) => `${String(d.getHours()).padStart(2, '0')}<span class="col">:</span>${String(d.getMinutes()).padStart(2, '0')}`;
  function lastNightTxt() {
    const h = (S.history || []).slice(-1)[0]; if (!h) return '';
    const n = HKEYS.reduce((t, k) => t + (h[k] ? h[k].r || h[k].n || 0 : 0), 0);
    const paid = h.players.map((_, i) => HKEYS.reduce((t, k) => t + (h[k] && h[k].paid ? h[k].paid[i] || 0 : 0), 0)), mx = Math.max(...paid);
    return `Vorige avond · ${esc(hDate(h.date))}${n ? ` · ${n} rondje${n > 1 ? 's' : ''}` : ''}${mx > 0 ? ` · ${esc(tidy(h.players[paid.indexOf(mx)]))} betaalde het meest` : ''}`;
  }
  function renderSplash() {
    const d = new Date(), sec = d.getSeconds(), R = 46, C = 2 * Math.PI * R;
    const ticks = Array.from({ length: 60 }, (_, i) => { const a = (i / 60) * 2 * Math.PI, big = i % 5 === 0, r1 = big ? 40.6 : 42.6, r2 = 43.6;
      return `<line class="tick ${big ? 'big' : ''}" x1="${50 + r1 * Math.sin(a)}" y1="${50 - r1 * Math.cos(a)}" x2="${50 + r2 * Math.sin(a)}" y2="${50 - r2 * Math.cos(a)}"/>`; }).join('');
    const suits = ['♠', '♥', '♦', '♣', '♠', '♥', '♦', '♣', '♠', '♥'].map((x, i) => `<span class="suit" style="left:${(i * 37 + 7) % 96}%;font-size:${20 + ((i * 13) % 22)}px;animation-duration:${14 + ((i * 7) % 11)}s;animation-delay:-${(i * 2.3).toFixed(1)}s">${x}</span>`).join('');
    const icons = GAMES.map((g) => `<span class="${g.cls}">${GAME_ART[g.k]}</span>`).join('') + `<span class="g-poker">${GAME_ART.poker}</span>`;
    const last = lastNightTxt();
    return `<div class="splash" data-act="splashGo" role="button" aria-label="Tik om naar de spelletjes te gaan">
      <div class="sky" aria-hidden="true"><b></b><b></b><b></b><b></b>${skyBits()}</div>
      <div class="sptop"><div class="kname">Kelder</div><div class="rule"></div></div>
      <div class="mid">
        <div class="ring">
          <svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="spg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--t1)"/><stop offset="1" stop-color="var(--t2)"/></linearGradient>
            <linearGradient id="spt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="var(--gold)"/></linearGradient></defs>
            <circle class="halo" cx="50" cy="50" r="${R}"/>${ticks}<circle class="trk" cx="50" cy="50" r="${R}"/>
            <circle class="sec" id="spSec" cx="50" cy="50" r="${R}" transform="rotate(-90 50 50)" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - sec / 60)).toFixed(2)}"/>
            <circle class="tail" id="spTail" cx="50" cy="50" r="${R}" transform="rotate(-90 50 50)" stroke-dasharray="0 ${C.toFixed(2)}"/>
            <circle class="dot" id="spDot" r="1.5" cx="${50 + R * Math.sin((sec / 60) * 2 * Math.PI)}" cy="${50 - R * Math.cos((sec / 60) * 2 * Math.PI)}"/></svg>
          <div><div class="time" id="spTime">${spTime(d)}</div><div class="date" id="spDate">${esc(today())}</div></div>
        </div>
        <div class="icons">${icons}</div>
      </div>
      <div class="side">${spCardHTML()}</div>
      <div class="devs">${DEVS.map((x) => `<button class="dev ${x.k} ${x.k === 'tv' && LINK.code ? 'on' : ''}" style="--dc:${x.c}" data-act="devOpen" data-v="${x.k}" aria-label="${x.n}">${x.svg}<span>${x.n}</span></button>`).join('')}</div>
    </div>`;
  }
  // Sterren en zwevende lichtjes op het Kelder-scherm (vaste plaatsen, zodat het niet verspringt)

QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
	
	var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
	
	if (rsBlock === undefined) {
		throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);
	}

	var length = rsBlock.length / 3;
	
	var list = [];
	
	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );	
		}
	}
	
	return list;
};

QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {

	switch(errorCorrectLevel) {
	case QRErrorCorrectLevel.L :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
	case QRErrorCorrectLevel.M :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
	case QRErrorCorrectLevel.Q :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
	case QRErrorCorrectLevel.H :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
	default :
		return undefined;
	}
};
